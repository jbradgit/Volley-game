    } else if (state===ST.OVER) { ttClear(); drawOver(); }
    else if (state===ST.MENU) { ttClear(); drawMenu(); }
    else if (state===ST.NAME) { ttClear(); drawName(); }
    else if (state===ST.CLUBSEL) { ttClear(); drawClubSelect(); }
    else if (state===ST.TABLE) { ttClear(); drawTable(); }
    else if (state===ST.SEASONEND) { ttClear(); drawSeasonEnd(); }
    else if (state===ST.DAILYBOARD) { ttClear(); drawDailyBoard(); }
    else if (state===ST.HORSESETUP) { ttClear(); drawHorseSetup(); }
    else if (state===ST.HORSEPASS) { ttClear(); drawHorsePass(); }
    else if (state===ST.HORSEEND) { ttClear(); drawHorseEnd(); }
  }

  // ---- input ----
  const input = { left:false, right:false };
  let spaceLock=false, enterLock=false, dragging=false;
  // touch detection + a hidden <input> to summon the iOS/Android soft keyboard for text entry
  const TOUCH = (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
  const kbd = document.getElementById("kbd");
  function sanitizeField(v,max,wordOnly){ v=(v||"").toUpperCase(); v = wordOnly ? v.replace(/[^A-Z]/g,"") : v.replace(/[^A-Z0-9 .'-]/g,""); return v.slice(0,max); }
  function kbdOpen(val){ try{ kbd.value=val||""; kbd.focus(); }catch(e){} }
  function kbdClose(){ try{ kbd.blur(); }catch(e){} }
  function confirmName(){
    if(!nameBuf.trim()) return; menuSel=0; kbdClose();
    if (pendingMode==="daily"){ localStorage.setItem("vc_name", nameBuf.trim().toUpperCase()); startDaily(); }
    else state=ST.CLUBSEL;
  }
  function togglePause(){ if(state===ST.SERVE||state===ST.FLIGHT||state===ST.RESULT) paused=!paused; }
  function forfeit(){            // give up the current match -> career home (counts as a loss) / menu
    paused=false;
    if (GMODE==="career" && CAR){ M.score=0; endMatch(); }
    else { GMODE="career"; H=null; clearResult(); state=ST.MENU; menuSel=0; }
  }
  function goBack(){             // ESC = back / forfeit
    if (state===ST.NAME){ kbdClose(); state=ST.MENU; menuSel=0; }
    else if (state===ST.CLUBSEL){ if(pendingMode==="career"){ state=ST.NAME; kbdOpen(nameBuf); } else state=ST.MENU; menuSel=0; }
    else if (state===ST.TABLE || state===ST.SEASONEND){ GMODE="career"; state=ST.MENU; menuSel=0; }
    else if (state===ST.HORSESETUP){ kbdClose(); state=ST.MENU; menuSel=0; }
    else if (state===ST.DAILYBOARD || state===ST.HORSEEND || state===ST.HORSEPASS){ GMODE="career"; H=null; state=ST.MENU; menuSel=0; }
    else if (state===ST.OVER){ clearResult(); state=ST.MENU; menuSel=0; }
    else if (state===ST.COUNTDOWN){ forfeit(); }   // not kicked off yet -> straight out
    else if (state===ST.SERVE||state===ST.FLIGHT||state===ST.RESULT){
      if (paused) forfeit();                       // ESC again (while paused) forfeits
      else if (canCheckout()) checkoutEarly();     // WIN secured -> ESC banks it early
      else paused=true;                            // otherwise ESC pauses
    }
  }
  // SPACE / select pressed (varies by screen)
  function pressSelect(){
    audio();
    if (state===ST.MENU){
      const opts=menuOptions(), o=opts[menuSel];
      if (!TEAMS.length) return;                          // wait for roster
      if (o==="DAILY CHALLENGE"){ if(localStorage.getItem("vc_name")){ startDaily(); } else { pendingMode="daily"; nameBuf=""; state=ST.NAME; kbdOpen(""); } }
      else if (o==="2 PLAYER"){ hSetup=["","","HORSE"]; hField=0; state=ST.HORSESETUP; kbdOpen(""); }
      else if (o==="CONTINUE CAREER"){ CAR=loadCareer(); if(CAR){ GMODE="career"; CAR.titleOdds=null; menuSel=0; state=(CAR.idx>=CAR.fixtures.length)?ST.SEASONEND:ST.TABLE; } }
      else { GMODE="career"; pendingMode="career"; nameBuf=""; state=ST.NAME; kbdOpen(""); }   // NEW CAREER
    }
    else if (state===ST.NAME){ confirmName(); }
    else if (state===ST.CLUBSEL){ if(TEAMS.length){
      const slug=TEAMS[menuSel].slug; GMODE="career"; newCareer(nameBuf.trim()||"You", slug); state=ST.TABLE;
    } }
    else if (state===ST.TABLE){ startFixture(); }
    else if (state===ST.SEASONEND){ nextSeason(null); }
    else if (state===ST.MATCHEND){ if(matchEndTimer<2.2) commitMatch(); }   // skip the burst (after a beat)
    else if (state===ST.DAILYBOARD || state===ST.HORSEEND){ GMODE="career"; H=null; clearResult(); state=ST.MENU; menuSel=0; }
    else if (state===ST.HORSEPASS){ startHorseTurn(); }
    else if (state===ST.OVER){ clearResult(); state=ST.MENU; menuSel=0; }
    else if (state===ST.SERVE){ if(!paused) triggerKick(); }
  }
  function pressEnter(){
    if (state===ST.NAME){ confirmName(); }
    else if (state===ST.MENU||state===ST.TABLE||state===ST.SEASONEND||state===ST.CLUBSEL||state===ST.OVER||
             state===ST.MATCHEND||state===ST.DAILYBOARD||state===ST.HORSEPASS||state===ST.HORSEEND) pressSelect();
    else togglePause();                                   // in-match: ENTER = pause
  }
  function moveSel(dx,dy){
    if (state===ST.MENU){ menuSel += dy; const n=menuOptions().length; menuSel=(menuSel+n)%n; }
    else if (state===ST.CLUBSEL){ const rows=10, n=TEAMS.length||20;   // 2 cols x 10, column-major
      let i=menuSel + dy + dx*rows; menuSel=((i%n)+n)%n; }
    else { if(dx<0) input.left=true; if(dx>0) input.right=true; mouseTargetX=null; }   // in-match: arrows move man (override mouse)
  }
  window.addEventListener("keydown",(e)=>{
    if (document.activeElement===kbd) return;   // text entry handled by the hidden input's own listeners
    const k=e.code;
    if (k==="Escape"){ e.preventDefault(); goBack(); return; }
    if (state===ST.NAME){
      if (k==="Enter"){ e.preventDefault(); if(!enterLock){enterLock=true; pressEnter();} return; }
      if (k==="Backspace"){ e.preventDefault(); nameBuf=nameBuf.slice(0,-1); return; }
      if (e.key && e.key.length===1 && nameBuf.length<14 && /[A-Za-z0-9 .'-]/.test(e.key)){
        e.preventDefault(); nameBuf += e.key.toUpperCase();                       // CAPS only
      }
      return;
    }
    if (state===ST.HORSESETUP){      // 3-field entry: P1, P2, ROUNDS WORD
      if (k==="Enter"){ e.preventDefault(); if(!enterLock){ enterLock=true; if(hField<2) hField++; else beginHorse(); } return; }
      if (k==="ArrowDown"){ e.preventDefault(); hField=Math.min(2,hField+1); return; }
      if (k==="ArrowUp"){ e.preventDefault(); hField=Math.max(0,hField-1); return; }
      if (k==="Backspace"){ e.preventDefault(); hSetup[hField]=hSetup[hField].slice(0,-1); return; }
      if (e.key && e.key.length===1){
        const max = hField<2?12:8, ok = hField<2 ? /[A-Za-z0-9 .'-]/.test(e.key) : /[A-Za-z]/.test(e.key);
        if (ok && hSetup[hField].length<max){ e.preventDefault(); hSetup[hField]+=e.key.toUpperCase(); }
      }
      return;
    }
    if (k==="KeyF"){ e.preventDefault(); toggleFullscreen(); return; }   // F = fullscreen (typing screens return earlier)
    if (state===ST.SEASONEND){
      if (k==="KeyY"){ const o=seasonOffer(); if(o) nextSeason(o.slug); return; }
      if (k==="KeyN"){ nextSeason(null); return; }
    }
    if(k==="ArrowLeft"){ e.preventDefault(); moveSel(-1,0); }
    else if(k==="ArrowRight"){ e.preventDefault(); moveSel(1,0); }
    else if(k==="ArrowUp"){ e.preventDefault(); moveSel(0,-1); }
    else if(k==="ArrowDown"){ e.preventDefault(); moveSel(0,1); }
    else if(k==="Enter"){ e.preventDefault(); if(!enterLock){ enterLock=true; pressEnter(); } }
    else if(k==="Space"){ e.preventDefault(); if(!spaceLock){ spaceLock=true; pressSelect(); } }
  });
  window.addEventListener("keyup",(e)=>{
    if(e.code==="ArrowLeft") input.left=false;
    else if(e.code==="ArrowRight") input.right=false;
    else if(e.code==="Space") spaceLock=false;
    else if(e.code==="Enter") enterLock=false;
  });
  // ---- hidden-input text entry (soft keyboard on phones; also used on desktop while focused) ----
  kbd.addEventListener("input",()=>{
    if (state===ST.NAME){ nameBuf=sanitizeField(kbd.value,14,false); if(kbd.value!==nameBuf) kbd.value=nameBuf; }
    else if (state===ST.HORSESETUP){ const wordOnly=hField===2, max=wordOnly?8:12;
      hSetup[hField]=sanitizeField(kbd.value,max,wordOnly); if(kbd.value!==hSetup[hField]) kbd.value=hSetup[hField]; }
  });
  kbd.addEventListener("keydown",(e)=>{
    if (e.key==="Enter"){ e.preventDefault();
      if (state===ST.NAME) confirmName();
      else if (state===ST.HORSESETUP){ if(hField<2){ hField++; kbd.value=hSetup[hField]; } else { kbdClose(); beginHorse(); } }
    } else if (e.key==="Escape"){ e.preventDefault(); kbdClose(); goBack(); }
    else if (state===ST.HORSESETUP && (e.key==="ArrowUp"||e.key==="ArrowDown")){ e.preventDefault();
      hField = e.key==="ArrowDown"?Math.min(2,hField+1):Math.max(0,hField-1); kbd.value=hSetup[hField]; }
  });
  // ---- mouse / pointer control ----
  function evToLogical(e){
    const r=canvas.getBoundingClientRect();
    return { x:(e.clientX-r.left)/r.width*SW, y:(e.clientY-r.top)/r.height*SH };
  }
  function menuHit(mx,my){            // mirrors drawMenu geometry
    const opts=menuOptions();
    for(let i=0;i<opts.length;i++){ const y=MENU_Y0+i*MENU_DY;
      if(mx>=SW/2-MENU_BW/2 && mx<=SW/2+MENU_BW/2 && my>=y-27 && my<=y+9) return i; }
    return -1;
  }
  function clubHit(mx,my){            // mirrors drawClubSelect geometry (2 cols x 10)
    const rows=10,cw=262,ch=30,x0=14,y0=62;
    for(let i=0;i<TEAMS.length;i++){ const col=Math.floor(i/rows),row=i%rows,cx=x0+col*cw,cy=y0+row*ch;
      if(mx>=cx && mx<=cx+cw-6 && my>=cy && my<=cy+ch-3) return i; }
    return -1;
  }
  // map a pointer's on-screen logical x to the striker's logical x (mirror when left-footed)
  function manTargetFromPointer(px){ return clamp(leftFooted ? (2*GCX - px) : px, MAN_MIN_X, MAN_MAX_X); }
  function horseFieldHit(p){ for(let i=0;i<3;i++){ const y=112+i*64; if(p.x>=SW/2-180 && p.x<=SW/2+180 && p.y>=y-10 && p.y<=y+28) return i; } return -1; }
  const inPlay = (s)=> s===ST.SERVE||s===ST.FLIGHT||s===ST.COUNTDOWN;
  canvas.addEventListener("pointermove",(e)=>{
    const p=evToLogical(e);
    if(state===ST.MENU){ const i=menuHit(p.x,p.y); if(i>=0) menuSel=i; }
    else if(state===ST.CLUBSEL){ const i=clubHit(p.x,p.y); if(i>=0) menuSel=i; }
    else if(inPlay(state) && (dragging || e.pointerType==="mouse")){
      e.preventDefault(); mouseTargetX=manTargetFromPointer(p.x);   // drag (or mouse-hover) to aim
    }
  },{passive:false});
  canvas.addEventListener("pointerdown",(e)=>{
    e.preventDefault(); audio(); const p=evToLogical(e);
    if(paused){ return; }
    if(state===ST.MENU){ const i=menuHit(p.x,p.y); if(i>=0){ menuSel=i; pressSelect(); } }
    else if(state===ST.CLUBSEL){ const i=clubHit(p.x,p.y); if(i>=0){ menuSel=i; pressSelect(); } }
    else if(state===ST.HORSESETUP){ const f=horseFieldHit(p); if(f>=0){ hField=f; kbdOpen(hSetup[hField]); } else kbdOpen(hSetup[hField]); }
    else if(inPlay(state)){
      if(canCheckout() && p.y<42 && p.x<360){ checkoutEarly(); return; }   // tap the banner to bank the win
      dragging=true; mouseTargetX=manTargetFromPointer(p.x);               // press-drag to aim...
    }
    else { pressSelect(); }   // NAME / TABLE / boards advance on tap
  },{passive:false});
  canvas.addEventListener("pointerup",(e)=>{
    e.preventDefault();
    if(dragging){ dragging=false; if(state===ST.SERVE && !kicked && !paused) triggerKick(); }   // ...release to shoot
  },{passive:false});
  canvas.addEventListener("pointercancel",()=>{ dragging=false; });

  // ---- fixed-timestep loop at 28 Hz ----
  let last=performance.now(), acc=0;
  function tick(now){
    let frame=(now-last)/1000; last=now; if(frame>0.25) frame=0.25; acc+=frame;
    flash=Math.max(0,flash-frame*1.6);
    while(acc>=DT){ if(assetsReady) swfFrame(); acc-=DT; }
    render();
  }
  const CAP = /[?&]cap=1/.test(location.search);
  function loop(now){ if(!CAP) tick(now); requestAnimationFrame(loop); }   // in cap mode the interval drives ticks
  requestAnimationFrame(loop);
  // Dev/verification aid: rAF is throttled while the tab is backgrounded/offscreen. With ?cap=1
  // drive the sim+render from a fixed interval (sole driver) so frames advance headlessly,
  // and expose handles so a connecting shot / a screen can be scripted for verification.
  if (CAP) {
    setInterval(function(){ tick(performance.now()); }, DT*1000);
    window.__dbg = {
      tick: function(){ tick(performance.now()); },
      setScore: function(s){ M.score=s; return M.score; },   // dev: force score (e.g. to test early checkout)
      kick: triggerKick,
      setMan: function(x){ manX = x; },
      pause: togglePause,
      step: function(n){ for(var i=0;i<(n||1);i++) swfFrame(); return {state,xball:Math.round(xball),yball:Math.round(yball),z:Math.round(z),booted,kicked,manFinished,dbx:Math.round(dbx),dive,no_dive,divedirn,hk:hitkeeper}; },
      forceShot: function(x0,dbxv,zv,keepDef){   // deterministic flight for testing resolution
        countdownT=0; setTargets(); booted=true; innet=false; bounced=1;
        xball=x0; yball=250; z=zv; dbx=dbxv; dby=zv; ybit=YBIT; checked=false;
        dive=false; no_dive=true; divedirn="up"; destination=0; end=0; sc=0;
        kicked=true; cchecked=true; manFinished=true; held=false;
        hitkeeper=0; hitbar=false; lposthit=false; rposthit=false; leftcorner=0; rightcorner=0; topnet=0;
        keeperPose={x:KEEPER_START_X,dir:"up",anim:"idle",frame:1};
        if(!keepDef) defenders.forEach(d=>d.chk=true); window.__rs=null; window.__df=[]; state=ST.FLIGHT;
      },
      vars: function(){ return { state, paused, xball:Math.round(xball), yball:Math.round(yball), z:Math.round(z),
        booted, dive, no_dive, divedirn, kAnim:keeperPose.anim, kFrame:keeperPose.frame, kx:Math.round(keeperPose.x),
        manX:Math.round(manX), mouseTargetX:(mouseTargetX==null?null:Math.round(mouseTargetX)),
        leftFooted, matchEndText, score:M.score }; },
      forcePause: function(){ paused=!paused; return paused; },
      setLeft: function(b){ leftFooted=!!b; return leftFooted; },
      // Measure the keeper sprite's exact pixel bbox as savedCheck() sees it (logical coords).
      keeperExtent: function(frameNum, kx){
        keeperPose.frame=frameNum; if(kx!=null) keeperPose.x=kx;
        offCtx.setTransform(1,0,0,1,0,0); offCtx.clearRect(0,0,SW,420); drawKeeperTo(offCtx);
        const d=offCtx.getImageData(0,0,SW,420).data;
        let minx=9999,maxx=-1,miny=9999,maxy=-1;
        for(let y=0;y<420;y++)for(let x=0;x<SW;x++){ if(d[(y*SW+x)*4+3]>16){ if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y; } }
        return {frame:frameNum, kx:Math.round(keeperPose.x), minx,maxx,miny,maxy};
      },
      // Deterministic serve (fixed velocity/angle), real contact path, no menu needed.
      serve: function(vel,ang){
        setTargets();
        velocity=(vel||20); angle=(ang||37); cangle=Math.cos(angle*DEG); sangle=Math.sin(angle*DEG);
        t=0; bounce=0; bounced=1; booted=false; innet=false; ay=0;
        xball=0; yball=SERVE_Y; z=0; dbx=0; dby=0; ybit=YBIT; yscale=93;
        checked=false; dive=false; no_dive=true; divedirn="up"; destination=0; keeperX=KEEPER_START_X;
        kicked=false; cchecked=false; kickTick=0; manFinished=false; complete_miss=false; end=0; sc=0;
        hitkeeper=0; held=false; hitbar=false; lposthit=false; rposthit=false;
        leftcorner=0; rightcorner=0; topnet=0; znet=0; manKicking=false; manKickT=0;
        keeperPose={ x:KEEPER_START_X, dir:"up", anim:"idle", frame:1 };
        defenders=[
          { ox:117.95, oy:210.25, sx:1.0000, sy:1.0000, thr:240, mag:10, sign:-1, chk:false },
          { ox: 27.60, oy:163.35, sx:0.8982, sy:0.8960, thr:200, mag:20, sign:-1, chk:false },
          { ox:471.15, oy:157.75, sx:0.8234, sy:0.8264, thr:200, mag:10, sign:+1, chk:false } ];
        M.score=0; M.attempts=10; manX=MAN_START_X; mouseTargetX=null; window.__rs=null; clearResult(); state=ST.SERVE;
      },
      // Run ONE real shot: serve, position man, trigger kick at tick `kt`, step to result. Returns the outcome.
      realShot: function(manXpos, kt, vel, ang, noDef){
        this.serve(vel,ang); manX=manXpos;
        if (noDef) defenders.forEach(d=>d.chk=true);
        let contactX=null, contactDbx=null, contactZ=null;
        for (let i=0;i<260;i++){
          if (i===kt) triggerKick();
          const wasBooted=booted; swfFrame();
          if (!wasBooted && booted){ contactX=Math.round(xball); contactDbx=Math.round(dbx); contactZ=Math.round(z); }
          if (state===ST.RESULT || state===ST.OVER) break;
        }
        const rs = window.__rs||{};
        return { kt, connected:!!contactX, contactX, contactDbx, contactZ,
                 finalx:rs.finalx, zres:rs.z, hk:rs.hk, innet:rs.innet, rp:rs.rp, lp:rs.lp, bar:rs.bar,
                 result:resultText, scored:M.score };
      },
      // Sweep all kick timings for a manX; report only CONNECTED shots, tagging wide/over verdicts.
      sweep: function(manXpos, vel, ang, noDef){
        const out=[];
        for (let kt=0; kt<46; kt++){
          const r=this.realShot(manXpos, kt, vel, ang, noDef);
          if (!r.connected) continue;
          const fx=r.finalx, zz=r.zres;
          const wide = (fx!=null) && (fx>RPOST+POSTTOL || fx<LPOST-POSTTOL);
          const over = (zz!=null) && (zz>BARH);
          out.push({kt, cX:r.contactX, cDbx:r.contactDbx, fx, z:zz, hk:r.hk, net:r.innet?1:0,
                    wide:wide?1:0, over:over?1:0, res:r.result, sc:r.scored});
        }
        return out;
      }
    };
  }
})();
</script>
