<title>SCORDAGOL — Volley Your Way To Greatness</title>
<!-- Retro fonts: VT323 = teletext/CRT body text · Press Start 2P = chunky 8-bit (countdown, headings).
     Falls back to monospace offline; self-host these for the production/app build. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #04060a; overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: #fff; -webkit-user-select: none; user-select: none;
    touch-action: none; -webkit-touch-callout: none; overscroll-behavior: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { background: #04060a; image-rendering: auto; max-width: 100%; max-height: 100%;
           box-shadow: 0 0 50px rgba(0,0,0,0.85); touch-action: none; }
  /* off-screen field used to summon the iOS keyboard for name / word entry */
  #kbd { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0;
         border: 0; padding: 0; font-size: 16px; background: transparent; color: transparent; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1100" height="1040"></canvas></div>
<input id="kbd" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" />

<script>
"use strict";
(function () {
  // ---- Logical stage ----
  // SW/SH = the FIELD (gameplay) coordinate space — physics, sprites and every draw* live here,
  // UNCHANGED from the original SWF. VW = the landscape VIEW the field is centred inside (16:9).
  const SW = 550, SH = 520;          // field stage (physics-exact; do not change)
  let SCALE = 2;                     // backing-store supersample (recomputed in fit() to match the display = crisp text)
  const VW = 924;                    // landscape view width (16:9 of SH=520) — widescreen monitors + phones
  const OX = Math.round((VW - SW) / 2);   // x-offset that centres the 550-wide field within the 924 view
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  canvas.width = VW * SCALE; canvas.height = SH * SCALE;   // backing store (single source of truth = VW)

  function fit() {
    const r = Math.min(window.innerWidth / VW, window.innerHeight / SH);
    const cssW = Math.floor(VW * r), cssH = Math.floor(SH * r);
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    // size the backing store to the ACTUAL on-screen pixels so the canvas is never up-scaled (= crisp text, no blur)
    const dpr = window.devicePixelRatio || 1, want = Math.max(2, Math.min(4, (cssW * dpr) / VW));
    if (Math.abs(want - SCALE) > 0.01){ SCALE = want; canvas.width = Math.round(VW*SCALE); canvas.height = Math.round(SH*SCALE); }
  }
  window.addEventListener("resize", fit); fit();
  function toggleFullscreen(){
    try { if (!document.fullscreenElement){ const el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); }
          else { (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); } } catch(e){}
  }
  document.addEventListener("fullscreenchange", ()=>setTimeout(fit,60));

  // Your club + current opponent (both per-team recoloured; defaults used for Quick Play).
  let MYCLUB   = { slug:"Liverpool", name:"Liverpool", rating:8 };
  let OPPONENT = { slug:"AstonVilla", name:"Aston Villa", rating:9, home:false };

  // ---- Static assets (kits are loaded dynamically per club, see loadKits) ----
  const IMG = {};
  const sources = { backdrop:"assets/stadium/backdrop.png?v=1",
                    logo:"assets/ui/logo.png?v=2",
                    trophyL:"assets/ui/trophy_league.png?v=1", trophyC:"assets/ui/trophy_cup.png?v=1",
                    trophyE:"assets/ui/trophy_euro.png?v=1",   trophyI:"assets/ui/trophy_intl.png?v=1",
                    katlas:"assets/sprites/keeper_atlas.png?v=m2",
                    ball:"assets/sprites/ball_sheet.png?v=m1", shadow:"assets/sprites/shadow.png?v=s1",
                    strikersheet:"assets/sprites/striker_sheet.png?v=m5",
                    defbase:"assets/sprites/defender_sheet.png?v=m2" };
  let loaded = 0, total = Object.keys(sources).length, assetsReady = false;
  for (const k in sources) {
    const im = new Image();
    im.onload = () => { if (++loaded === total) assetsReady = true; };
    im.onerror = () => { if (++loaded === total) assetsReady = true; };
    im.src = sources[k]; IMG[k] = im;
  }
  let kitsReady = false;
  const _hexRGB = h => { const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; };
  // ================= UNIVERSAL KIT RENDERER (docs/SPRITE_SPEC.md) =================
  // The sprite bases are REGION-TAGGED: pure hues mark recolourable areas, pixel
  // brightness carries the shading. One base set renders ANY kit live:
  //   red=shirt  green=shorts  blue=socks  yellow=sleeves  magenta=hair
  // Patterns (stripes/hoops/halves/quarters/sash) are computed inside the shirt bbox.
  const SPRITES = { striker:[], defender:null, keeper:null };   // per-match recoloured canvases
  function tagOf(r,g,b){
    if (r>140 && g<100 && b<100) return 1;                          // shirt:  R=shade, G=u, B=v
    if (g>140 && r<100 && b<100) return 2;                          // shorts: G=shade, R=u, B=v
    if (b>140 && r<100 && g<100) return 3;                          // socks:  B=shade, R=u, G=v
    if (r>140 && g>140 && b<100 && Math.abs(r-g)<30) return 4;      // sleeves:RG=shade, B=u
    if (r>140 && b>140 && g<100 && Math.abs(r-b)<30) return 5;      // hair:   RB=shade
    return 0;
  }
  // patterns evaluated in PER-PART UV space (baked into the base sprite channels):
  // stripes run parallel to the part and mirror symmetrically from its centre line.
  function patVal(p,u,v){
    if (p==="stripes") return Math.floor(Math.min(0.999,u)*7)%2;
    if (p==="hoops")   return Math.floor(Math.min(0.999,v)*9)%2;
    if (p==="halves")  return u>0.5?1:0;
    if (p==="quarters")return ((u>0.5)?1:0)^((v>0.5)?1:0);
    if (p==="sash")    return Math.abs(u+v-1)<0.18?1:0;
    return 0;
  }
  function kitCols(kit){ const g=n=>PAL[n]||n||"#cccccc";
    return { c1:_hexRGB(g(kit.c1)), c2:_hexRGB(g(kit.c2||kit.c1)), sleeves:_hexRGB(g(kit.sleeves||kit.c1)),
             shorts:_hexRGB(g(kit.shorts||"white")), socks:_hexRGB(g(kit.socks||kit.c1)) };
  }
  function buildKit(im, kit, hairRGB){
    const c=document.createElement("canvas"); c.width=im.naturalWidth; c.height=im.naturalHeight;
    const g=c.getContext("2d",{willReadFrequently:true}); g.drawImage(im,0,0);
    const id=g.getImageData(0,0,c.width,c.height), d=id.data, K=kitCols(kit);
    for (let i=0;i<d.length;i+=4){
      if (d[i+3]<8) continue;
      const r=d[i],gg=d[i+1],b=d[i+2], tg=tagOf(r,gg,b); if(!tg) continue;
      let shade, col;
      if (tg===1){ shade=r; col = patVal(kit.p, gg/88, b/88) ? K.c2 : K.c1; }
      else if (tg===2){ shade=gg; col=K.shorts; }
      else if (tg===3){ shade=b;  col=K.socks; }
      else if (tg===4){ shade=(r+gg)/2; col=K.sleeves; }
      else { shade=(r+b)/2; col=hairRGB||[60,44,34]; }
      const f=shade/255*1.04;                       // cel bands survive any kit colour
      d[i]=Math.min(255,col[0]*f); d[i+1]=Math.min(255,col[1]*f); d[i+2]=Math.min(255,col[2]*f);
    }
    g.putImageData(id,0,0); return c;
  }
  // kit selection: home side wears home; the visitor switches to away on a colour clash
  function kitFor(slug, away){
    const t=TEAMBY[slug]||{};
    const ks=t.kits||{ h:{ p:(t.pattern==="stripes"?"stripes":"solid"), c1:t.shirt||"grey", c2:t.stripe2,
                           sleeves:(t.sleeves&&t.sleeves!==t.shirt)?t.sleeves:null,
                           shorts:t.shorts||"white", socks:t.socks||t.shirt||"grey" },
                       a:{ p:"solid", c1:(t.shirt==="white"?"red":"white"), shorts:"black", socks:"white" } };
    return away ? (ks.a||ks.h) : ks.h;
  }
  const kitHex=k=>PAL[k.c1]||k.c1||"#cccccc";
  const GK_COLS=["#ffe23d","#3df04f","#ff8a00","#b9c2cc"];   // era keeper kits: yellow/green/orange/grey
  function loadKits(mySlug, oppSlug, cb){
    kitsReady=false;
    let myKit=kitFor(mySlug,false), oppKit=kitFor(oppSlug,false);
    if (OPPONENT.home){ if (colDist(kitHex(myKit), kitHex(oppKit))<95) myKit=kitFor(mySlug,true); }
    else              { if (colDist(kitHex(oppKit), kitHex(myKit))<95) oppKit=kitFor(oppSlug,true); }
    const hair=HAIR_COLOURS[rnd(HAIR_COLOURS.length)];
    SPRITES.striker  = (IMG.strikersheet&&IMG.strikersheet.naturalWidth) ? buildKit(IMG.strikersheet, myKit, hair) : null;
    SPRITES.defender = (IMG.defbase&&IMG.defbase.naturalWidth) ? buildKit(IMG.defbase, oppKit, HAIR_COLOURS[rnd(HAIR_COLOURS.length)]) : null;
    const gk = GK_COLS.find(cn => colDist(cn,kitHex(myKit))>110 && colDist(cn,kitHex(oppKit))>110) || GK_COLS[0];
    SPRITES.keeper   = (IMG.katlas&&IMG.katlas.naturalWidth) ? buildKit(IMG.katlas, {p:"solid",c1:gk,shorts:"#15171d",socks:gk}, [34,28,24]) : null;
    kitsReady=true; cb&&cb();
  }
  // Team roster (kits + ratings) for career mode.
  let TEAMS = [], TEAMBY = {}, PAL = {};
  let rosterStatus = "loading";   // loading | ok | error  (surfaced on the menu so failures aren't silent)
  fetch("assets/teams.json")
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(j=>{
      TEAMS=j.teams.slice().sort((a,b)=>a.name.localeCompare(b.name));   // club-select listed A–Z
      PAL=j.palette; for (const t of TEAMS) TEAMBY[t.slug]=t; rosterStatus="ok"; })
    .catch(e=>{ rosterStatus="error"; try{ console.error("teams.json failed to load:", e); }catch(_){} });
  // Keeper sprite-atlas manifest (per-frame rects + offsets, all 371-frame anims packed).
  let KMAN = null;
  fetch("assets/sprites/keeper_atlas.json?v=m2").then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(j=>{ KMAN = j.frames; })
    .catch(e=>{ try{ console.error("keeper_atlas.json failed to load:", e); }catch(_){} });
  // ---- L1 perimeter ad boards: manifest + images (sold sponsor boards just replace files in
  // assets/boards/ + boards.json — no code change). Failure falls back to procedural house boards.
  // NB: paths must never contain "ads"/"advert" — desktop ad-blockers block such URLs.
  const HOARD_Y = 104, HOARD_H = 34, HOARD_SLOT = 132, HOARD_N = 7;   // 7 x 132 = 924 = VW (docs/STADIUM_ASSET_SPEC.md §3)
  let ADS = [], ADS_IMG = {}, matchBoards = [];
  fetch("assets/boards/boards.json?v=1")
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(j=>{ ADS = j.boards||[];
      for (const b of ADS){ const im=new Image(); im.src="assets/boards/"+b.img+"?v=1"; ADS_IMG[b.id]=im; } })
    .catch(e=>{ try{ console.error("boards.json failed to load:", e); }catch(_){} });
  function pickBoards(pr){       // weighted pick of 7 boards; pr = match RNG so seeded (daily/HORSE) matches show identical boards
    matchBoards = [];
    if (!ADS.length) return;
    const tot = ADS.reduce((s,b)=>s+(b.weight||1), 0);
    const draw = ()=>{ let x=pr()*tot, id=ADS[ADS.length-1].id;
      for (const b of ADS){ x -= (b.weight||1); if (x<=0){ id=b.id; break; } } return id; };
    for (let i=0;i<HOARD_N;i++){
      let id = draw();
      for (let tries=0; ADS.length>1 && id===matchBoards[i-1] && tries<8; tries++) id = draw();   // no same board twice in a row
      matchBoards.push(id);
    }
  }
  // ---- world data: European clubs, nations (flags + real-life-based ratings), cup minnows ----
  let WORLD=null, worldStatus="loading";
  fetch("assets/world/world.json?v=1")
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(j=>{ WORLD=j; worldStatus="ok";
      for (const t of [].concat(j.euro||[], j.nations||[], j.minnows||[]))
        if (!TEAMBY[t.slug]) TEAMBY[t.slug]=t; })        // kits/ratings join the live-recolour lookup
    .catch(e=>{ worldStatus="error"; try{ console.error("world.json failed to load:", e); }catch(_){} });
  function nationOf(slug){ return ((WORLD&&WORLD.nations)||[]).find(n=>n.slug===slug)||null; }

  // Keeper labelled animation ranges actually used by the original (frame_10 / frame_9):
  //   dive_left/right = gotoandplay; central catch = gotoandstop a single frame by height.
  const KEEPER_ANIMS = { idle:[1,1], dive_left:[50,99], dive_right:[100,149],
                         low_catch:[323,323], mid_catch:[328,328], high_catch:[354,354] };

  // ---- Exact constants (decompiled) ----
  // The SWF runs at 28 fps. Clip enterFrames (striker movement, animations) fire at 28 Hz,
  // but the game-logic main timeline is a 2-frame loop (mainloop=frame9 -> frame10 -> goto),
  // so ball physics / scoring / keeper run at 14 Hz. We mirror that split exactly.
  const FPS = 28, DT = 1 / FPS;       // SWF frame rate (striker + animations)
  const LPOST = 135, RPOST = 430, BARH = 105, POSTTOL = 13;   // exact SWF (frame_9)
  const KEEPER_START_X = 263;
  const MAN_MIN_X = 50, MAN_MAX_X = 500, MAN_START_X = 450, MAN_Y = 300;
  const SERVE_Y = 300, GOAL_RESOLVE_Y = 160, NET_GOAL_Y = 150, YBIT = 8;
  const KICK_FRAMES = 6;             // SWF frames from Space to contact (kick anim -> frame 7)
  // Defender = inner man sprite (DefineSprite_151), exact registration origin from swf.xml
  const DEF_W = 90, DEF_H = 155, DEF_OX = 45, DEF_OY = 78;   // bigger defenders (owner: were child-sized)
  const DEF_FW = 134, DEF_FH = 230, DEF_FRAMES = 4;          // defender_sheet: 4 per-defender pose variants (engine picks 3 distinct/match)
  // defender stage bbox (= opponent.man.hitTest); origin (ox,oy) maps to the opponent placement
  function defBox(d){ return { x0:d.ox-DEF_OX*d.sx, x1:d.ox+(DEF_W-DEF_OX)*d.sx,
                               y0:d.oy-DEF_OY*d.sy, y1:d.oy+(DEF_H-DEF_OY)*d.sy }; }
  const DEG = Math.PI / 180;
  // Swappable RNG: normal play uses Math.random; daily challenge + HORSE rounds use a SEEDED
  // generator so everyone (or both players) faces an identical serve/keeper/defender sequence.
  let RAND = Math.random;
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function seedRand(seed){ RAND = (seed==null) ? Math.random : mulberry32(seed>>>0); }
  const rnd = (n) => Math.floor(RAND() * n);   // emulate AS random(n) => 0..n-1 (via swappable RAND)
  const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);

  // ---- Audio: the ORIGINAL SWF sound effects (decompiled to assets/snd) ----
  //   116 shotsnd -> kick   118 crink -> post/woodwork   171 -> whistle
  //   172 -> goal cheer   173 -> boos   174 near_miss "ooh" -> save
  const SND = {};
  for (const n of ["kick","post","whistle","goal","boos","ooh"]) {
    const a = new Audio("assets/snd/"+n+".mp3?v=hr5"); a.preload="auto"; SND[n]=a;
  }
  let audioUnlocked=false;
  function audio(){                       // prime playback on first user gesture (autoplay policy)
    if (audioUnlocked) return; audioUnlocked=true;
    for (const n in SND){ const a=SND[n];
      try{ a.muted=true; const p=a.play(); if(p&&p.then) p.then(()=>{a.pause();a.currentTime=0;a.muted=false;}).catch(()=>{a.muted=false;}); }catch(e){} }
  }
  let muted = localStorage.getItem("vc_muted")==="1";
  function play(name, vol){ if(muted) return; const a=SND[name]; if(!a) return;
    try{ const c=a.cloneNode(); c.volume=(vol==null?0.7:vol); c.play().catch(()=>{}); }catch(e){} }
  function toggleMute(){ muted=!muted; localStorage.setItem("vc_muted", muted?"1":"0"); }
  const sfx = {
    kick(){ play("kick",0.75); },
    goal(){ play("goal",0.95); },
    save(){ play("ooh",0.8); },
    post(){ play("post",0.9); },
    whistle(){ play("whistle",0.8); },
    boos(){ play("boos",0.8); }
  };

  // ---- Game state ----
  const ST = { MENU:"menu", NAME:"name", CLUBSEL:"clubsel", TABLE:"table", SEASONEND:"seasonend",
               INBOX:"inbox", EMAIL:"email", TROPHY:"trophy", NATSEL:"natsel", TRNHUB:"trnhub",
               TITLE:"title", COUNTDOWN:"countdown", SERVE:"serve", FLIGHT:"flight", RESULT:"result",
               MATCHEND:"matchend", OVER:"over",
               DAILYBOARD:"dailyboard", HORSESETUP:"horsesetup", HORSEPASS:"horsepass", HORSEEND:"horseend" };
  let state = ST.MENU;
  let menuSel = 0;          // menu / club-select cursor
  let inboxSel = 0, openedOffer = 0;   // transfer-inbox cursor + opened email index
  let clinchBtn = null;                // clickable "end season" button rect on the career home (when title clinched)
  let trophyRoomBtn = null;            // clickable "trophies" button rect on the career home
  let nameBuf = "";         // player-name entry buffer
  let pendingMode = "career";  // 'quick' or 'career' — what the club-select confirms into
  let GMODE = "career";     // active game mode: 'career' | 'daily' | 'horse'
  let serveQueue = null, serveIdx = 0;   // pre-rolled serves for seeded (daily/HORSE) matches
  const HORSE_BALLS = 1;    // one delivery per HORSE challenge

  const M = { score:0, attempts:10, winTarget:0, drawTarget:0, goals:0,
              best:Number(localStorage.getItem("vc_best")||0) };

  // ---- Career ----
  let CAR = null;   // {name, slug, season, idx, fixtures:[{opp,home}], table:{slug:{p,w,d,l,pts,gd}}, news:[]}
  function loadCareer(){
    try {
      const c = JSON.parse(localStorage.getItem("vc_career"));
      if (c && c.titles>0 && !c.trophies)                                   // migrate pre-trophy-room saves
        c.trophies = Array.from({length:c.titles}, ()=>({t:"league", s:null, club:c.slug}));
      if (c && !c.cal){                                                     // migrate pre-calendar saves:
        c.cal = Array.from({length:Math.max(0, c.fixtures.length-c.idx)}, ()=>({t:'L'}));
        c.calIdx = 0;                                                       // league-only for the rest of this season
        c.cup = {round:0, out:true, won:false, opp:null, results:[]};       // cup/Europe join from next season
        c.euro = null; c.nextEuro = null;
        c.nation = c.nation || "England"; c.caps = c.caps||0; c.intlGoals = c.intlGoals||0;
        c.trn = null; c.trnDone = false;
      }
      return c;
    } catch(e){ return null; }
  }
  function saveCareer(){ if (CAR) localStorage.setItem("vc_career", JSON.stringify(CAR)); }
  function freshTable(){ const t={}; for (const tm of TEAMS) t[tm.slug]={p:0,w:0,d:0,l:0,pts:0,gd:0}; return t; }
  function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  // Proper double round-robin: play EVERY other club once (random venue) in the first half,
  // then the reverse fixture in the second half — so you never face a team twice until you've
  // played everyone once (like a real league).
  function makeFixtures(slug){
    const others = TEAMS.filter(t=>t.slug!==slug).map(t=>t.slug);
    const firstHome = {}; for (const o of others) firstHome[o] = rnd(2)===0;
    const first  = shuffle(others.map(o=>({opp:o, home: firstHome[o]})));
    const second = shuffle(others.map(o=>({opp:o, home: !firstHome[o]})));
    return first.concat(second);
  }
  // ---- season calendar: league matchdays with cup / European fixtures slotted between ----
  const CUP_AFTER=[6,12,19,26,33], EURO_G_AFTER=[4,9,14,18,23,27], EURO_SF_AFTER=30, EURO_F_AFTER=35;
  const CUP_ROUNDS=["ROUND OF 32","ROUND OF 16","QUARTER-FINAL","SEMI-FINAL","FINAL"];
  function buildCalendar(hasEuro){
    const cal=[];
    for (let md=0; md<38; md++){
      cal.push({t:'L'});
      const after=md+1, ci=CUP_AFTER.indexOf(after);
      if (ci>=0) cal.push({t:'C', r:ci});
      if (hasEuro){ const ei=EURO_G_AFTER.indexOf(after);
        if (ei>=0) cal.push({t:'E', k:ei});
        if (after===EURO_SF_AFTER) cal.push({t:'E', k:6});
        if (after===EURO_F_AFTER)  cal.push({t:'E', k:7}); }
    }
    return cal;
  }
  function initCup(){ return { round:0, out:false, won:false, opp:null, home:true, results:[] }; }
  function initEuro(comp, mySlug){
    if (!comp || !WORLD) return null;
    const pool=WORLD.euro.filter(t=> comp==='CT' ? t.rating>=8 : t.rating<=8);
    const g=shuffle(pool.slice()).slice(0,3).map(t=>t.slug);
    const gt={}; gt[mySlug]={p:0,w:0,d:0,l:0,pts:0};
    for (const sg of g) gt[sg]={p:0,w:0,d:0,l:0,pts:0};
    return { comp, group:g, gt, gIdx:0, stage:'G', sfOpp:null, fOpp:null };
  }
  function evDead(ev){          // calendar slots that no longer apply (knocked out etc.)
    if (ev.t==='C') return !CAR.cup || CAR.cup.out || CAR.cup.won;
    if (ev.t==='E'){ const e=CAR.euro;
      if (!e || e.stage==='out' || e.stage==='won') return true;
      if (ev.k<6)   return e.stage!=='G';
      if (ev.k===6) return e.stage!=='SF';

  // ---- Title-race model (shared by simRound + computeTitleOdds) ----
  // A team's per-game win chance is a GENTLE function of its strength so a single rating point
  // doesn't compound into a near-certain title over 38 games. Strength = static rating blended
  // with the team's OBSERVED points-per-game once it has played, so the table reacts to real
  // results. computeTitleOdds also draws a per-team "form" offset each simulated season, giving
  // realistic tails: the favourites sit ~25%, the chasing pack has a genuine chance, and the
  // number visibly MOVES as you win or lose (the old model pinned everyone outside the top 2 at 1%).
  // ODDS_FORM = per-season form variance. Higher = more upsets => a points lead is worth less,
  // so a 5pt lead with 15 games left reads ~60% (like a real betting market) instead of ~74%.
  // Calibrated against real recent EPL tables (sim-verified over 400 seasons):
  // champions avg ~87 (range ~71-105), 4th ~71, 7th ~60, 10th ~50, 17th ~32, bottom ~22.
  // ODDS_EXP makes the strength curve convex so elite clubs stay elite while mid-table
  // drops to realistic totals; the observed-ppg blend is capped so leaders don't regress.
  const ODDS_W0 = 0.16, ODDS_WS = 0.52, ODDS_EXP = 1.4, ODDS_DRAW = 0.24, ODDS_FORM = 0.14;
  const winProb = (s)=> clamp(ODDS_W0 + ODDS_WS*Math.pow(s, ODDS_EXP), 0.10, 0.78);
  function teamStrength(slug){
    const t=TEAMBY[slug], r=CAR.table[slug]; let s=(t.rating-1)/9;
    if (r.p>=3){ const ppg=r.pts/r.p, sImp=ppg/3, w=Math.min(0.35, r.p/24); s=(1-w)*s + w*sImp; }
    return clamp(s, 0, 1);

  // simulate one matchday for all teams except those given (player's + opponent's real result handled separately)
  function simRound(exclude){
    for (const tm of TEAMS){
      if (exclude.indexOf(tm.slug)>=0) continue;
      const pW = winProb(teamStrength(tm.slug));
      const row = CAR.table[tm.slug]; row.p++; const x=Math.random();
      if (x < pW){ row.w++; row.pts+=3; row.gd+=1+rnd(2); }
      else if (x < pW+ODDS_DRAW){ row.d++; row.pts+=1; }
      else { row.l++; row.gd-=1+rnd(2); }
    }
  }
  // Monte-Carlo the rest of the season -> % chance the player finishes 1st.
  function computeTitleOdds(){
    if (!CAR) return null;
    const N=500, total=CAR.fixtures.length, me=CAR.slug; let wins=0;
    const sT={}; for (const t of TEAMS) sT[t.slug]=teamStrength(t.slug);   // base strengths once per call
    for (let k=0;k<N;k++){
      const pts={}, gd={};
      for (const t of TEAMS){ const r=CAR.table[t.slug]; pts[t.slug]=r.pts; gd[t.slug]=r.gd;
        const form=(Math.random()*2-1)*ODDS_FORM;                          // this team runs hot/cold this season
        const pW=clamp(winProb(sT[t.slug]) + form, 0.08, 0.82);
        for (let g=total-r.p; g>0; g--){ const x=Math.random();
          if (x<pW){ pts[t.slug]+=3; gd[t.slug]++; } else if (x<pW+ODDS_DRAW){ pts[t.slug]++; } else { gd[t.slug]--; } }
      }
      let best=me;
      for (const t of TEAMS){ if (pts[t.slug]>pts[best] || (pts[t.slug]===pts[best] && gd[t.slug]>gd[best])) best=t.slug; }
      if (best===me) wins++;
    }
    let pct=Math.round(wins/N*100);
    // floor at 1% only while the player can still mathematically reach the top rival's current points
    if (pct===0){
      const myMax=CAR.table[me].pts + (total-CAR.table[me].p)*3;
      let bestRival=0;
      for (const t of TEAMS){ if (t.slug===me) continue;
        if (CAR.table[t.slug].pts>bestRival) bestRival=CAR.table[t.slug].pts; }
      if (myMax>bestRival) pct=1;

  }

  function headline(res, pos){

    const W=["{n} fires {c} past {o}","{c} sink {o} as {n} stars","Sublime {n} downs {o}",
      "{c} too hot for {o}","{n} on fire: {o} blown away","Three points! {c} see off {o}",
      "{o} have no answer to {n}","Dream day for {n} at {c}","{n} masterclass buries {o}",
      "{c} march on, {o} beaten","{n} the hero again versus {o}","Ruthless {c} dismantle {o}",
      "{n} hits {s} as {c} beat {o}","{o} sunk by clinical {c}"];
    const D=["{c} held by stubborn {o}","Honours even: {c} and {o} share it","{n} frustrated by {o}",
      "Stalemate as {c} draw {o}","{c} forced to settle for a point","{n} can't break {o} down",
      "A point apiece for {c} and {o}","Spoils shared between {c} and {o}","{o} dig in to deny {n}"];
    const L=["{c} fall to {o}","Off day for {n} as {o} win","{o} edge a tight one with {c}",
      "{c} undone by {o}","{n} left to rue defeat at {o}","Nightmare for {c} against {o}",
      "{o} pile on the misery for {c}","{c} slump to defeat by {o}","Blank day for {n} as {o} prevail"];
    const pool = res==="W"?W:(res==="D"?D:L);
    let h = pool[rnd(pool.length)];
    // occasional context flavour
    if (res==="W" && pos===1 && rnd(2)===0) h="{c} go top! {n} downs {o}";
    else if (res==="L" && pos>=18 && rnd(2)===0) h="Pressure mounts on {n} as {c} lose to {o}";
    return h.replace(/{n}/g,n).replace(/{c}/g,c).replace(/{o}/g,o).replace(/{s}/g,s);
  }
  // After the burst: record the result + advance the career calendar (or Quick-Play OVER).
  function commitMatch() {
    if (!CAR){ state=ST.OVER; return; }
    const res=matchResult(), ev=pendingEv||{t:'L'};
    if (ev.t==='I'){ commitIntl(res); return; }            // tournament drives its own flow
    if (ev.t==='L') commitLeague(res);
    else if (ev.t==='C') commitCup(res);
    else commitEuro(res, ev);
    CAR.calIdx++;
    saveCareer();
    if (!peekEvent()) seasonOver(); else state=ST.TABLE;
  }
  function commitLeague(res){
    const me = CAR.table[CAR.slug], opp = CAR.table[OPPONENT.slug];
    me.p++; opp.p++;
    if (res==="W"){ me.w++; me.pts+=3; me.gd+=2; opp.l++; opp.gd-=2; }
    else if (res==="D"){ me.d++; me.pts+=1; opp.d++; opp.pts+=1; }
    else { me.l++; me.gd-=2; opp.w++; opp.pts+=3; opp.gd+=2; }
    CAR.news.unshift(headline(res, myPosition()));
    CAR.news = CAR.news.slice(0,8);
    CAR.form = (CAR.form||[]); CAR.form.unshift(res); CAR.form = CAR.form.slice(0,5);   // last-5 form
    simRound([CAR.slug, OPPONENT.slug]);
    CAR.idx++;
    CAR.lastResults = genGameweekResults(res, CAR.fixtures[CAR.idx-1]);   // ticker for the career home screen
    CAR.titleOdds = computeTitleOdds();
  }
  function commitCup(res){
    const c=CAR.cup, oname=OPPONENT.name;
    c.results.push({r:c.round, opp:c.opp, res});
    if (res==='W'){
      CAR.news.unshift(c.round===4 ? CAR.name+" lifts the Cup! Glory for "+MYCLUB.name+"!"
                                   : MYCLUB.name+" past "+oname+" in the Cup");
      if (c.round===4){ c.won=true; (CAR.trophies=CAR.trophies||[]).push({t:"cup", s:CAR.season, club:CAR.slug}); }
      c.round++; c.opp=null;
    } else { c.out=true; CAR.news.unshift("Cupset! "+oname+" dump "+MYCLUB.name+" out"); }
    CAR.news=CAR.news.slice(0,8);
  }
  function euroSimPair(a,b,gt){     // the other group game on a European matchday
    const ra=(TEAMBY[a]||{}).rating||5, rb=(TEAMBY[b]||{}).rating||5;
    const pa=clamp(0.38+(ra-rb)*0.06, 0.10, 0.80), x=Math.random();
    gt[a].p++; gt[b].p++;
    if (x<pa){ gt[a].w++; gt[a].pts+=3; gt[b].l++; }
    else if (x<pa+0.25){ gt[a].d++; gt[b].d++; gt[a].pts++; gt[b].pts++; }
    else { gt[b].w++; gt[b].pts+=3; gt[a].l++; }
  }
  function groupOrder(meSlug, group, gt){
    return [meSlug].concat(group).sort((a,b)=> gt[b].pts-gt[a].pts ||
      (((TEAMBY[b]||{}).rating||5)-((TEAMBY[a]||{}).rating||5)));
  }
  function commitEuro(res, ev){
    const e=CAR.euro, comp=e.comp==='CT'?"Champions Trophy":"Continental Cup";
    if (ev.k<6){
      const me=e.gt[CAR.slug], op=e.gt[OPPONENT.slug];
      me.p++; op.p++;
      if (res==='W'){ me.w++; me.pts+=3; op.l++; }
      else if (res==='D'){ me.d++; op.d++; me.pts++; op.pts++; }
      else { me.l++; op.w++; op.pts+=3; }
      const others=e.group.filter(x=>x!==OPPONENT.slug);
      if (others.length===2) euroSimPair(others[0], others[1], e.gt);
      e.gIdx++;
      if (e.gIdx>=6){
        const qual = groupOrder(CAR.slug, e.group, e.gt).indexOf(CAR.slug)<2;
        e.stage = qual ? 'SF' : 'out';
        CAR.news.unshift(qual ? MYCLUB.name+" into the "+comp+" semi-finals!"
                              : MYCLUB.name+" out of the "+comp+" at the group stage");
      }
    } else if (ev.k===6){
      if (res==='W'){ e.stage='F'; CAR.news.unshift(MYCLUB.name+" reach the "+comp+" FINAL!"); }
      else { e.stage='out'; CAR.news.unshift("Semi-final heartbreak for "+MYCLUB.name); }
    } else {
      if (res==='W'){ e.stage='won';
        (CAR.trophies=CAR.trophies||[]).push({t:"euro", s:CAR.season, club:CAR.slug});
        CAR.news.unshift("KINGS OF EUROPE! "+MYCLUB.name+" win the "+comp+"!"); }
      else { e.stage='out'; CAR.news.unshift("Final defeat for "+MYCLUB.name+" in the "+comp); }
    }
    CAR.news=CAR.news.slice(0,8);
  }
  // ---- season finished -> world tournament every other year (incl. season 1), then the summer ----
  function seasonOver(){
    if (CAR.season % 2 === 1 && CAR.nation && WORLD && !CAR.trnDone){ startTournament(); return; }
    enterSeasonEnd();
  }
  function startTournament(){
    if (!CAR.trn){
      const others=shuffle(WORLD.nations.filter(n=>n.slug!==CAR.nation)).slice(0,3).map(n=>n.slug);
      const gt={}; gt[CAR.nation]={p:0,w:0,d:0,l:0,pts:0};
      for (const sg of others) gt[sg]={p:0,w:0,d:0,l:0,pts:0};
      CAR.trn={ group:others, gt, gIdx:0, stage:'G', oppQ:null, oppS:null, oppF:null };
      saveCareer();
    }
    state=ST.TRNHUB;
  }
  function trnPickKO(exclude){
    const pool=WORLD.nations.filter(n=>n.slug!==CAR.nation && exclude.indexOf(n.slug)<0);
    return pool[rnd(pool.length)].slug;
  }
  function trnSetup(){      // sets MYCLUB/OPPONENT for the next tournament tie
    const T=CAR.trn, nat=nationOf(CAR.nation);
    pendingEv={t:'I'};
    MYCLUB={ slug:CAR.nation, name:nat.name, rating:nat.rating };
    let oppSlug, ko=false;
    if (T.stage==='G') oppSlug=T.group[T.gIdx];
    else if (T.stage==='QF'){ if(!T.oppQ) T.oppQ=trnPickKO(T.group); oppSlug=T.oppQ; ko=true; }
    else if (T.stage==='SF'){ if(!T.oppS) T.oppS=trnPickKO(T.group.concat([T.oppQ])); oppSlug=T.oppS; ko=true; }
    else { if(!T.oppF) T.oppF=trnPickKO(T.group.concat([T.oppQ,T.oppS])); oppSlug=T.oppF; ko=true; }
    const ot=TEAMBY[oppSlug];
    OPPONENT={ slug:oppSlug, name:ot.name, rating:ot.rating, home:rnd(2)===0 };
    return { ko, strikerSlug:CAR.nation };   // nation kit renders straight onto the striker base
  }
  function startTrnMatch(){
    const o=trnSetup();
    loadKits(o.strikerSlug, OPPONENT.slug, ()=>startMatch({balls:5, ko:o.ko}));
  }
  function commitIntl(res){
    const T=CAR.trn;
    CAR.caps=(CAR.caps||0)+1; CAR.intlGoals=(CAR.intlGoals||0)+M.goals;
    if (T.stage==='G'){
      const me=T.gt[CAR.nation], op=T.gt[OPPONENT.slug];
      me.p++; op.p++;
      if (res==='W'){ me.w++; me.pts+=3; op.l++; }
      else if (res==='D'){ me.d++; op.d++; me.pts++; op.pts++; }
      else { me.l++; op.w++; op.pts+=3; }
      const others=T.group.filter(x=>x!==OPPONENT.slug);
      if (others.length===2) euroSimPair(others[0], others[1], T.gt);
      T.gIdx++;
      if (T.gIdx>=3) T.stage = groupOrder(CAR.nation, T.group, T.gt).indexOf(CAR.nation)<2 ? 'QF' : 'out';
    }
    else if (T.stage==='QF') T.stage = res==='W' ? 'SF' : 'out';
    else if (T.stage==='SF') T.stage = res==='W' ? 'F'  : 'out';
    else if (T.stage==='F'){
      if (res==='W'){ T.stage='won';
        (CAR.trophies=CAR.trophies||[]).push({t:"intl", s:CAR.season, club:CAR.nation}); }
      else T.stage='out';
    }
    saveCareer();
    state=ST.TRNHUB;
  }

  function newServe() {
    clearResult();   // each shot owns its result text; a 0-point miss must not inherit the last GOAL/SAVE
    if (serveQueue){ const s=serveQueue[Math.min(serveIdx,serveQueue.length-1)]; serveIdx++; velocity=s.v; angle=s.a; }
    else { velocity = rnd(5)+18; angle = rnd(5)+35; }
    cangle = Math.cos(angle*DEG); sangle = Math.sin(angle*DEG);
    t=0; bounce=0; bounced=1; booted=false; innet=false; ay=0;
    xball=0; yball=SERVE_Y; z=0; dbx=0; dby=0; ybit=YBIT; yscale=93;
    checked=false; dive=false; no_dive=true; divedirn="up"; destination=0; keeperX=KEEPER_START_X;
    kicked=false; cchecked=false; kickTick=0; manFinished=false; complete_miss=false; end=0; sc=0;
    hitkeeper=0; held=false; hitbar=false; lposthit=false; rposthit=false;
    leftcorner=0; rightcorner=0; topnet=0; znet=0;
    manKicking=false; manKickT=0;
    keeperPose = { x:KEEPER_START_X, dir:"up", anim:"idle", frame:1 };
    // Defenders: exact placements from the SWF (PlaceObject matrices, twips/20).
    // opponent1 deflects -=10+rnd8 @ yball<240; opponent2 -=20+rnd8 @ yball<200; opponent3 +=10+rnd8 @ yball<200.
    defenders = [
      { ox:117.95, oy:210.25, sx:1.0000, sy:1.0000, thr:240, mag:10, sign:-1, chk:false, variant:defVariants[0] },
      { ox: 27.60, oy:163.35, sx:0.8982, sy:0.8960, thr:200, mag:20, sign:-1, chk:false, variant:defVariants[1] },
      { ox:471.15, oy:157.75, sx:0.8234, sy:0.8264, thr:200, mag:10, sign:+1, chk:false, variant:defVariants[2] }
    ];
    state = ST.SERVE;
  }

  function triggerKick() {
    if (!kicked && (state===ST.SERVE)) { kicked=true; manKicking=true; manKickT=0; kickTick=0; firstShotShown=true; }
  }

  // offscreen buffer for the keeper pixel hit-test (faithful to keeps.hitTest(...,true))
  const offC = document.createElement("canvas"); offC.width=SW; offC.height=420;
  const offCtx = offC.getContext("2d");

  // ---- saved_check(): pixel-test the keeper sprite at 8 points around the ball, like the original ----
  function savedCheck() {
    offCtx.setTransform(1,0,0,1,0,0);
    offCtx.clearRect(0,0,SW,420);
    drawKeeperTo(offCtx);
    const bx = xball, by = yball - z;   // ball._x, ball._y
    const pts = [[0,0],[-10,-8],[10,-8],[0,-15],[0,-7],[-5,-5],[5,-5],[0,3]];   // original's sample offsets
    hitkeeper = 0;
    for (const [ox,oy] of pts) {
      const sx = Math.round(bx+ox), sy = Math.round(by+oy);
      if (sx<0||sy<0||sx>=SW||sy>=420) continue;
      if (offCtx.getImageData(sx,sy,1,1).data[3] > 16) { hitkeeper = 1; break; }
    }
    if (dbx > 1 && xball < 170) { leftcorner=1; rightcorner=0; }
    if (dbx < 1 && xball > 400) { rightcorner=1; leftcorner=0; }
    if (z > 75) { topnet=1; znet=z; }
  }

  // striker movement: keyboard (±5/tick) takes priority; otherwise ease toward the mouse target.
  // When left-footed the scene is mirrored, so swap the arrow keys (mouse target is already mapped).
  function moveMan() {
    const R = leftFooted ? input.left : input.right;
    const L = leftFooted ? input.right : input.left;
    if (R && manX<MAN_MAX_X){ manX=Math.min(MAN_MAX_X, manX+5); manVelX=0; }
    else if (L && manX>MAN_MIN_X){ manX=Math.max(MAN_MIN_X, manX-5); manVelX=0; }
    else if (mouseTargetX!=null){ const d=mouseTargetX-manX, step=6.9*(1+dragSpeedMod*0.05);
      if (Math.abs(d)>0.5) manX=clamp(manX+Math.max(-step,Math.min(step,d)), MAN_MIN_X, MAN_MAX_X); }
    // momentum glide after finger lift — decelerates naturally before stopping
    if (!dragging && Math.abs(manVelX)>0.18){
      manX=clamp(manX+manVelX, MAN_MIN_X, MAN_MAX_X);
      manVelX*=0.85;
      if(Math.abs(manVelX)<0.18) manVelX=0;
    }
  }
  // ---- 28 Hz frame: striker movement + animations; drives the 14 Hz logic loop ----
  function swfFrame() {
    if (paused) return;                  // ENTER toggles pause; freezes sim while held
    if (state===ST.COUNTDOWN) {          // move into position before the first ball is fed
      moveMan();
      countdownT -= DT;
      if (countdownT<=0) state=ST.SERVE;
      return;
    }
    if (state===ST.RESULT) {
      moveMan();   // allow pre-positioning during result animation
      resultTimer -= DT;
      if (resultTimer<=0) {
        if (M.attempts<=0) endMatch();
        else newServe();
      }
      return;
    }
    if (state===ST.MATCHEND) {           // VICTORY/DRAW/LOSS burst, then record + advance
      matchEndTimer -= DT;
      if (matchEndTimer<=0) commitMatch();
      return;
    }
    if (state!==ST.SERVE && state!==ST.FLIGHT) return;

    // striker movement runs every SWF frame (28 Hz) — like the original man.enterFrame
    moveMan();
    ballSpin++;                  // rotating Tango ball spins while in play (SERVE/FLIGHT)
    // kick animation advances at 28 Hz; contact (man.finished) lands on anim frame 7
    if (manKicking) manKickT++;
    if (kicked && !cchecked) { kickTick++; if (kickTick>=KICK_FRAMES) manFinished=true; }
    // keeper dive animation plays at the SWF frame rate (one source frame per 28 Hz tick)
    if (dive && !no_dive) {
      const a = KEEPER_ANIMS[keeperPose.anim] || KEEPER_ANIMS.dive_left;
      if (keeperPose.frame < a[1]) keeperPose.frame++;
    }

    // game logic runs every frame (28 Hz) — full-rate cross, matches the original's feel
    logicStep();
  }

  // ---- 14 Hz logic: frame_9 (physics + resolve) then frame_10 (contact, defenders, keeper, end) ----
  function logicStep() {
    // ===== frame_9: ball physics =====
    t += 0.06;
    if (!booted) {
      yball = SERVE_Y;
      xball = ay*10;                              // xball lags ay by one step (faithful)
      ay = cangle*velocity*t + bounce;
      z = (sangle*velocity*t - 5*t*t)*10;
      if (z<0) { t=0; bounce=ay; bounced=2; velocity*=0.7; z=0; }
      yscale = 10 + 90*yball/325;
    } else if (!innet && !held) {        // held = keeper has caught it: freeze the ball in his hands
      xball -= dbx; yball -= ybit; z += dby/13;
      yscale = 10 + 90*yball/325;
      if (yball<GOAL_RESOLVE_Y && !checked) {
        checked=true; savedCheck();
        // ===== EXACT transcription of frame_9 resolution =====
        if (hitkeeper===0) {
          if (Math.abs(xball-RPOST)<POSTTOL && z<BARH) {
            rposthit=true; ybit=-ybit; dbx=-10; M.score+=Math.round(150/bounced); flagResult("WOODWORK!","#ff9f1c",150); sfx.post(); barShakeT=0.35;
          }
          if (Math.abs(xball-LPOST)<POSTTOL && z<BARH) {
            lposthit=true; ybit=-ybit; dbx=10; M.score+=Math.round(150/bounced); flagResult("WOODWORK!","#ff9f1c",150); sfx.post(); barShakeT=0.35;
          }
          if (z>=BARH-15 && z<=BARH && xball>LPOST && xball<RPOST) {
            if (!(lposthit||rposthit)) { hitbar=true; dby=10; M.score+=Math.round(150/bounced); flagResult("OFF THE BAR!","#ff9f1c",150); sfx.post(); barShakeT=0.35; }
          }
          if (xball>LPOST && xball<RPOST && z<BARH && !rposthit && !lposthit && !hitbar) {
            innet=true;   // GOAL
          } else if (!rposthit && !lposthit && !hitbar) {
            flagResult("MISSED!","#ff5d5d",0);   // wide/over -> miss (no score; cosmetic text only)
          }
        } else {
          M.score+=Math.round(300/bounced); flagResult("SAVED!","#ffd23f",300); sfx.save();
          if (divedirn==="left"){ ybit=-ybit; dbx=10; dby=-dby; } else { ybit=-ybit; dbx=-10; dby=-dby; }
          if (no_dive){ held=true; keeperPose.anim="catch"; keeperPose.frame = (z<30 ? 323 : (z<60 ? 328 : 354)); }
        }
        if (window.__dbg) window.__rs={finalx:Math.round(xball),z:Math.round(z),hk:hitkeeper,innet,rp:rposthit,lp:lposthit,bar:hitbar};
      }
    } else {
      xball -= dbx; yball -= 6; z += dby/12;
      yscale = 10 + 90*yball/325;
      if (rightcorner===1){ dbx=10; rightcorner=0; }
      if (leftcorner===1){ dbx=-10; leftcorner=0; }
      if (topnet===1){ z=znet-20; }
      if (yball<NET_GOAL_Y) {
        end=1; M.score+=Math.round(4000/bounced); sc=1; M.goals++;
        netBulgeT=0.5; netBulgeX=xball; netBulgeY=clamp(yball-z, 72, 158);   // ripple the net at the entry point
        flagResult("GOOOOAL!","#46e36b",4000); sfx.goal(); flash=0.6;
      }
    }

    // ===== frame_10: contact, defenders, keeper, end =====
    // contact resolves once the kick animation has reached its strike frame
    if (kicked && !cchecked && manFinished) {
      cchecked=true;
      dbx = manX + 15 - xball;
      dby = z;
      if (z<40 && Math.abs(dbx)<30) {
        booted=true; innet=false; M.score += Math.round(100/bounced); sfx.kick();
        state=ST.FLIGHT;
      } else {
        complete_miss=true;   // whiff – attempt lost when ball rolls off
      }
    }
    dby = z;   // frame_10 line 50

    // defenders: each gets ONE hitTest the moment the ball passes its depth threshold (frame_10 1-30)
    if (booted) {
      const bx = xball, by = yball - z;   // ball._x, ball._y (screen)
      for (const d of defenders) {
        if (!d.chk && yball < d.thr) {
          d.chk = true;
          const b = defBox(d);
          if (bx>=b.x0 && bx<=b.x1 && by>=b.y0 && by<=b.y1){ dbx += d.sign*(d.mag + rnd(8));
            if (window.__df) window.__df.push({ox:d.ox,sign:d.sign,atx:Math.round(bx),aty:Math.round(by),newdbx:Math.round(dbx)}); }
        }
      }
    }

    // keeper dive AI
    if (booted && !dive) {
      dive=true; destination = xball - 18*dbx; divedirn="up";
      if (rnd(10)<8) {
        if (destination>310 && destination<500){ divedirn="right"; no_dive=false; keeperPose.anim="dive_right"; keeperPose.frame=KEEPER_ANIMS.dive_right[0]; }
        if (destination<250 && destination>50){ divedirn="left"; no_dive=false; keeperPose.anim="dive_left"; keeperPose.frame=KEEPER_ANIMS.dive_left[0]; }
      }
      keeperPose.dir = divedirn;
    }
    if (dive && no_dive) {
      if (destination>keeperPose.x) keeperPose.x+=1;
      if (destination<keeperPose.x) keeperPose.x-=1;
    }

    // end conditions + serve roll-off
    if (yball<100) end=1;
    if (hitbar && z>200) end=1;
    if ((lposthit||rposthit||hitkeeper===1) && yball>200) end=1;
    if (t>7) end=1;

    const shotOver = (end===1) || (!booted && xball>=600);
    if (shotOver) {
      if (!booted) flagResult(complete_miss ? "MISSED IT!" : "NO CONTACT", "#9aa7b4", 0);
      if (!sc) M.attempts--;     // goals (sc=1) are free shots
      resultTimer = 1.0;
      state = ST.RESULT;
    }
  }

  function flagResult(txt,col,pts){ if(resultText==="" || pts>0){ resultText=txt; resultColor=col; resultPoints=pts; } }

  // =================== RENDER ===================
  function clearResult(){ resultText=""; resultColor="#fff"; resultPoints=0; }

  // Logical (zoom-1) sprite sizes + registration origins. Bitmaps are exported at 3x and
  // drawn at these logical sizes so the browser downscales -> crisp (vector-equivalent at this canvas).
  const BALL_W = 41, BALL_H = 41, BALL_OX = 19.6, BALL_OY = 34.1;
  const BALL_FW = 132, BALL_FH = 132, BALL_FRAMES = 24;   // rotating Tango sheet
  const SHADOW_W = 28, SHADOW_H = 11, SHADOW_OX = 13.0, SHADOW_OY = 0.0;
  function drawBall() {
    if (state===ST.COUNTDOWN) return;     // when held, keep drawing the ball (frozen in the keeper's hands)
    const ss = yscale/100;                          // shadow + in-net ball use full yscale
    const bs = (innet ? yscale : yscale*0.8)/100;   // /ball uses yscale*0.8, /ball2 (in net) uses yscale (frame_9 :276/:285)
    // shadow: origin (13.0, 0.0) maps to (xball, yball); alpha ~0.25 (original CXFORM alphaMult 64/256)
    if (yball>=130 && IMG.shadow.naturalWidth) {
      ctx.globalAlpha=0.25;
      ctx.drawImage(IMG.shadow, xball-SHADOW_OX*ss, yball-SHADOW_OY*ss, SHADOW_W*ss, SHADOW_H*ss);
      ctx.globalAlpha=1;
    }
    // ball: origin (19.6, 34.1) maps to (xball, yball-z); cycle the rotating Tango sheet
    if (IMG.ball.naturalWidth) {
      const bf = ((ballSpin % BALL_FRAMES) + BALL_FRAMES) % BALL_FRAMES;
      ctx.drawImage(IMG.ball, bf*BALL_FW, 0, BALL_FW, BALL_FH,
                    xball-BALL_OX*bs, (yball-z)-BALL_OY*bs, BALL_W*bs, BALL_H*bs);
    }
  }

  function drawKeeper() { drawKeeperTo(ctx); }

  // Exact keeper placement scale from the SWF (PlaceObject / keeps._yscale=78).
  // Feet-anchor: keeper standing feet (PNG 300,197) -> stage (keeps._x=263, goal-line y=163).
  const KEEPER_SX = 0.7530, KEEPER_SY = 0.7767;
  const KEEPER_FEET_PX = 300, KEEPER_FEET_PY = 197;   // standing feet/centre in the 596x263 sprite
  const KEEPER_STAGE_Y = 163;                          // goal line (measured from pitch.jpg post base)

  // Render the current keeper frame from the sprite atlas. Frames share a unified canvas, so
  // each frame's (ox,oy) offset (logical px) positions it relative to the fixed feet anchor;
  // side-dive frames carry the lateral motion internally (keeps._x stays put on a dive).
  function drawKeeperTo(g) {
    if (!KMAN) return;
    const fr = KMAN[String(keeperPose.frame)] || KMAN["1"];
    if (!fr) return;
    const sheet = SPRITES.keeper || IMG.katlas;
    if (!sheet || !(sheet.naturalWidth||sheet.width)) return;
    g.save();
    g.translate(keeperPose.x, KEEPER_STAGE_Y);     // central keeper shuffles x; dives keep x=263
    g.drawImage(sheet, fr.x, fr.y, fr.w, fr.h,
                (fr.ox - KEEPER_FEET_PX)*KEEPER_SX, (fr.oy - KEEPER_FEET_PY)*KEEPER_SY,
                (fr.w/2)*KEEPER_SX, (fr.h/2)*KEEPER_SY);   // /2: atlas is exported at 2x
    g.restore();
  }

  // exact: gameplay player placed at scale 1.0 (root); registration origin (101.2,126.5) -> (man._x, man._y)
  const STRIKER_OX = 109, STRIKER_OY = 162, STRIKER_W = 191, STRIKER_H = 243;   // 3D sprite: 300x382 frame, az190, body-centre at manX
  const STRIKER_FW = 300, STRIKER_FH = 382, STRIKER_FRAMES = 16;   // sheet: frame 0 idle, 1..15 = Shot f1..f15
  const STRIKER_CONTACT = 13;   // sheet frame of the foot-on-ball strike (Shot f13), aligned to the boot tick
  function drawStriker() {
    const sh=SPRITES.striker;
    if (!sh) return;
    // Ball is booted at manKickT≈KICK_FRAMES, so the strike pose (STRIKER_CONTACT) must land on
    // that tick: wind-up plays over 0..KICK_FRAMES, then follow-through 1/tick, holding the last
    // frame (never index past the sheet, so the striker never vanishes after the kick).
    let f = 0;
    if (manKicking) {
      f = (manKickT <= KICK_FRAMES)
        ? Math.round(manKickT / KICK_FRAMES * STRIKER_CONTACT)
        : Math.min(STRIKER_CONTACT + (manKickT - KICK_FRAMES), STRIKER_FRAMES - 1);
    }
    ctx.drawImage(sh, f*STRIKER_FW, 0, STRIKER_FW, STRIKER_FH,
                  manX - STRIKER_OX, MAN_Y - STRIKER_OY, STRIKER_W, STRIKER_H);
  }

  function drawDefenders() {
    const dim=SPRITES.defender; if (!dim) return;
    // far (smaller) first for correct overlap; draw man origin (DEF_OX,DEF_OY) at the opponent placement
    const order = defenders.slice().sort((a,b)=>a.sy-b.sy);
    for (const d of order) {
      const v = ((d.variant||0) % DEF_FRAMES + DEF_FRAMES) % DEF_FRAMES;   // per-defender pose
      ctx.drawImage(dim, v*DEF_FW, 0, DEF_FW, DEF_FH,
                    d.ox - DEF_OX*d.sx, d.oy - DEF_OY*d.sy, DEF_W*d.sx, DEF_H*d.sy);
    }
  }

  // chunky 3D arcade panel border: raised (light TL / dark BR) or inset (dark TL / light BR)
  function bevel(x,y,w,h,fill,inset,t,light){
    t=t||3; light=light||"#5a5f68";
    ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);
    ctx.fillStyle=inset?"#0b0d11":light; ctx.fillRect(x,y,w,t); ctx.fillRect(x,y,t,h);             // top + left
    ctx.fillStyle=inset?light:"#0b0d11"; ctx.fillRect(x,y+h-t,w,t); ctx.fillRect(x+w-t,y,t,h);     // bottom + right
  }
  // ---- 16-bit scoreboard numerals: 5x7 pixel bitmap digits with per-row shading and a
  // hard drop shadow — the digitised Mega Drive scoreboard look (not flat 7-seg).
  const _DIG={ '0':["01110","10001","10001","10001","10001","10001","01110"],
               '1':["00100","01100","00100","00100","00100","00100","01110"],
               '2':["01110","10001","00001","00010","00100","01000","11111"],
               '3':["11110","00001","00001","01110","00001","00001","11110"],
               '4':["00010","00110","01010","10010","11111","00010","00010"],
               '5':["11111","10000","11110","00001","00001","10001","01110"],
               '6':["00110","01000","10000","11110","10001","10001","01110"],
               '7':["11111","00001","00010","00100","01000","01000","01000"],
               '8':["01110","10001","10001","01110","10001","10001","01110"],
               '9':["01110","10001","10001","01111","00001","00010","01100"],
               '-':["00000","00000","00000","01110","00000","00000","00000"],
               ' ':["00000","00000","00000","00000","00000","00000","00000"] };
  function _shadeHex(hex, amt){           // amt>0 lighten toward white, amt<0 darken toward black
    const n=parseInt(hex.slice(1),16); let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    if (amt>=0){ r+= (255-r)*amt; g+=(255-g)*amt; b+=(255-b)*amt; } else { r*=1+amt; g*=1+amt; b*=1+amt; }
    return "rgb("+Math.round(r)+","+Math.round(g)+","+Math.round(b)+")";
  }
  function ledDigit(x,y,w,h,ch,on,off){
    const g=_DIG[ch]||_DIG[' '], c=Math.max(2,Math.floor(Math.min(w/5,h/7)));
    const dx=x+Math.round((w-5*c)/2), dy=y+Math.round((h-7*c)/2), sh=Math.max(1,Math.round(c*0.45));
    ctx.fillStyle="rgba(0,0,0,0.55)";                              // hard pixel drop shadow
    for(let r=0;r<7;r++) for(let q=0;q<5;q++) if(g[r][q]==="1") ctx.fillRect(dx+q*c+sh, dy+r*c+sh, c, c);
    for(let r=0;r<7;r++){                                          // shaded face: bright crown, dark base
      ctx.fillStyle=_shadeHex(on, r<1?0.45 : r<2?0.22 : r>=6?-0.30 : r>=5?-0.15 : 0);
      for(let q=0;q<5;q++) if(g[r][q]==="1") ctx.fillRect(dx+q*c, dy+r*c, c, c);
    }
  }
  function drawLED(x,y,w,h,str,on,off){
    const n=str.length||1, c=Math.max(2,Math.floor(Math.min(w/(6*n), h/7)));
    const dw=c*6, x0=x+w-n*dw, y0=y+Math.round((h-7*c)/2);         // right-aligned in box
    for (let i=0;i<n;i++) ledDigit(x0+i*dw, y0, c*5, c*7, str[i], on, off);
  }

  // end-of-match result: the word RISES into place, PAUSES, then FALLS AWAY as a pixel cascade.
  // The word is sampled into a grid of square cells once (8-bit look); the same cells are used for
  // the solid hold and for the disintegration, so it reads as the exact word breaking apart.
  let _cascade=null;
  function _buildCascade(word){
    if (_cascade && _cascade.word===word) return _cascade;
    const fs = word.length>5 ? 86 : 116, cell=7;
    const tc=document.createElement("canvas"), tg=tc.getContext("2d");
    const setF=()=>{ tg.font="900 "+fs+"px 'Arial Black','Arial',sans-serif"; tg.textBaseline="middle"; tg.textAlign="center"; };
    setF(); const tw=Math.ceil(tg.measureText(word).width)+24, th=fs+24;
    tc.width=tw; tc.height=th; setF(); tg.fillStyle="#fff"; tg.fillText(word, tw/2, th/2);
    const d=tg.getImageData(0,0,tw,th).data, cells=[];
    for (let y=0;y<th;y+=cell) for (let x=0;x<tw;x+=cell){
      const sx=Math.min(tw-1,(x+cell/2)|0), sy=Math.min(th-1,(y+cell/2)|0);
      if (d[(sy*tw+sx)*4+3]>90) cells.push({ x:x-tw/2, y:y-th/2, delay:(x/tw)*0.32+Math.random()*0.16 });
    }
    return _cascade={ word, cells, cell, w:tw, h:th };
  }
  function _cellHash(c){ return (((Math.abs(c.x)|0)*73856093)^((Math.abs(c.y)|0)*19349663))%1000/1000; }
  function drawMatchEndBurst() {
    ctx.fillStyle="rgba(4,6,10,0.72)"; ctx.fillRect(-OX,0,VW,SH);
    const cas=_buildCascade(matchEndText), elapsed=1.6-matchEndTimer;
    const cx=SW/2, cy=SH/2-20, cl=cas.cell;
    ctx.save(); ctx.translate(cx,cy);
    // italic shear helper (reapplied per phase)
    const SHEAR = matchEndText==="LOSS" ? -0.14 : 0.14;

    if (matchEndText==="VICTORY") {
      const SLAM=0.14, HOLD=0.36, BURST_START=SLAM+HOLD;
      if (elapsed<SLAM) {
        // slam: drop from above very fast
        const p=elapsed/SLAM, yOff=-(1-p)*(1-p)*300;
        ctx.globalAlpha=Math.min(1,p*4); ctx.translate(0,yOff);
        ctx.transform(1,0,SHEAR,1,0,0);
        ctx.fillStyle="#000"; for(const c of cas.cells) ctx.fillRect(Math.round(c.x)+3,Math.round(c.y)+3,cl,cl);
        ctx.fillStyle=matchEndColor; for(const c of cas.cells) ctx.fillRect(Math.round(c.x),Math.round(c.y),cl,cl);
      } else if (elapsed<BURST_START) {
        // hold solid with slight flash
        const flash=Math.sin((elapsed-SLAM)*28)*0.12;
        ctx.globalAlpha=1; ctx.transform(1,0,SHEAR,1,0,0);
        ctx.fillStyle="#000"; for(const c of cas.cells) ctx.fillRect(Math.round(c.x)+3,Math.round(c.y)+3,cl,cl);
        ctx.fillStyle=matchEndColor; for(const c of cas.cells) ctx.fillRect(Math.round(c.x),Math.round(c.y),cl,cl);
        ctx.fillStyle="#fff"; ctx.globalAlpha=Math.max(0,flash);
        for(const c of cas.cells) ctx.fillRect(Math.round(c.x),Math.round(c.y),cl,cl);
      } else {
        // burst: cells fly outward like confetti
        const ct=elapsed-BURST_START;
        for(const c of cas.cells){
          const h=_cellHash(c);
          const ang=Math.atan2(c.y,c.x)+(h-0.5)*1.2;
          const spd=100+h*220;
          const vx=Math.cos(ang)*spd*ct + c.x*0.6*ct;
          const vy=Math.sin(ang)*spd*ct + 180*ct*ct;
          const al=Math.max(0,1-ct*0.87);
          if(al<=0) continue;
          ctx.globalAlpha=al; ctx.fillStyle=matchEndColor;
          ctx.fillRect(Math.round(c.x+vx),Math.round(c.y+vy),cl,cl);
          // add a few white "sparkle" copies
          if(h>0.7){ ctx.fillStyle="#fff"; ctx.globalAlpha=al*0.6;
            ctx.fillRect(Math.round(c.x+vx+cl+1),Math.round(c.y+vy-2),cl-2,cl-2); }
        }
      }

    } else if (matchEndText==="DRAW") {
      const APPEAR=0.20, SQUASH_DUR=1.40;
      if (elapsed<APPEAR) {
        const p=elapsed/APPEAR;
        ctx.globalAlpha=p; ctx.transform(1,0,SHEAR,1,0,0);
        ctx.fillStyle="#000"; for(const c of cas.cells) ctx.fillRect(Math.round(c.x)+2,Math.round(c.y)+2,cl,cl);
        ctx.fillStyle=matchEndColor; for(const c of cas.cells) ctx.fillRect(Math.round(c.x),Math.round(c.y),cl,cl);
      } else {
        // slowly squash to zero vertically
        const t=Math.min(1,(elapsed-APPEAR)/SQUASH_DUR);
        const sy=Math.max(0,1-t*t*1.05), sx=1+t*0.35;
        ctx.globalAlpha=Math.max(0,1-t);
        ctx.transform(sx,0,SHEAR*(1-t),sy,0,0);
        ctx.fillStyle=matchEndColor;
        for(const c of cas.cells) ctx.fillRect(Math.round(c.x/sx),Math.round(c.y/sy),cl,cl);
      }

    } else { // LOSS
      const APPEAR=0.18, FALL_START=APPEAR;
      if (elapsed<APPEAR) {
        const p=elapsed/APPEAR;
        ctx.globalAlpha=p; ctx.transform(1,0,SHEAR,1,0,0);
        ctx.fillStyle="#000"; for(const c of cas.cells) ctx.fillRect(Math.round(c.x)+2,Math.round(c.y)+2,cl,cl);
        ctx.fillStyle=matchEndColor; for(const c of cas.cells) ctx.fillRect(Math.round(c.x),Math.round(c.y),cl,cl);
      } else {
        const ct=elapsed-FALL_START;
        ctx.transform(1,0,SHEAR,1,0,0);
        for(const c of cas.cells){
          // cells near the top of the word fall first
          const delay=(_cellHash(c)*0.2) + Math.max(0,c.y+cas.h/2)/cas.h*0.25;
          const t=Math.max(0,ct-delay);
          const fall=220*t*t;
          const al=Math.max(0,1-t*1.05);
          if(al<=0) continue;
          ctx.globalAlpha=al; ctx.fillStyle=matchEndColor;
          ctx.fillRect(Math.round(c.x),Math.round(c.y+fall),cl,cl);
        }
      }
    }

    ctx.globalAlpha=1; ctx.restore();
    ctx.textBaseline="alphabetic"; ctx.textAlign="left";
  }

  // ---- crisp 8-bit football: a cached pixel bitmap (no anti-alias), blitted square-by-square ----
  // grid values 0=transparent · 1=white · 2=black. Built once per grid size: a circle silhouette,
  // a hard black rim, a central black pentagon and five black edge patches — the classic pixel ball.
  const _ballBmp={};
  function _ballBitmap(N){
    if (_ballBmp[N]) return _ballBmp[N];
    const c=(N-1)/2, R=N/2-0.5, TURN=2*Math.PI/5, A0=-Math.PI/2;
    const inside=(x,y)=> (x-c)*(x-c)+(y-c)*(y-c) <= R*R;
    const poly=(px,py,pr,rot)=>{ const p=[]; for(let i=0;i<5;i++){const a=rot+i*TURN; p.push([px+Math.cos(a)*pr, py+Math.sin(a)*pr]);} return p; };
    const inP=(x,y,p)=>{ let w=false; for(let i=0,j=p.length-1;i<p.length;j=i++){ const a=p[i],b=p[j];
      if(((a[1]>y)!==(b[1]>y)) && (x < (b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])) w=!w; } return w; };
    const centre=poly(c,c,R*0.40,A0), edges=[];
    for(let i=0;i<5;i++){ const a=A0+i*TURN; edges.push(poly(c+Math.cos(a)*R*0.70, c+Math.sin(a)*R*0.70, R*0.30, a+Math.PI)); }
    const grid=[];
    for(let y=0;y<N;y++){ const row=[]; for(let x=0;x<N;x++){
      if(!inside(x,y)){ row.push(0); continue; }
      const rim = !inside(x-1,y)||!inside(x+1,y)||!inside(x,y-1)||!inside(x,y+1);
      let black = rim || inP(x+0.5,y+0.5,centre);
      if(!black) for(const e of edges){ if(inP(x+0.5,y+0.5,e)){ black=true; break; } }
      row.push(black?2:1);
    } grid.push(row); }
    return _ballBmp[N]=grid;
  }
  function _ball8(g, cx, cy, r){
    const N=15, bmp=_ballBitmap(N), x0=cx-r, y0=cy-r, sp=(2*r)/N;
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const v=bmp[y][x]; if(!v) continue;
      const px=Math.round(x0+x*sp), py=Math.round(y0+y*sp);
      const pw=Math.round(x0+(x+1)*sp)-px, ph=Math.round(y0+(y+1)*sp)-py;
      g.fillStyle = v===2 ? "#0b0b0b" : "#f4f4f4"; g.fillRect(px,py,pw,ph);
    }
  }

    const scale=Math.min(maxW/im.naturalWidth, (opts.maxH||150)/im.naturalHeight);

  // ---- team colours for the in-game info panel (primary = shirt, secondary contrasts it) ----
  function hexLum(hex){ const n=parseInt(hex.slice(1),16); return 0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255); }
  function colDist(a,b){ const x=parseInt(a.slice(1),16), y=parseInt(b.slice(1),16);
    const dr=((x>>16)&255)-((y>>16)&255), dg=((x>>8)&255)-((y>>8)&255), db=(x&255)-(y&255);
    return Math.sqrt(dr*dr+dg*dg+db*db); }
  function teamColors(slug){
    const t=TEAMBY[slug]||{}, prim=PAL[t.shirt]||"#c8102e", pl=hexLum(prim);
    const cands=[t.swatch_accent, t.stripe2, (t.sleeves!==t.shirt?t.sleeves:null),
                 (t.shorts!==t.shirt?t.shorts:null), (t.socks!==t.shirt?t.socks:null)];
    let sec=null;
    // pick the first kit accent that's a visibly different COLOUR from the shirt — RGB distance
    // catches same-luminance hues (e.g. red vs blue) that a luminance-only test would miss
    for (const c of cands){ if (c && PAL[c] && colDist(PAL[c],prim)>80){ sec=PAL[c]; break; } }
    if (!sec) sec = pl>140 ? "#101418" : "#ffffff";          // fallback: contrast by luminance

    return { primary:prim, secondary:sec, dark:pl<120 };

  // ---- flag renderer: tiny geometric flags from world.json specs ----
  function drawFlag(x,y,w,h,f){
    const c=(f&&f.c)||["#888","#aaa","#888"], t=(f&&f.t)||"h";
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
    if (t==="v"){ for(let i=0;i<3;i++){ ctx.fillStyle=c[i]||c[0]; ctx.fillRect(x+i*w/3,y,w/3+1,h); } }
    else if (t==="v2"){ ctx.fillStyle=c[0]; ctx.fillRect(x,y,w*0.4,h); ctx.fillStyle=c[1]; ctx.fillRect(x+w*0.4,y,w*0.6,h); }
    else if (t==="h"){ for(let i=0;i<3;i++){ ctx.fillStyle=c[i]||c[0]; ctx.fillRect(x,y+i*h/3,w,h/3+1); } }
    else if (t==="spain"){ ctx.fillStyle=c[0]; ctx.fillRect(x,y,w,h); ctx.fillStyle=c[1]; ctx.fillRect(x,y+h/4,w,h/2); }
    else if (t==="cross"){ ctx.fillStyle=c[0]; ctx.fillRect(x,y,w,h); ctx.fillStyle=c[1];
      ctx.fillRect(x+w*0.38,y,w*0.20,h); ctx.fillRect(x,y+h*0.38,w,h*0.24); }
    else if (t==="saltire"){ ctx.fillStyle=c[0]; ctx.fillRect(x,y,w,h);
      ctx.strokeStyle=c[1]; ctx.lineWidth=Math.max(3,h*0.2);
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w,y+h); ctx.moveTo(x+w,y); ctx.lineTo(x,y+h); ctx.stroke(); }
    else if (t==="diamond"){ ctx.fillStyle=c[0]; ctx.fillRect(x,y,w,h); ctx.fillStyle=c[1];
      ctx.beginPath(); ctx.moveTo(x+w/2,y+h*0.12); ctx.lineTo(x+w*0.88,y+h/2); ctx.lineTo(x+w/2,y+h*0.88); ctx.lineTo(x+w*0.12,y+h/2); ctx.closePath(); ctx.fill();
      ctx.fillStyle=c[2]||"#1b3f9b"; ctx.beginPath(); ctx.arc(x+w/2,y+h/2,h*0.18,0,2*Math.PI); ctx.fill(); }

  function wrapText(text, maxW, font){
    ctx.font=font; const out=[];
    for (const para of text.split("\n")){
      if (para===""){ out.push(""); continue; }
      let line="";
      for (const w of para.split(" ")){ const test=line?line+" "+w:w;
        if (ctx.measureText(test).width>maxW && line){ out.push(line); line=w; } else line=test; }
      if (line) out.push(line);
    }
    return out;
  }

  // ================= MULTIPLAYER HORSE (leader sets a challenge; fail to match = a letter) =================
  // Real HORSE: the leader takes ONE delivery. If they SCORE it, every other active player must
  // score the SAME seeded delivery or take the next letter of the word (tracked independently).
  // The leader keeps setting challenges until they miss, then leadership passes to the next player.
  // Spell the word and you're out; last player standing wins. 2-6 players, pass-and-play.
  let H=null;
  let hCount=2, hNames=["","","","","",""], hWord="HORSE", hField=0, horseStartBtn=null;   // setup state
  const HCOLS=["#5bd0ff","#ff8a5b","#7dff8a","#ffd24a","#c78bff","#ff7ab0"];   // per-player colours
  const HORSE_MIN=2, HORSE_MAX=6, HSETUP_Y0=92, HSETUP_RH=40;
  function beginHorse(){
    const word=(hWord.trim().toUpperCase().replace(/[^A-Z]/g,"")).slice(0,8) || "HORSE";
    const players=[];
    for (let i=0;i<hCount;i++) players.push({ name:(hNames[i]||"").trim()||("PLAYER "+(i+1)), letters:0, out:false });
    H={ players, word, L:word.length, leader:0, phase:'lead', current:0, followQ:[], seed:null, setShots:0, winner:null };
    state=ST.HORSEPASS;
  }
  function horseActiveCount(){ return H.players.filter(p=>!p.out).length; }
  function horseNextActive(i){ let j=i; for(let k=0;k<H.players.length;k++){ j=(j+1)%H.players.length; if(!H.players[j].out) return j; } return i; }
  function startHorseTurn(){
    GMODE="horse"; CAR=null;
    const lp=TEAMBY["Liverpool"]||TEAMS[0];
    MYCLUB={ slug:lp.slug, name:lp.name, rating:lp.rating };          // everyone plays the same club (fair)
    if (H.phase==='lead') H.seed=((Date.now()>>>0) ^ (H.setShots++ * 2654435761))>>>0;   // leader: a fresh delivery
    const seed=H.seed>>>0, pr=mulberry32(seed);                       // followers replay the leader's exact seed
    const ot=TEAMS[Math.floor(pr()*TEAMS.length)];
    OPPONENT={ slug:ot.slug, name:ot.name, rating:ot.rating, home:true };
    loadKits(MYCLUB.slug, OPPONENT.slug, ()=>startMatch({seed:seed, balls:1}));
  }
  function horseTurnDone(){ horseResolve(M.goals>0); }                // a goal = the challenge is made
  // Advance the state machine given whether the current player scored. No DOM -> unit-testable via __dbg.
  function horseResolve(made){
    if (H.phase==='lead'){
      if (made){                                                      // challenge set: queue the other active players
        H.followQ=[]; let j=H.leader;
        for (let k=0;k<H.players.length;k++){ j=(j+1)%H.players.length; if(j!==H.leader && !H.players[j].out) H.followQ.push(j); }
        if (!H.followQ.length){ H.winner=H.leader; state=ST.HORSEEND; return; }   // leader is the only one left
        H.phase='follow'; H.current=H.followQ.shift();
      } else {                                                        // leader missed: pass leadership, no letters
        H.leader=horseNextActive(H.leader); H.phase='lead'; H.current=H.leader;
      }
    } else {                                                          // a follower responding to the leader's goal
      if (!made){
        const p=H.players[H.current]; p.letters++;
        if (p.letters>=H.L){ p.out=true;
          if (horseActiveCount()===1){ H.winner=H.players.findIndex(x=>!x.out); state=ST.HORSEEND; return; } }
      }
      if (H.followQ.length) H.current=H.followQ.shift();
      else { H.phase='lead'; H.current=H.leader; }                    // challenge done: same leader sets again
    }
    state=ST.HORSEPASS;
  }
  function horseSnap(){ return { phase:H.phase, leader:H.leader, current:H.current, winner:H.winner,
    players:H.players.map(p=>({name:p.name,letters:p.letters,out:p.out})), state }; }

  // ================= STADIUM LAYERS (docs/STADIUM_ASSET_SPEC.md) =================
  // L0 backdrop (924x400 art, no goal/boards) -> L1 hoardings -> L2 goal+net -> sprites.
  // All purely cosmetic: the only pixel-sensitive system is the keeper hit-test, which
  // samples its own offscreen canvas — backgrounds can never affect physics.
  function drawBackdrop() {        // view space (drawn before translate(OX))
    const im=IMG.backdrop;
    if (im.complete && im.naturalWidth) ctx.drawImage(im, 0,0, VW,400);
    else {                         // stand-in so a failed deploy is obvious but playable
      ctx.fillStyle="#15171d"; ctx.fillRect(0,0,VW,143);
      ctx.fillStyle="#1c7a34"; ctx.fillRect(0,143,VW,400-143);
    }
    ctx.fillStyle="#04060a"; ctx.fillRect(0,400,VW,SH-400);
  }
  // L1: 7 static perimeter boards across the full view (early-2000s style). A board that
  // hasn't loaded gets a procedural house board — the band must never be empty.
  function drawHoardings() {       // view space
    if (!matchBoards.length && ADS.length) pickBoards(Math.random);   // manifest arrived after match start
    for (let i=0;i<HOARD_N;i++){
      const x=i*HOARD_SLOT, id=matchBoards[i], im=id && ADS_IMG[id];
      if (im && im.complete && im.naturalWidth) ctx.drawImage(im, x, HOARD_Y, HOARD_SLOT, HOARD_H);
      else {
        ctx.fillStyle="#06070b"; ctx.fillRect(x, HOARD_Y, HOARD_SLOT, HOARD_H);
        ctx.strokeStyle="#e8e8e8"; ctx.lineWidth=1.5; ctx.strokeRect(x+1.75, HOARD_Y+1.75, HOARD_SLOT-3.5, HOARD_H-3.5);
        ctx.font=ttFont(13); ctx.textAlign="center"; ctx.fillStyle=TTX.neon;
        ctx.fillText("SCORDAGOL", x+HOARD_SLOT/2, HOARD_Y+22); ctx.textAlign="left";
      }
    }
  }
  // L2: procedural goal + net — pixel-exact at LPOST/RPOST/BARH by construction, finally
  // animatable (HANDOVER §3.4): the net bulges on a goal, the frame shakes on woodwork.
  // Drawn INSIDE the leftFooted mirror so the bulge follows the (mirrored) ball.
  let netBulgeT=0, netBulgeX=GCX, netBulgeY=120, barShakeT=0;   // decay in tick()
  function drawGoal() {            // field space
    const L=LPOST, R=RPOST, T=KEEPER_STAGE_Y-BARH, B=KEEPER_STAGE_Y;   // 135,430,58,163
    const bl=L+24, br=R-24, bt=T+12, bb=B-3;        // back frame (net depth at this perspective)
    let sx=0, sy=0;
    if (barShakeT>0){ const k=barShakeT/0.35; sx=Math.sin(barShakeT*70)*2.6*k; sy=Math.cos(barShakeT*53)*1.4*k; }
    ctx.save(); ctx.translate(sx, sy);
    // mesh displacement: radial push from the ball's entry point, decaying after a goal
    const amp = netBulgeT>0 ? 9*(netBulgeT/0.5) : 0;
    const dis = (x,y)=>{ if (!amp) return [x,y];
      const dx=x-netBulgeX, dy=y-netBulgeY, d2=dx*dx+dy*dy, r2=55*55;
      if (d2>r2) return [x,y];
      const f=amp*(1-d2/r2), d=Math.sqrt(d2)||1;
      return [x+dx/d*f*0.5, y-f];                   // outward + up-back
    };
    const net=(x0,y0,x1,y1,n)=>{                    // displaced polyline
      ctx.beginPath();
      for (let i=0;i<=n;i++){ const p=dis(x0+(x1-x0)*i/n, y0+(y1-y0)*i/n);
        i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); }
      ctx.stroke();
    };
    ctx.strokeStyle="rgba(235,238,240,0.32)"; ctx.lineWidth=1;
    for (let x=bl;x<=br;x+=9) net(x,bt,x,bb,6);                            // back panel mesh
    for (let y=bt;y<=bb;y+=9) net(bl,y,br,y,8);
    for (let x=L;x<=R;x+=14){ const k=(x-L)/(R-L); net(x,T, bl+(br-bl)*k,bt, 4); }     // roof panel
    for (let y=T;y<=B;y+=14){ const k=(y-T)/(B-T);                                      // side panels
      net(L,y, bl, bt+(bb-bt)*k, 4); net(R,y, br, bt+(bb-bt)*k, 4); }
    ctx.strokeStyle="rgba(230,232,235,0.5)"; ctx.lineWidth=2;              // rear skeleton frame
    ctx.strokeRect(bl, bt, br-bl, bb-bt);
    // cast shadows FIRST (under the frame): thin angled strips on the grass, not blobs
    ctx.fillStyle="rgba(10,22,12,0.26)";
    for (const px of [L,R]){
      ctx.beginPath(); ctx.moveTo(px-3.5, B); ctx.lineTo(px+3.5, B);
      ctx.lineTo(px+3.5+15, B+4.5); ctx.lineTo(px-3.5+15, B+4.5); ctx.closePath(); ctx.fill();
    }
    // front frame — 16-bit shaded tubes: white core, bright left/top edge, grey right/bottom
    const PW=7;
    ctx.fillStyle="#f4f6f7"; ctx.fillRect(L-PW/2, T-PW/2, (R-L)+PW, PW);    // crossbar core
    ctx.fillStyle="#ffffff"; ctx.fillRect(L-PW/2, T-PW/2+0.5, (R-L)+PW, 2); // bar top highlight
    ctx.fillStyle="#aeb8bf"; ctx.fillRect(L-PW/2, T+PW/2-2, (R-L)+PW, 2);   // bar bottom shade
    for (const px of [L,R]){
      ctx.fillStyle="#f4f6f7"; ctx.fillRect(px-PW/2, T-PW/2, PW, (B-T)+PW/2);   // post core
      ctx.fillStyle="#ffffff"; ctx.fillRect(px-PW/2+0.5, T, 2, B-T);            // left highlight
      ctx.fillStyle="#aeb8bf"; ctx.fillRect(px+PW/2-2, T, 2, B-T);              // right shade
      ctx.fillStyle="#8d979e"; ctx.fillRect(px-PW/2, B-1.5, PW, 1.5);           // ground ring
    }
    ctx.restore();
  }
  function render() {
    ctx.setTransform(SCALE,0,0,SCALE,0,0);
    ctx.clearRect(0,0,VW,SH);
    if (state!==_prevDrawState){ _prevDrawState=state; stateEnterAt=performance.now();
      if (state===ST.TABLE && TOUCH && CAR){ const rowH=TBL_ROWH,clipH=TBL_CLIPH,myp=myPosition(); tableScrollY=clamp((myp-1)*rowH-clipH/2+rowH/2,0,Math.max(0,20*rowH-clipH)); }
    }   // restart the print reveal
    const inMatch = state===ST.COUNTDOWN||state===ST.SERVE||state===ST.FLIGHT||state===ST.RESULT||state===ST.MATCHEND;
    // ---- LANDSCAPE: the MATCH centres the 550-wide field (translate OX) inside a full-width stadium;
    //      the teletext MENUS draw natively across the full VW (ttClear fills the whole view) ----
    if (inMatch) {
      touchBackBtn=null;                  // never let a stale menu back-button fire during gameplay

      {
        ctx.save();
        if (leftFooted){ ctx.translate(2*GCX,0); ctx.scale(-1,1); }   // mirror sprites around the goal centre
        drawGoal();                                                    // L2 goal+net (mirrored with the ball)
        drawKeeper(); drawDefenders(); drawBall(); drawStriker();      // keeper at the BACK (behind the defenders)
        ctx.restore();
      }
      drawHUD();
      drawResultText();
      if (flash>0){ ctx.fillStyle="rgba(255,255,255,"+(flash*0.4)+")"; ctx.fillRect(-OX,0,VW,400); }   // full-width flash

      if (state===ST.COUNTDOWN) {

          ctx.fillStyle="rgba(0,0,0,0.85)"; ctx.font=ttFont(15); ctx.fillText(posMsg, SW/2+2, 122);

        if (leftFooted){ ctx.fillStyle="rgba(0,0,0,0.85)"; ctx.font=ttFont(14); ctx.fillText("LEFT-FOOTED!", SW/2+2, 101);
                         ctx.fillStyle=TTX.cyan; ctx.fillText("LEFT-FOOTED!", SW/2, 100); }
        const n=Math.max(1,Math.ceil(countdownT));
        ctx.font=ttFont(86);                                       // large VT323 countdown digit (not chunky 8-bit)
        ctx.fillStyle="rgba(0,0,0,0.75)"; ctx.fillText(n, SW/2+4, 238);
        ctx.fillStyle=TTX.white; ctx.fillText(n, SW/2, 234);

                     ctx.fillStyle=TTX.yellow; ctx.fillText("SPACE TO SKIP", SW/2, 266); }
        ctx.textAlign="left";
      }
      if (state===ST.SERVE && !kicked && !firstShotShown) {
        const pulse=0.6+0.4*Math.sin(performance.now()/200);
        const shootMsg = TOUCH ? "DRAG & RELEASE TO SHOOT" : "SPACE TO VOLLEY";

        ctx.fillStyle="rgba(6,7,11,0.72)"; ctx.fillRect(-OX,0,VW,SH);   // full-screen dim
        ctx.textAlign="center";
        ctx.fillStyle="rgba(0,0,0,0.85)"; ctx.font=ttFont(40); ctx.fillText("PAUSED", SW/2+3, 192);
        ctx.fillStyle=TTX.yellow; ctx.fillText("PAUSED", SW/2, 190);
        // ---- tuning rows (touch + desktop): drag speed, then release glide ----
        const ctlRow=(label, scY, val, pctStr)=>{          // one −/value/+ row; returns tap rects (view coords)
          const btnW=50,btnH=34, valW=130, totalW=btnW+8+valW+8+btnW, scX=SW/2-totalW/2;
          ctx.font=ttFont(11); ctx.fillStyle=TTX.grey; ctx.fillText(label, SW/2, scY-4);

          ctx.strokeStyle="rgba(255,255,255,0.35)"; ctx.lineWidth=1; ctx.strokeRect(scX+0.5,scY+0.5,btnW-1,btnH-1);
          ctx.font=ttFont(18); ctx.fillStyle=TTX.white; ctx.fillText("−", scX+btnW/2, scY+24);
          ctx.fillStyle="#0d1525"; ctx.fillRect(scX+btnW+8,scY,valW,btnH);
          ctx.strokeStyle="rgba(255,255,255,0.2)"; ctx.strokeRect(scX+btnW+8+0.5,scY+0.5,valW-1,btnH-1);
          ctx.font=ttFont(16); ctx.fillStyle=val===0?TTX.grey:TTX.cyan;
          ctx.fillText(pctStr, scX+btnW+8+valW/2, scY+23);
          const ibx=scX+btnW+8+valW+8;
          ctx.fillStyle="#1a1a2e"; ctx.fillRect(ibx,scY,btnW,btnH);

          return { dec:{x:OX+scX,y:scY,w:btnW,h:btnH}, inc:{x:OX+ibx,y:scY,w:btnW,h:btnH} };

        { const p=dragSpeedMod*5, r=ctlRow("DRAG SPEED", 212, dragSpeedMod, (p>0?"+":"")+p+"%");

        { const p=dragGlideMod*10, r=ctlRow("RELEASE GLIDE — SLIDE AFTER YOU LET GO", 266, dragGlideMod, (p>0?"+":"")+p+"%");
          touchGlideDecRect=r.dec; touchGlideIncRect=r.inc; }
