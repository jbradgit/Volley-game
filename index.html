<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#06070b" />
<title>SCORDAGOL — Volley Your Way To Greatness</title>
<!-- Retro fonts: VT323 = teletext/CRT body text · Press Start 2P = chunky 8-bit (countdown, headings).
     Falls back to monospace offline; self-host these for the production/app build. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #04060a; overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: #fff; -webkit-user-select: none; user-select: none;
    touch-action: none; -webkit-touch-callout: none; overscroll-behavior: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { background: #04060a; image-rendering: auto; max-width: 100%; max-height: 100%;
           box-shadow: 0 0 50px rgba(0,0,0,0.85); touch-action: none; }
  /* off-screen field used to summon the iOS keyboard for name / word entry */
  #kbd { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0;
         border: 0; padding: 0; font-size: 16px; background: transparent; color: transparent; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1100" height="1040"></canvas></div>
<input id="kbd" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" />

<script>
"use strict";
(function () {
  // ---- Logical stage ----
  // SW/SH = the FIELD (gameplay) coordinate space — physics, sprites and every draw* live here,
  // UNCHANGED from the original SWF. VW = the landscape VIEW the field is centred inside (16:9).
  const SW = 550, SH = 520;          // field stage (physics-exact; do not change)
  let SCALE = 2;                     // backing-store supersample (recomputed in fit() to match the display = crisp text)
  const VW = 924;                    // landscape view width (16:9 of SH=520) — widescreen monitors + phones
  const OX = Math.round((VW - SW) / 2);   // x-offset that centres the 550-wide field within the 924 view
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  canvas.width = VW * SCALE; canvas.height = SH * SCALE;   // backing store (single source of truth = VW)

  function fit() {
    const r = Math.min(window.innerWidth / VW, window.innerHeight / SH);
    const cssW = Math.floor(VW * r), cssH = Math.floor(SH * r);
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    // size the backing store to the ACTUAL on-screen pixels so the canvas is never up-scaled (= crisp text, no blur)
    const dpr = window.devicePixelRatio || 1, want = Math.max(2, Math.min(4, (cssW * dpr) / VW));
    if (Math.abs(want - SCALE) > 0.01){ SCALE = want; canvas.width = Math.round(VW*SCALE); canvas.height = Math.round(SH*SCALE); }
  }
  window.addEventListener("resize", fit); fit();
  function toggleFullscreen(){
    try { if (!document.fullscreenElement){ const el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); }
          else { (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); } } catch(e){}
  }
  document.addEventListener("fullscreenchange", ()=>setTimeout(fit,60));

  // Your club + current opponent (both per-team recoloured; defaults used for Quick Play).
  let MYCLUB   = { slug:"Liverpool", name:"Liverpool", rating:8 };
  let OPPONENT = { slug:"AstonVilla", name:"Aston Villa", rating:9, home:false };

  // ---- Static assets (kits are loaded dynamically per club, see loadKits) ----
  const IMG = {};
  const sources = { pitch:"assets/pitch_hd.png?v=hr5", crowd:"assets/crowd.jpg",
                    katlas0:"assets/keeper_atlas_0.png?v=dd", katlas1:"assets/keeper_atlas_1.png?v=dd",
                    kit:"assets/kit.jpg", ball:"assets/ball.png?v=hr", shadow:"assets/shadow.png?v=hr",
                    defmap:"assets/defender_regionmap.png?v=live2" };
  let loaded = 0, total = Object.keys(sources).length, assetsReady = false;
  for (const k in sources) {
    const im = new Image();
    im.onload = () => { if (++loaded === total) assetsReady = true; };
    im.onerror = () => { if (++loaded === total) assetsReady = true; };
    im.src = sources[k]; IMG[k] = im;
  }
  // Striker (your club) + defender (opponent) kits loaded on demand.
  for (const k of ["striker","sk0","sk1","sk2","sk3","sk4","defender"]) IMG[k] = new Image();
  let kitsReady = false;
  // ---- LIVE defender recolour (the original game's Color.setRGB-per-sub-clip, in canvas) ----
  // One region-tag base (assets/defender_regionmap.png): shirt/shorts/socks/sleeves/stripe1 are
  // pure tag colours; skin/hair/boots/outline are kept as-is. We flat-fill each tagged region with
  // the opponent's kit colour at match start — no per-team PNGs needed.
  const DEF_TAGS = [
    { slot:"shirt",  rgb:[255,0,0]   },
    { slot:"shorts", rgb:[0,255,0]   },
    { slot:"socks",  rgb:[0,0,255]   },
    { slot:"sleeves",rgb:[255,255,0] },
    { slot:"stripe", rgb:[0,255,255] },   // stripe1 sub-clip (= teams.json "stripe")
  ];
  let DEFMAP = null;   // cached ImageData of the region-tag base
  const _hexRGB = h => { const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; };
  function ensureDefMap() {
    if (DEFMAP) return DEFMAP;
    const im = IMG.defmap; if (!im || !im.complete || !im.naturalWidth) return null;
    const c = document.createElement("canvas"); c.width=im.naturalWidth; c.height=im.naturalHeight;
    const x = c.getContext("2d"); x.drawImage(im,0,0);
    DEFMAP = { d:x.getImageData(0,0,c.width,c.height).data, w:c.width, h:c.height };
    return DEFMAP;
  }
  function buildDefenderLive(slug) {
    const m = ensureDefMap(), t = TEAMBY[slug];
    if (!m || !t || !PAL) return null;
    // stripe1 sub-clip: invisible on solid kits (= shirt colour), the contrast colour only on striped kits
    const stripeHex = (t.pattern === "stripes" && t.stripe2 && PAL[t.stripe2]) ? PAL[t.stripe2] : (PAL[t.shirt] || "#cccccc");
    const col = {
      shirt:   _hexRGB(PAL[t.shirt]   || "#cccccc"),
      shorts:  _hexRGB(PAL[t.shorts]  || "#ffffff"),
      socks:   _hexRGB(PAL[t.socks]   || "#cccccc"),
      sleeves: _hexRGB(PAL[t.sleeves] || PAL[t.shirt] || "#cccccc"),
      stripe:  _hexRGB(stripeHex),
    };
    const { d, w, h } = m;
    const out = document.createElement("canvas"); out.width=w; out.height=h;
    const octx = out.getContext("2d"); const img = octx.createImageData(w,h); const o = img.data;
    for (let i=0;i<w*h;i++){
      const j=i*4, a=d[j+3];
      if (a<8){ o[j+3]=0; continue; }
      let best=-1, bd=90*90;                              // within ~90 of a pure tag => recolourable
      for (let k=0;k<DEF_TAGS.length;k++){ const c=DEF_TAGS[k].rgb;
        const dr=d[j]-c[0], dg=d[j+1]-c[1], db=d[j+2]-c[2], dist=dr*dr+dg*dg+db*db;
        if (dist<bd){ bd=dist; best=k; } }
      if (best<0){ o[j]=d[j]; o[j+1]=d[j+1]; o[j+2]=d[j+2]; o[j+3]=a; continue; }  // base: skin/hair/boots/outline
      const c=col[DEF_TAGS[best].slot]; o[j]=c[0]; o[j+1]=c[1]; o[j+2]=c[2]; o[j+3]=a;
    }
    octx.putImageData(img,0,0);
    return out;
  }

  function loadKits(mySlug, oppSlug, cb) {
    kitsReady = false;
    const need = [["striker",mySlug+"_k0"],["sk0",mySlug+"_k1"],["sk1",mySlug+"_k2"],
                  ["sk2",mySlug+"_k3"],["sk3",mySlug+"_k4"],["sk4",mySlug+"_k5"]];
    let c = 0, tot = need.length + 1;
    const done = () => { if (++c === tot) { kitsReady = true; cb && cb(); } };
    for (const [key,file] of need) { const im = IMG[key]; im.onload = im.onerror = done; im.src = "assets/striker_"+file+".png?v=hr5"; }
    const dfn = IMG.defender; dfn.onload = dfn.onerror = done;
    const live = buildDefenderLive(oppSlug);                       // original method: recolour live
    if (live) dfn.src = live.toDataURL("image/png");
    else dfn.src = "assets/defender_"+oppSlug+".png?v=hr5";        // fallback to pre-baked PNG
  }
  // Team roster (kits + ratings) for career mode.
  let TEAMS = [], TEAMBY = {}, PAL = {};
  let rosterStatus = "loading";   // loading | ok | error  (surfaced on the menu so failures aren't silent)
  fetch("assets/teams.json")
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(j=>{
      TEAMS=j.teams.slice().sort((a,b)=>a.name.localeCompare(b.name));   // club-select listed A–Z
      PAL=j.palette; for (const t of TEAMS) TEAMBY[t.slug]=t; rosterStatus="ok"; })
    .catch(e=>{ rosterStatus="error"; try{ console.error("teams.json failed to load:", e); }catch(_){} });
  // Keeper sprite-atlas manifest (per-frame rects + offsets, all 371-frame anims packed).
  let KMAN = null;
  fetch("assets/keeper_atlas.json?v=dd").then(r=>r.json()).then(j=>{ KMAN = j.frames; }).catch(()=>{});
  // Keeper labelled animation ranges actually used by the original (frame_10 / frame_9):
  //   dive_left/right = gotoandplay; central catch = gotoandstop a single frame by height.
  const KEEPER_ANIMS = { idle:[1,1], dive_left:[50,99], dive_right:[100,149],
                         low_catch:[323,323], mid_catch:[328,328], high_catch:[354,354] };

  // ---- Exact constants (decompiled) ----
  // The SWF runs at 28 fps. Clip enterFrames (striker movement, animations) fire at 28 Hz,
  // but the game-logic main timeline is a 2-frame loop (mainloop=frame9 -> frame10 -> goto),
  // so ball physics / scoring / keeper run at 14 Hz. We mirror that split exactly.
  const FPS = 28, DT = 1 / FPS;       // SWF frame rate (striker + animations)
  const LPOST = 135, RPOST = 430, BARH = 105, POSTTOL = 13;   // exact SWF (frame_9)
  const KEEPER_START_X = 263;
  const MAN_MIN_X = 50, MAN_MAX_X = 500, MAN_START_X = 450, MAN_Y = 300;
  const SERVE_Y = 300, GOAL_RESOLVE_Y = 160, NET_GOAL_Y = 150, YBIT = 8;
  const KICK_FRAMES = 6;             // SWF frames from Space to contact (kick anim -> frame 7)
  // Defender = inner man sprite (DefineSprite_151), exact registration origin from swf.xml
  const DEF_W = 67, DEF_H = 115, DEF_OX = 33.4, DEF_OY = 57.5;
  // defender stage bbox (= opponent.man.hitTest); origin (ox,oy) maps to the opponent placement
  function defBox(d){ return { x0:d.ox-DEF_OX*d.sx, x1:d.ox+(DEF_W-DEF_OX)*d.sx,
                               y0:d.oy-DEF_OY*d.sy, y1:d.oy+(DEF_H-DEF_OY)*d.sy }; }
  const DEG = Math.PI / 180;
  // Swappable RNG: normal play uses Math.random; daily challenge + HORSE rounds use a SEEDED
  // generator so everyone (or both players) faces an identical serve/keeper/defender sequence.
  let RAND = Math.random;
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function seedRand(seed){ RAND = (seed==null) ? Math.random : mulberry32(seed>>>0); }
  const rnd = (n) => Math.floor(RAND() * n);   // emulate AS random(n) => 0..n-1 (via swappable RAND)
  const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);

  // ---- Audio: the ORIGINAL SWF sound effects (decompiled to assets/snd) ----
  //   116 shotsnd -> kick   118 crink -> post/woodwork   171 -> whistle
  //   172 -> goal cheer   173 -> boos   174 near_miss "ooh" -> save
  const SND = {};
  for (const n of ["kick","post","whistle","goal","boos","ooh"]) {
    const a = new Audio("assets/snd/"+n+".mp3?v=hr5"); a.preload="auto"; SND[n]=a;
  }
  let audioUnlocked=false;
  function audio(){                       // prime playback on first user gesture (autoplay policy)
    if (audioUnlocked) return; audioUnlocked=true;
    for (const n in SND){ const a=SND[n];
      try{ a.muted=true; const p=a.play(); if(p&&p.then) p.then(()=>{a.pause();a.currentTime=0;a.muted=false;}).catch(()=>{a.muted=false;}); }catch(e){} }
  }
  let muted = localStorage.getItem("vc_muted")==="1";
  function play(name, vol){ if(muted) return; const a=SND[name]; if(!a) return;
    try{ const c=a.cloneNode(); c.volume=(vol==null?0.7:vol); c.play().catch(()=>{}); }catch(e){} }
  function toggleMute(){ muted=!muted; localStorage.setItem("vc_muted", muted?"1":"0"); }
  const sfx = {
    kick(){ play("kick",0.75); },
    goal(){ play("goal",0.95); },
    save(){ play("ooh",0.8); },
    post(){ play("post",0.9); },
    whistle(){ play("whistle",0.8); },
    boos(){ play("boos",0.8); }
  };

  // ---- Game state ----
  const ST = { MENU:"menu", NAME:"name", CLUBSEL:"clubsel", TABLE:"table", SEASONEND:"seasonend",
               INBOX:"inbox", EMAIL:"email",
               TITLE:"title", COUNTDOWN:"countdown", SERVE:"serve", FLIGHT:"flight", RESULT:"result",
               MATCHEND:"matchend", OVER:"over",
               DAILYBOARD:"dailyboard", HORSESETUP:"horsesetup", HORSEPASS:"horsepass", HORSEEND:"horseend" };
  let state = ST.MENU;
  let menuSel = 0;          // menu / club-select cursor
  let inboxSel = 0, openedOffer = 0;   // transfer-inbox cursor + opened email index
  let clinchBtn = null;                // clickable "end season" button rect on the career home (when title clinched)
  let nameBuf = "";         // player-name entry buffer
  let pendingMode = "career";  // 'quick' or 'career' — what the club-select confirms into
  let GMODE = "career";     // active game mode: 'career' | 'daily' | 'horse'
  let serveQueue = null, serveIdx = 0;   // pre-rolled serves for seeded (daily/HORSE) matches
  const HORSE_BALLS = 5;    // balls per turn in 2-player HORSE

  const M = { score:0, attempts:10, winTarget:0, drawTarget:0, goals:0,
              best:Number(localStorage.getItem("vc_best")||0) };

  // ---- Career ----
  let CAR = null;   // {name, slug, season, idx, fixtures:[{opp,home}], table:{slug:{p,w,d,l,pts,gd}}, news:[]}
  function loadCareer(){ try { return JSON.parse(localStorage.getItem("vc_career")); } catch(e){ return null; } }
  function saveCareer(){ if (CAR) localStorage.setItem("vc_career", JSON.stringify(CAR)); }
  function freshTable(){ const t={}; for (const tm of TEAMS) t[tm.slug]={p:0,w:0,d:0,l:0,pts:0,gd:0}; return t; }
  function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }
  // Proper double round-robin: play EVERY other club once (random venue) in the first half,
  // then the reverse fixture in the second half — so you never face a team twice until you've
  // played everyone once (like a real league).
  function makeFixtures(slug){
    const others = TEAMS.filter(t=>t.slug!==slug).map(t=>t.slug);
    const firstHome = {}; for (const o of others) firstHome[o] = rnd(2)===0;
    const first  = shuffle(others.map(o=>({opp:o, home: firstHome[o]})));
    const second = shuffle(others.map(o=>({opp:o, home: !firstHome[o]})));
    return first.concat(second);
  }
  function newCareer(name, slug){
    CAR = { name:name||"You", slug, season:1, idx:0, fixtures:makeFixtures(slug),
            table:freshTable(), news:[], titles:0, form:[], titleOdds:null };
    CAR.news.unshift(name+" signs for "+TEAMBY[slug].name+"!");
    saveCareer();
  }
  // ---- Title-race model (shared by simRound + computeTitleOdds) ----
  // A team's per-game win chance is a GENTLE function of its strength so a single rating point
  // doesn't compound into a near-certain title over 38 games. Strength = static rating blended
  // with the team's OBSERVED points-per-game once it has played, so the table reacts to real
  // results. computeTitleOdds also draws a per-team "form" offset each simulated season, giving
  // realistic tails: the favourites sit ~25%, the chasing pack has a genuine chance, and the
  // number visibly MOVES as you win or lose (the old model pinned everyone outside the top 2 at 1%).
  // ODDS_FORM = per-season form variance. Higher = more upsets => a points lead is worth less,
  // so a 5pt lead with 15 games left reads ~60% (like a real betting market) instead of ~74%.
  const ODDS_W0 = 0.22, ODDS_WS = 0.34, ODDS_DRAW = 0.26, ODDS_FORM = 0.32;
  function teamStrength(slug){
    const t=TEAMBY[slug], r=CAR.table[slug]; let s=(t.rating-1)/9;
    if (r.p>=3){ const ppg=r.pts/r.p, sImp=ppg/3, w=Math.min(1, r.p/10); s=(1-w)*s + w*sImp; }
    return clamp(s, 0, 1);
  }
  // simulate one matchday for all teams except those given (player's + opponent's real result handled separately)
  function simRound(exclude){
    for (const tm of TEAMS){
      if (exclude.indexOf(tm.slug)>=0) continue;
      const pW = clamp(ODDS_W0 + ODDS_WS*teamStrength(tm.slug), 0.05, 0.88);
      const row = CAR.table[tm.slug]; row.p++; const x=Math.random();
      if (x < pW){ row.w++; row.pts+=3; row.gd+=1+rnd(2); }
      else if (x < pW+ODDS_DRAW){ row.d++; row.pts+=1; }
      else { row.l++; row.gd-=1+rnd(2); }
    }
  }
  // Monte-Carlo the rest of the season -> % chance the player finishes 1st.
  function computeTitleOdds(){
    if (!CAR) return null;
    const N=500, total=CAR.fixtures.length, me=CAR.slug; let wins=0;
    const sT={}; for (const t of TEAMS) sT[t.slug]=teamStrength(t.slug);   // base strengths once per call
    for (let k=0;k<N;k++){
      const pts={}, gd={};
      for (const t of TEAMS){ const r=CAR.table[t.slug]; pts[t.slug]=r.pts; gd[t.slug]=r.gd;
        const form=(Math.random()*2-1)*ODDS_FORM;                          // this team runs hot/cold this season
        const pW=clamp(ODDS_W0 + ODDS_WS*sT[t.slug] + form, 0.05, 0.88);
        for (let g=total-r.p; g>0; g--){ const x=Math.random();
          if (x<pW){ pts[t.slug]+=3; gd[t.slug]++; } else if (x<pW+ODDS_DRAW){ pts[t.slug]++; } else { gd[t.slug]--; } }
      }
      let best=me;
      for (const t of TEAMS){ if (pts[t.slug]>pts[best] || (pts[t.slug]===pts[best] && gd[t.slug]>gd[best])) best=t.slug; }
      if (best===me) wins++;
    }
    let pct=Math.round(wins/N*100);
    // floor at 1% only while the player can still mathematically reach the top rival's current points
    if (pct===0){
      const myMax=CAR.table[me].pts + (total-CAR.table[me].p)*3;
      let bestRival=0;
      for (const t of TEAMS){ if (t.slug===me) continue;
        if (CAR.table[t.slug].pts>bestRival) bestRival=CAR.table[t.slug].pts; }
      if (myMax>bestRival) pct=1;
    }
    return pct;
  }
  function standings(){
    // by points, then goal-difference, then ALPHABETICAL (so the pre-season table is A–Z)
    return TEAMS.slice().sort((a,b)=>{ const A=CAR.table[a.slug],B=CAR.table[b.slug];
      return B.pts-A.pts || B.gd-A.gd || a.name.localeCompare(b.name); });
  }
  function myPosition(){ return standings().findIndex(t=>t.slug===CAR.slug)+1; }
  function clubFinishPos(slug){ return standings().findIndex(t=>t.slug===slug)+1; }

  // ---- title clinched (mathematically champions with games to spare) ----
  function titleClinched(){
    if (!CAR || CAR.idx>=CAR.fixtures.length) return false;
    const total=CAR.fixtures.length, me=CAR.slug, myPts=CAR.table[me].pts;
    for (const t of TEAMS){ if (t.slug===me) continue;
      const r=CAR.table[t.slug]; if (r.pts + (total-r.p)*3 >= myPts) return false; }   // a rival can still reach you
    return true;
  }
  function endSeasonEarly(){    // simulate the dead-rubber run-in and jump to the summer
    while (CAR.idx < CAR.fixtures.length){
      const fx=CAR.fixtures[CAR.idx], me=CAR.table[CAR.slug], op=CAR.table[fx.opp];
      const pW=clamp(ODDS_W0+ODDS_WS*teamStrength(CAR.slug),0.05,0.9), x=Math.random();
      const res = x<pW ? "W" : (x<pW+ODDS_DRAW ? "D" : "L");
      me.p++; op.p++;
      if (res==="W"){ me.w++; me.pts+=3; me.gd+=2; op.l++; op.gd-=2; }
      else if (res==="D"){ me.d++; me.pts++; op.d++; op.pts++; }
      else { me.l++; me.gd-=2; op.w++; op.pts+=3; op.gd+=2; }
      CAR.form=(CAR.form||[]); CAR.form.unshift(res); CAR.form=CAR.form.slice(0,5);
      simRound([CAR.slug, fx.opp]); CAR.idx++;
      CAR.lastResults = genGameweekResults(res, fx);
    }
    CAR.titleOdds=100; saveCareer(); enterSeasonEnd();
  }

  // ---- last-gameweek results (cosmetic ticker on the career home screen) ----
  function genGameweekResults(myRes, myFx){
    const out=[];
    const oppSlug=(myFx&&myFx.opp)||OPPONENT.slug;
    const meN=TEAMBY[CAR.slug].name.toUpperCase(), opN=TEAMBY[oppSlug].name.toUpperCase();
    let ms = myRes==="W" ? 1+rnd(3) : (myRes==="D" ? rnd(3) : rnd(2));
    let os = myRes==="W" ? rnd(ms) : (myRes==="D" ? ms : ms+1+rnd(2));
    out.push(myFx && myFx.home===false ? (opN+" "+os+"-"+ms+" "+meN) : (meN+" "+ms+"-"+os+" "+opN));
    const rest = shuffle(TEAMS.filter(t=>t.slug!==CAR.slug && t.slug!==oppSlug).map(t=>t));
    for (let i=0;i+1<rest.length;i+=2){
      const a=rest[i], b=rest[i+1];
      const as=rnd(4), bs=rnd(4);
      out.push(a.name.toUpperCase()+" "+as+"-"+bs+" "+b.name.toUpperCase());
    }
    return out;
  }

  // ---- transfer offers (email inbox at season end) ----
  const COLOUR_WORD = { red:"red", white:"white", blue:"blue", black:"black", yellow:"yellow", grey:"grey",
    green:"green", claret:"claret", skyblue:"sky blue", orange:"orange", darkblue:"dark blue", navy:"navy", gold:"gold" };
  function kitDesc(slug){
    const t=TEAMBY[slug]||{}; const a=COLOUR_WORD[t.shirt]||t.shirt;
    let b=null; for (const c of [t.stripe2, t.swatch_accent, t.sleeves, t.shorts, t.socks]){
      if (c && c!==t.shirt && COLOUR_WORD[c]){ b=COLOUR_WORD[c]; break; } }
    return b ? (a+" and "+b) : a;
  }
  function offerSubject(fp){
    if (fp===1) return "Join the Champions";
    if (fp<=4)  return "Champions League football awaits";
    if (fp<=7)  return "A new challenge for you";
    if (fp<=12) return "We'd love to sign you";
    return "Help us climb the table";
  }
  function offerBody(t, fp){
    return "Dear "+CAR.name+",\n\n"+
      "We've had an eye on you throughout this very impressive campaign and think you'd be a perfect fit for us here at "+t.name+".\n\n"+
      "We finished "+ord(fp)+" in the league this season, and we're certain you'd look right at home in our "+kitDesc(t.slug)+".\n\n"+
      "We do hope you'll consider joining us.\n\n"+
      "Kind regards,\nThe Board, "+t.name;
  }
  function genOffers(){
    const pos=myPosition();
    const nMax = pos===1?4 : pos<=4?3 : pos<=10?2 : pos<=14?1 : 0;
    if (nMax<=0) return [];
    const std=standings();
    // clubs that finished ABOVE you, closest first (the realistic next step up)…
    const above=std.filter(t=>t.slug!==CAR.slug && clubFinishPos(t.slug)<pos);
    let cands=above.slice(-nMax).reverse();
    // …and if you're at/near the top, the rest of the elite court you too
    if (cands.length<nMax){ const below=std.filter(t=>t.slug!==CAR.slug && clubFinishPos(t.slug)>pos);
      cands=cands.concat(below.slice(0, nMax-cands.length)); }
    return cands.map(t=>{ const fp=clubFinishPos(t.slug);
      return { slug:t.slug, name:t.name, rating:TEAMBY[t.slug].rating, pos:fp, subject:offerSubject(fp), body:offerBody(t,fp), read:false }; });
  }
  function enterSeasonEnd(){ if (!CAR.offers) CAR.offers=genOffers(); inboxSel=0; openedOffer=0; state=ST.SEASONEND; }

  // physics vars (mirror original names)
  let velocity, angle, cangle, sangle, t, bounce, bounced, booted, innet;
  let xball, yball, z, dbx, dby, ybit, yscale, ay;   // ay = original serve "y" (xball lags it by 1 step)
  let checked, dive, no_dive, divedirn, destination, keeperX;
  let manX, kicked, cchecked, kickTick, manFinished, complete_miss, end, sc;
  let hitkeeper, held, hitbar, lposthit, rposthit, leftcorner, rightcorner, topnet, znet;
  let resultText="", resultColor="#fff", resultPoints=0, resultTimer=0, flash=0;
  let paused=false, countdownT=0;
  let mouseTargetX=null;          // striker target x (null = not steering)
  let dragStartFieldX=null, dragManStartX=null;   // relative-drag anchor (touch only)
  let touchPauseResumeRect=null, touchPauseForfeitRect=null;
  let touchSpeedDecRect=null, touchSpeedIncRect=null;   // speed-adjust tap zones in pause overlay
  let touchBackBtn=null;
  let clubSelConfirmBtn=null;   // explicit confirm button on club select screen
  let dragSpeedMod = clamp(parseInt(localStorage.getItem("vc_speed")||"0"), -10, 10);
  let manKicking=false, manKickT=0;
  let defenders = [];
  let keeperPose = { x:KEEPER_START_X, dir:"up", anim:"idle", frame:1 };
  let leftFooted=false;           // ~1 in 5 matches: mirror the play (left-footed)
  let matchEndText="", matchEndColor="#fff", matchEndTimer=0;   // end-of-match VICTORY/DRAW/LOSS burst
  const GCX = (LPOST+RPOST)/2;    // goal centre x: sprites mirror around this so they stay in the goal mouth
  // ---- per-match random hair ----
  const HAIR_COLOURS = [[40,40,42],[150,95,45],[225,195,120],[196,96,0],[120,30,30],[185,185,185]]; // black, brown, blonde, ginger, auburn, grey
  const STRIKER_HAIR = [];        // 6 hair-recoloured frame canvases for the current match
  function buildHairFrames(){
    STRIKER_HAIR.length=0;
    const imgs=[IMG.striker,IMG.sk0,IMG.sk1,IMG.sk2,IMG.sk3,IMG.sk4];
    const hc=HAIR_COLOURS[rnd(HAIR_COLOURS.length)];
    for (const im of imgs){
      if (!im || !im.naturalWidth){ STRIKER_HAIR.push(null); continue; }
      const c=document.createElement("canvas"); c.width=im.naturalWidth; c.height=im.naturalHeight;
      const g=c.getContext("2d"); g.drawImage(im,0,0);
      const d=g.getImageData(0,0,c.width,c.height), p=d.data;
      for (let i=0;i<p.length;i+=4){
        const r=p[i],gg=p[i+1],b=p[i+2],a=p[i+3];
        if (a>40 && r>=120&&r<=232 && gg>=40&&gg<=150 && b<58 && (r-gg)>=48 && (gg-b)>34){  // ginger hair
          const v=Math.min(1.12, r/192);
          p[i]=Math.min(255,hc[0]*v); p[i+1]=Math.min(255,hc[1]*v); p[i+2]=Math.min(255,hc[2]*v);
        }
      }
      g.putImageData(d,0,0); STRIKER_HAIR.push(c);
    }
  }

  function setTargets() {
    M.winTarget = 2000 + OPPONENT.rating*1500 + rnd(10)*200;
    if (!OPPONENT.home) M.winTarget += 2000;
    M.drawTarget = Math.floor(M.winTarget*5/10);
  }

  function startMatch(opts) {
    opts = opts || {};
    M.score=0; M.attempts=opts.balls||10; M.goals=0; manX=MAN_START_X; mouseTargetX=null;
    if (opts.seed!=null){                 // seeded: a reproducible serve sequence (daily / HORSE round)
      const pr=mulberry32(opts.seed>>>0);
      serveQueue=[]; for (let i=0;i<M.attempts+4;i++) serveQueue.push({v:Math.floor(pr()*5)+18, a:Math.floor(pr()*5)+35});
      serveIdx=0; leftFooted = Math.floor(pr()*5)===0; RAND = Math.random;   // keeper/defenders stay reactive to play
    } else {
      serveQueue=null; serveIdx=0; leftFooted = rnd(5)===0;   // ~1 in 5 matches mirror the play (left-footed)
    }
    teamHud = teamColors(MYCLUB.slug);   // info panel themed to your club's kit
    buildHairFrames();                   // random hair colour this match
    setTargets(); sfx.whistle();
    newServe();                          // sets up the scene + first serve...
    countdownT=3.0; state=ST.COUNTDOWN;  // ...held behind a 3-2-1 so you can get in position
  }

  // Career: play the current fixture.
  function startFixture() {
    const fx = CAR.fixtures[CAR.idx], ot = TEAMBY[fx.opp];
    OPPONENT = { slug:ot.slug, name:ot.name, rating:ot.rating, home:fx.home };
    MYCLUB   = { slug:CAR.slug, name:TEAMBY[CAR.slug].name, rating:TEAMBY[CAR.slug].rating };
    loadKits(MYCLUB.slug, OPPONENT.slug, startMatch);
  }
  function matchResult(){ return M.score>=M.winTarget ? "W" : (M.score>=M.drawTarget ? "D" : "L"); }
  // Match finished (10 balls used): show the VICTORY/DRAW/LOSS burst, then commit.
  function endMatch() {
    if (M.score>M.best){ M.best=M.score; localStorage.setItem("vc_best",M.best); }
    if (GMODE==="horse"){ horseTurnDone(); return; }   // 2-player: record the turn, advance
    if (GMODE==="daily"){ dailyDone();    return; }     // daily: record to leaderboard
    const res = matchResult();                          // career: VICTORY/DRAW/LOSS burst
    matchEndText  = res==="W" ? "VICTORY" : (res==="D" ? "DRAW" : "LOSS");
    matchEndColor = res==="W" ? "#46e36b" : (res==="D" ? "#c7d0da" : "#ff5d5d");
    if (res==="W") sfx.goal(); else if (res==="L") sfx.boos(); else sfx.whistle();
    matchEndTimer = 3.0; state = ST.MATCHEND;
  }
  // Varied tabloid-style headline for the result. {n}=player {c}=your club {o}=opponent {s}=score.
  function headline(res, pos){
    const n=CAR.name, c=MYCLUB.name, o=OPPONENT.name, s=M.score;
    const W=["{n} fires {c} past {o}","{c} sink {o} as {n} stars","Sublime {n} downs {o}",
      "{c} too hot for {o}","{n} on fire: {o} blown away","Three points! {c} see off {o}",
      "{o} have no answer to {n}","Dream day for {n} at {c}","{n} masterclass buries {o}",
      "{c} march on, {o} beaten","{n} the hero again versus {o}","Ruthless {c} dismantle {o}",
      "{n} hits {s} as {c} beat {o}","{o} sunk by clinical {c}"];
    const D=["{c} held by stubborn {o}","Honours even: {c} and {o} share it","{n} frustrated by {o}",
      "Stalemate as {c} draw {o}","{c} forced to settle for a point","{n} can't break {o} down",
      "A point apiece for {c} and {o}","Spoils shared between {c} and {o}","{o} dig in to deny {n}"];
    const L=["{c} fall to {o}","Off day for {n} as {o} win","{o} edge a tight one with {c}",
      "{c} undone by {o}","{n} left to rue defeat at {o}","Nightmare for {c} against {o}",
      "{o} pile on the misery for {c}","{c} slump to defeat by {o}","Blank day for {n} as {o} prevail"];
    const pool = res==="W"?W:(res==="D"?D:L);
    let h = pool[rnd(pool.length)];
    // occasional context flavour
    if (res==="W" && pos===1 && rnd(2)===0) h="{c} go top! {n} downs {o}";
    else if (res==="L" && pos>=18 && rnd(2)===0) h="Pressure mounts on {n} as {c} lose to {o}";
    return h.replace(/{n}/g,n).replace(/{c}/g,c).replace(/{o}/g,o).replace(/{s}/g,s);
  }
  // After the burst: record the result + advance the career (or Quick-Play OVER).
  function commitMatch() {
    if (!CAR){ state=ST.OVER; return; }
    const res = matchResult();
    const me = CAR.table[CAR.slug], opp = CAR.table[OPPONENT.slug];
    me.p++; opp.p++;
    if (res==="W"){ me.w++; me.pts+=3; me.gd+=2; opp.l++; opp.gd-=2; }
    else if (res==="D"){ me.d++; me.pts+=1; opp.d++; opp.pts+=1; }
    else { me.l++; me.gd-=2; opp.w++; opp.pts+=3; opp.gd+=2; }
    const mypos0 = myPosition();   // standing after this result (for headline flavour)
    CAR.news.unshift(headline(res, mypos0));
    CAR.news = CAR.news.slice(0,8);
    CAR.form = (CAR.form||[]); CAR.form.unshift(res); CAR.form = CAR.form.slice(0,5);   // last-5 form
    simRound([CAR.slug, OPPONENT.slug]);
    CAR.idx++;
    CAR.lastResults = genGameweekResults(res, CAR.fixtures[CAR.idx-1]);   // ticker for the career home screen
    CAR.titleOdds = computeTitleOdds();      // refresh title odds after this game
    saveCareer();
    if (CAR.idx >= CAR.fixtures.length) enterSeasonEnd(); else state = ST.TABLE;
  }

  function newServe() {
    clearResult();   // each shot owns its result text; a 0-point miss must not inherit the last GOAL/SAVE
    if (serveQueue){ const s=serveQueue[Math.min(serveIdx,serveQueue.length-1)]; serveIdx++; velocity=s.v; angle=s.a; }
    else { velocity = rnd(5)+18; angle = rnd(5)+35; }
    cangle = Math.cos(angle*DEG); sangle = Math.sin(angle*DEG);
    t=0; bounce=0; bounced=1; booted=false; innet=false; ay=0;
    xball=0; yball=SERVE_Y; z=0; dbx=0; dby=0; ybit=YBIT; yscale=93;
    checked=false; dive=false; no_dive=true; divedirn="up"; destination=0; keeperX=KEEPER_START_X;
    kicked=false; cchecked=false; kickTick=0; manFinished=false; complete_miss=false; end=0; sc=0;
    hitkeeper=0; held=false; hitbar=false; lposthit=false; rposthit=false;
    leftcorner=0; rightcorner=0; topnet=0; znet=0;
    manKicking=false; manKickT=0;
    keeperPose = { x:KEEPER_START_X, dir:"up", anim:"idle", frame:1 };
    // Defenders: exact placements from the SWF (PlaceObject matrices, twips/20).
    // opponent1 deflects -=10+rnd8 @ yball<240; opponent2 -=20+rnd8 @ yball<200; opponent3 +=10+rnd8 @ yball<200.
    defenders = [
      { ox:117.95, oy:210.25, sx:1.0000, sy:1.0000, thr:240, mag:10, sign:-1, chk:false },
      { ox: 27.60, oy:163.35, sx:0.8982, sy:0.8960, thr:200, mag:20, sign:-1, chk:false },
      { ox:471.15, oy:157.75, sx:0.8234, sy:0.8264, thr:200, mag:10, sign:+1, chk:false }
    ];
    state = ST.SERVE;
  }

  function triggerKick() {
    if (!kicked && (state===ST.SERVE)) { kicked=true; manKicking=true; manKickT=0; kickTick=0; }
  }

  // offscreen buffer for the keeper pixel hit-test (faithful to keeps.hitTest(...,true))
  const offC = document.createElement("canvas"); offC.width=SW; offC.height=420;
  const offCtx = offC.getContext("2d");

  // ---- saved_check(): pixel-test the keeper sprite at 8 points around the ball, like the original ----
  function savedCheck() {
    offCtx.setTransform(1,0,0,1,0,0);
    offCtx.clearRect(0,0,SW,420);
    drawKeeperTo(offCtx);
    const bx = xball, by = yball - z;   // ball._x, ball._y
    const pts = [[0,0],[-10,-8],[10,-8],[0,-15],[0,-7],[-5,-5],[5,-5],[0,3]];   // original's sample offsets
    hitkeeper = 0;
    for (const [ox,oy] of pts) {
      const sx = Math.round(bx+ox), sy = Math.round(by+oy);
      if (sx<0||sy<0||sx>=SW||sy>=420) continue;
      if (offCtx.getImageData(sx,sy,1,1).data[3] > 16) { hitkeeper = 1; break; }
    }
    if (dbx > 1 && xball < 170) { leftcorner=1; rightcorner=0; }
    if (dbx < 1 && xball > 400) { rightcorner=1; leftcorner=0; }
    if (z > 75) { topnet=1; znet=z; }
  }

  // striker movement: keyboard (±5/tick) takes priority; otherwise ease toward the mouse target.
  // When left-footed the scene is mirrored, so swap the arrow keys (mouse target is already mapped).
  function moveMan() {
    const R = leftFooted ? input.left : input.right;
    const L = leftFooted ? input.right : input.left;
    if (R && manX<MAN_MAX_X) manX=Math.min(MAN_MAX_X, manX+5);
    else if (L && manX>MAN_MIN_X) manX=Math.max(MAN_MIN_X, manX-5);
    else if (mouseTargetX!=null){ const d=mouseTargetX-manX, step=6.9*(1+dragSpeedMod*0.05);
      if (Math.abs(d)>0.5) manX=clamp(manX+Math.max(-step,Math.min(step,d)), MAN_MIN_X, MAN_MAX_X); }
  }
  // ---- 28 Hz frame: striker movement + animations; drives the 14 Hz logic loop ----
  function swfFrame() {
    if (paused) return;                  // ENTER toggles pause; freezes sim while held
    if (state===ST.COUNTDOWN) {          // move into position before the first ball is fed
      moveMan();
      countdownT -= DT;
      if (countdownT<=0) state=ST.SERVE;
      return;
    }
    if (state===ST.RESULT) {
      moveMan();   // allow pre-positioning during result animation
      resultTimer -= DT;
      if (resultTimer<=0) {
        if (M.attempts<=0) endMatch();
        else newServe();
      }
      return;
    }
    if (state===ST.MATCHEND) {           // VICTORY/DRAW/LOSS burst, then record + advance
      matchEndTimer -= DT;
      if (matchEndTimer<=0) commitMatch();
      return;
    }
    if (state!==ST.SERVE && state!==ST.FLIGHT) return;

    // striker movement runs every SWF frame (28 Hz) — like the original man.enterFrame
    moveMan();
    // kick animation advances at 28 Hz; contact (man.finished) lands on anim frame 7
    if (manKicking) manKickT++;
    if (kicked && !cchecked) { kickTick++; if (kickTick>=KICK_FRAMES) manFinished=true; }
    // keeper dive animation plays at the SWF frame rate (one source frame per 28 Hz tick)
    if (dive && !no_dive) {
      const a = KEEPER_ANIMS[keeperPose.anim] || KEEPER_ANIMS.dive_left;
      if (keeperPose.frame < a[1]) keeperPose.frame++;
    }

    // game logic runs every frame (28 Hz) — full-rate cross, matches the original's feel
    logicStep();
  }

  // ---- 14 Hz logic: frame_9 (physics + resolve) then frame_10 (contact, defenders, keeper, end) ----
  function logicStep() {
    // ===== frame_9: ball physics =====
    t += 0.06;
    if (!booted) {
      yball = SERVE_Y;
      xball = ay*10;                              // xball lags ay by one step (faithful)
      ay = cangle*velocity*t + bounce;
      z = (sangle*velocity*t - 5*t*t)*10;
      if (z<0) { t=0; bounce=ay; bounced=2; velocity*=0.7; z=0; }
      yscale = 10 + 90*yball/325;
    } else if (!innet) {
      xball -= dbx; yball -= ybit; z += dby/13;
      yscale = 10 + 90*yball/325;
      if (yball<GOAL_RESOLVE_Y && !checked) {
        checked=true; savedCheck();
        // ===== EXACT transcription of frame_9 resolution =====
        if (hitkeeper===0) {
          if (Math.abs(xball-RPOST)<POSTTOL && z<BARH) {
            rposthit=true; ybit=-ybit; dbx=-10; M.score+=Math.round(150/bounced); flagResult("WOODWORK!","#ff9f1c",150); sfx.post();
          }
          if (Math.abs(xball-LPOST)<POSTTOL && z<BARH) {
            lposthit=true; ybit=-ybit; dbx=10; M.score+=Math.round(150/bounced); flagResult("WOODWORK!","#ff9f1c",150); sfx.post();
          }
          if (z>=BARH-15 && z<=BARH && xball>LPOST && xball<RPOST) {
            if (!(lposthit||rposthit)) { hitbar=true; dby=10; M.score+=Math.round(150/bounced); flagResult("OFF THE BAR!","#ff9f1c",150); sfx.post(); }
          }
          if (xball>LPOST && xball<RPOST && z<BARH && !rposthit && !lposthit && !hitbar) {
            innet=true;   // GOAL
          } else if (!rposthit && !lposthit && !hitbar) {
            flagResult("MISSED!","#ff5d5d",0);   // wide/over -> miss (no score; cosmetic text only)
          }
        } else {
          M.score+=Math.round(300/bounced); flagResult("SAVED!","#ffd23f",300); sfx.save();
          if (divedirn==="left"){ ybit=-ybit; dbx=10; dby=-dby; } else { ybit=-ybit; dbx=-10; dby=-dby; }
          if (no_dive){ held=true; keeperPose.anim="catch"; keeperPose.frame = (z<30 ? 323 : (z<60 ? 328 : 354)); }
        }
        if (window.__dbg) window.__rs={finalx:Math.round(xball),z:Math.round(z),hk:hitkeeper,innet,rp:rposthit,lp:lposthit,bar:hitbar};
      }
    } else {
      xball -= dbx; yball -= 6; z += dby/12;
      yscale = 10 + 90*yball/325;
      if (rightcorner===1){ dbx=10; rightcorner=0; }
      if (leftcorner===1){ dbx=-10; leftcorner=0; }
      if (topnet===1){ z=znet-20; }
      if (yball<NET_GOAL_Y) {
        end=1; M.score+=Math.round(4000/bounced); sc=1; M.goals++;
        flagResult("GOOOOAL!","#46e36b",4000); sfx.goal(); flash=0.6;
      }
    }

    // ===== frame_10: contact, defenders, keeper, end =====
    // contact resolves once the kick animation has reached its strike frame
    if (kicked && !cchecked && manFinished) {
      cchecked=true;
      dbx = manX + 15 - xball;
      dby = z;
      if (z<40 && Math.abs(dbx)<30) {
        booted=true; innet=false; M.score += Math.round(100/bounced); sfx.kick();
        state=ST.FLIGHT;
      } else {
        complete_miss=true;   // whiff – attempt lost when ball rolls off
      }
    }
    dby = z;   // frame_10 line 50

    // defenders: each gets ONE hitTest the moment the ball passes its depth threshold (frame_10 1-30)
    if (booted) {
      const bx = xball, by = yball - z;   // ball._x, ball._y (screen)
      for (const d of defenders) {
        if (!d.chk && yball < d.thr) {
          d.chk = true;
          const b = defBox(d);
          if (bx>=b.x0 && bx<=b.x1 && by>=b.y0 && by<=b.y1){ dbx += d.sign*(d.mag + rnd(8));
            if (window.__df) window.__df.push({ox:d.ox,sign:d.sign,atx:Math.round(bx),aty:Math.round(by),newdbx:Math.round(dbx)}); }
        }
      }
    }

    // keeper dive AI
    if (booted && !dive) {
      dive=true; destination = xball - 18*dbx; divedirn="up";
      if (rnd(10)<8) {
        if (destination>310 && destination<500){ divedirn="right"; no_dive=false; keeperPose.anim="dive_right"; keeperPose.frame=KEEPER_ANIMS.dive_right[0]; }
        if (destination<250 && destination>50){ divedirn="left"; no_dive=false; keeperPose.anim="dive_left"; keeperPose.frame=KEEPER_ANIMS.dive_left[0]; }
      }
      keeperPose.dir = divedirn;
    }
    if (dive && no_dive) {
      if (destination>keeperPose.x) keeperPose.x+=1;
      if (destination<keeperPose.x) keeperPose.x-=1;
    }

    // end conditions + serve roll-off
    if (yball<100) end=1;
    if (hitbar && z>200) end=1;
    if ((lposthit||rposthit||hitkeeper===1) && yball>200) end=1;
    if (t>7) end=1;

    const shotOver = (end===1) || (!booted && xball>=600);
    if (shotOver) {
      if (!booted) flagResult(complete_miss ? "MISSED IT!" : "NO CONTACT", "#9aa7b4", 0);
      if (!sc) M.attempts--;     // goals (sc=1) are free shots
      resultTimer = 0.7;
      state = ST.RESULT;
    }
  }

  function flagResult(txt,col,pts){ if(resultText==="" || pts>0){ resultText=txt; resultColor=col; resultPoints=pts; } }

  // =================== RENDER ===================
  function clearResult(){ resultText=""; resultColor="#fff"; resultPoints=0; }

  // Logical (zoom-1) sprite sizes + registration origins. Bitmaps are exported at 3x and
  // drawn at these logical sizes so the browser downscales -> crisp (vector-equivalent at this canvas).
  const BALL_W = 41, BALL_H = 41, BALL_OX = 19.6, BALL_OY = 34.1;
  const SHADOW_W = 28, SHADOW_H = 11, SHADOW_OX = 13.0, SHADOW_OY = 0.0;
  function drawBall() {
    if (held || state===ST.COUNTDOWN) return;
    const ss = yscale/100;                          // shadow + in-net ball use full yscale
    const bs = (innet ? yscale : yscale*0.8)/100;   // /ball uses yscale*0.8, /ball2 (in net) uses yscale (frame_9 :276/:285)
    // shadow: origin (13.0, 0.0) maps to (xball, yball); alpha ~0.25 (original CXFORM alphaMult 64/256)
    if (yball>=130 && IMG.shadow.naturalWidth) {
      ctx.globalAlpha=0.25;
      ctx.drawImage(IMG.shadow, xball-SHADOW_OX*ss, yball-SHADOW_OY*ss, SHADOW_W*ss, SHADOW_H*ss);
      ctx.globalAlpha=1;
    }
    // ball: origin (19.6, 34.1) maps to (xball, yball-z)
    if (IMG.ball.naturalWidth) {
      ctx.drawImage(IMG.ball, xball-BALL_OX*bs, (yball-z)-BALL_OY*bs, BALL_W*bs, BALL_H*bs);
    }
  }

  function drawKeeper() { drawKeeperTo(ctx); }

  // Exact keeper placement scale from the SWF (PlaceObject / keeps._yscale=78).
  // Feet-anchor: keeper standing feet (PNG 300,197) -> stage (keeps._x=263, goal-line y=163).
  const KEEPER_SX = 0.7530, KEEPER_SY = 0.7767;
  const KEEPER_FEET_PX = 300, KEEPER_FEET_PY = 197;   // standing feet/centre in the 596x263 sprite
  const KEEPER_STAGE_Y = 163;                          // goal line (measured from pitch.jpg post base)

  // Render the current keeper frame from the sprite atlas. Frames share a unified canvas, so
  // each frame's (ox,oy) offset (logical px) positions it relative to the fixed feet anchor;
  // side-dive frames carry the lateral motion internally (keeps._x stays put on a dive).
  function drawKeeperTo(g) {
    if (!KMAN) return;
    const fr = KMAN[String(keeperPose.frame)] || KMAN["1"];
    if (!fr) return;
    const sheet = fr.sheet===0 ? IMG.katlas0 : IMG.katlas1;
    if (!sheet || !sheet.naturalWidth) return;
    g.save();
    g.translate(keeperPose.x, KEEPER_STAGE_Y);     // central keeper shuffles x; dives keep x=263
    g.drawImage(sheet, fr.x, fr.y, fr.w, fr.h,
                (fr.ox - KEEPER_FEET_PX)*KEEPER_SX, (fr.oy - KEEPER_FEET_PY)*KEEPER_SY,
                (fr.w/2)*KEEPER_SX, (fr.h/2)*KEEPER_SY);   // /2: atlas is exported at 2x
    g.restore();
  }

  // exact: gameplay player placed at scale 1.0 (root); registration origin (101.2,126.5) -> (man._x, man._y)
  const STRIKER_OX = 101.2, STRIKER_OY = 126.5, STRIKER_W = 131, STRIKER_H = 191;
  function drawStriker() {
    if (!IMG.striker.complete || !IMG.striker.naturalWidth) return;
    const hair = STRIKER_HAIR.length===6 && STRIKER_HAIR[0];   // hair-recoloured frame canvases
    let img;
    if (manKicking) {
      const seq = hair ? [STRIKER_HAIR[1],STRIKER_HAIR[2],STRIKER_HAIR[3],STRIKER_HAIR[4],STRIKER_HAIR[5]]
                       : [IMG.sk0, IMG.sk1, IMG.sk2, IMG.sk3, IMG.sk4];
      const idx = Math.max(0, Math.min(4, Math.floor((manKickT-1)/2)));
      img = (seq[idx] && (seq[idx].naturalWidth||seq[idx].width)) ? seq[idx] : (hair ? STRIKER_HAIR[0] : IMG.striker);
    } else {
      img = hair ? STRIKER_HAIR[0] : IMG.striker;
    }
    ctx.drawImage(img, manX - STRIKER_OX, MAN_Y - STRIKER_OY, STRIKER_W, STRIKER_H);
  }

  function drawDefenders() {
    if (!IMG.defender.complete || !IMG.defender.naturalWidth) return;
    // far (smaller) first for correct overlap; draw man origin (DEF_OX,DEF_OY) at the opponent placement
    const order = defenders.slice().sort((a,b)=>a.sy-b.sy);
    for (const d of order) {
      ctx.drawImage(IMG.defender, d.ox - DEF_OX*d.sx, d.oy - DEF_OY*d.sy, DEF_W*d.sx, DEF_H*d.sy);
    }
  }

  // chunky 3D arcade panel border: raised (light TL / dark BR) or inset (dark TL / light BR)
  function bevel(x,y,w,h,fill,inset,t){
    t=t||3;
    ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);
    ctx.fillStyle=inset?"#0b0d11":"#5a5f68"; ctx.fillRect(x,y,w,t); ctx.fillRect(x,y,t,h);             // top + left (grey)
    ctx.fillStyle=inset?"#5a5f68":"#0b0d11"; ctx.fillRect(x,y+h-t,w,t); ctx.fillRect(x+w-t,y,t,h);     // bottom + right
  }
  // ---- 7-segment LED readout (arcade scoreboard digits) ----
  const _SEG={'0':'abcdef','1':'bc','2':'abdeg','3':'abcdg','4':'bcfg','5':'acdfg','6':'acdefg','7':'abc','8':'abcdefg','9':'abcdfg','-':'g',' ':''};
  function ledDigit(x,y,w,h,ch,on,off){
    const t=Math.max(3,Math.round(Math.min(w,h)*0.22)), m=y+h/2, segs=_SEG[ch]!=null?_SEG[ch]:'';   // chunky segments
    const S={ a:[x+t,y,w-2*t,t], g:[x+t,m-t/2,w-2*t,t], d:[x+t,y+h-t,w-2*t,t],
              f:[x,y+t,t,h/2-1.5*t], b:[x+w-t,y+t,t,h/2-1.5*t],
              e:[x,m+t/2,t,h/2-1.5*t], c:[x+w-t,m+t/2,t,h/2-1.5*t] };
    for (const k in S){ const r=S[k]; ctx.fillStyle = segs.indexOf(k)>=0?on:off; ctx.fillRect(r[0],r[1],r[2],r[3]); }
  }
  function drawLED(x,y,w,h,str,on,off){
    const n=str.length||1, dw=Math.min(w/n, h*0.74), gap=dw*0.14, sx=x+w-dw*n;   // wider digits, right-aligned in box
    for (let i=0;i<n;i++) ledDigit(sx+i*dw, y, dw-gap, h, str[i], on, off);
  }
  // ---- club nameplate (coloured edge tabs + auto-fit name) ----
  function nameplate(x,y,w,h,name,slug){
    const col=teamTextColor(slug);
    ctx.fillStyle="#05070f"; ctx.fillRect(x,y,w,h);
    ctx.fillStyle=col; ctx.fillRect(x,y,5,h); ctx.fillRect(x+w-5,y,5,h);
    ctx.strokeStyle="rgba(255,255,255,0.18)"; ctx.lineWidth=1; ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
    ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillStyle=col;
    let fs=16; ctx.font=ttFont(fs,"bold "); while (ctx.measureText(name).width>w-18 && fs>9){ fs--; ctx.font=ttFont(fs,"bold "); }
    ctx.fillText(name, x+w/2, y+h/2+1); ctx.textBaseline="alphabetic";
  }
  function drawHUD() {
    const P=teamHud.primary, S=teamHud.secondary;
    // ===== progress strip over the grass (translucent; ~10% more compact than before) =====
    const sx=70, sw=SW-140, sy=348, sh=48;

    // fixture as COLOURED TEAM-NAME text (each club its own colour, 'v' in white)
    const homeSlug = OPPONENT.home ? MYCLUB.slug : OPPONENT.slug, homeName = OPPONENT.home ? MYCLUB.name : OPPONENT.name;
    const awaySlug = OPPONENT.home ? OPPONENT.slug : MYCLUB.slug, awayName = OPPONENT.home ? OPPONENT.name : MYCLUB.name;

    const drawFrac=clamp((M.drawTarget||0)/(M.winTarget||1),0,1), perc=clamp(M.score/(M.winTarget||1),0,1);

    ctx.fillStyle=TTX.white; ctx.fillRect(Math.round(bx+usedW*drawFrac)-1, by-3, 2, bh+6);

    // ===== ARCADE SCOREBOARD — SEGA/NBA-Jam style: club nameplates · 7-seg LED readouts · centre advert =====
    const HL=-OX, HR=SW+OX, cxv=VW/2-OX;

    ctx.fillStyle="#26282d"; ctx.fillRect(HL+3,403,VW-6,3);             // subtle darker grey seam under the top edge
    ctx.textBaseline="alphabetic"; ctx.textAlign="center";
    // club nameplates — home (left) / away (right)

    nameplate(HR-218, 408, 196, 18, awayName, awaySlug);
    // LEFT — SCORE (green LED) with SCORE / BALLS labels beneath
    bevel(HL+22,430,196,52,"#0c0e11",true,3);
    drawLED(HL+28,435,184,42, String(M.score), TTX.green, "rgba(120,130,140,0.16)");
    ctx.font=ttFont(11);
    ctx.textAlign="left";  ctx.fillStyle="#7fe0a0"; ctx.fillText("SCORE", HL+26, 500);
    ctx.textAlign="right"; ctx.fillStyle=TTX.yellow; ctx.fillText("BALLS "+M.attempts, HL+214, 500);
    // RIGHT — TARGET (red LED) with TARGET / DRAW labels beneath
    bevel(HR-218,430,196,52,"#0c0e11",true,3);
    drawLED(HR-212,435,184,42, String(M.winTarget), TTX.red, "rgba(120,130,140,0.16)");
    ctx.font=ttFont(11);
    ctx.textAlign="left";  ctx.fillStyle="#cdd6e2"; ctx.fillText("DRAW "+M.drawTarget, HR-214, 500);
    ctx.textAlign="right"; ctx.fillStyle="#e89090"; ctx.fillText("TARGET", HR-26, 500);
    ctx.textAlign="center";
    // CENTRE — advert display (inset LED panel; reserved ad space)
    const adW=Math.min(356,VW*0.38), adX=cxv-adW/2;
    ctx.font=ttFont(12); ctx.fillStyle="#ff9a3d"; ctx.fillText("★ MATCH SPONSOR ★", cxv, 422);
    bevel(adX,428,adW,50,"#0c0e11",true,3);
    ctx.fillStyle="rgba(150,160,170,0.07)";                                                      // LED dot grid
    for (let yy=434;yy<476;yy+=5) for (let xx=adX+6;xx<adX+adW-4;xx+=5) ctx.fillRect(xx,yy,2,2);
    ctx.font=ttFont(16); ctx.fillStyle="#ffc23d"; ctx.fillText("ADVERTISE HERE", cxv, 456);
    ctx.font=ttFont(10); ctx.fillStyle="#7e8ea4"; ctx.fillText("YOUR MESSAGE IN LIGHTS", cxv, 471);
    ctx.font=ttFont(10); ctx.fillStyle="rgba(255,255,255,0.6)";                                   // controls hint + best
    ctx.fillText((TOUCH ? "SWIPE TO MOVE · LIFT TO SHOOT" : "◄ ► MOVE   SPACE = SHOOT")+"    BEST "+M.best, cxv, 502);
    ctx.textAlign="left";
    drawMuteButton(HR);
    drawPauseButton(HR);

    // ===== early checkout banner (top-left), once the WIN target is secured =====
    if (canCheckout()){
      const msg = TOUCH ? "✓ TARGET HIT - TAP HERE TO CHECK OUT" : "✓ TARGET HIT  -  ESC TO CHECK OUT";
      ctx.font=ttFont(15); ctx.textAlign="left";
      ctx.fillStyle="rgba(0,0,0,0.85)"; ctx.fillText(msg, -OX+15, 27);   // view top-left (not indented by OX)
      ctx.fillStyle=TTX.neon; ctx.fillText(msg, -OX+14, 26);
    }
  }
  // speaker / mute toggle, top-right of the view (drawn under translate(OX), tap zone handled in pointerdown)
  function drawMuteButton(HR){
    const bw=34,bh=28, bx=HR-bw-10, by=12, cx=bx+11, cy=by+bh/2;
    ctx.fillStyle="rgba(6,10,20,0.72)"; ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle="rgba(255,255,255,0.3)"; ctx.lineWidth=1; ctx.strokeRect(bx+0.5,by+0.5,bw-1,bh-1);
    ctx.fillStyle = muted ? "#9aa7b4" : TTX.neon;     // speaker body
    ctx.beginPath(); ctx.moveTo(cx-7,cy-3); ctx.lineTo(cx-3,cy-3); ctx.lineTo(cx+2,cy-8);
    ctx.lineTo(cx+2,cy+8); ctx.lineTo(cx-3,cy+3); ctx.lineTo(cx-7,cy+3); ctx.closePath(); ctx.fill();
    if (muted){ ctx.strokeStyle="#ff4d4d"; ctx.lineWidth=2.4; ctx.beginPath(); ctx.moveTo(cx+4,cy-7); ctx.lineTo(cx+15,cy+7); ctx.stroke(); }
    else { ctx.strokeStyle=TTX.neon; ctx.lineWidth=1.6; ctx.beginPath(); ctx.arc(cx+3,cy,6,-0.7,0.7); ctx.stroke();
           ctx.beginPath(); ctx.arc(cx+3,cy,10,-0.7,0.7); ctx.stroke(); }
    ctx.font=ttFont(8); ctx.fillStyle="rgba(255,255,255,0.55)"; ctx.textAlign="right";
    ctx.fillText("M", bx+bw-3, by+bh-2); ctx.textAlign="left";
  }
  function drawPauseButton(HR){
    if (!TOUCH) return;
    const bw=34,bh=28, bx=HR-bw-10-bw-8, by=12, cx=Math.round(bx+bw/2), cy=Math.round(by+bh/2);
    ctx.fillStyle="rgba(6,10,20,0.72)"; ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle="rgba(255,255,255,0.3)"; ctx.lineWidth=1; ctx.strokeRect(bx+0.5,by+0.5,bw-1,bh-1);
    ctx.fillStyle = paused ? TTX.yellow : "rgba(255,255,255,0.7)";
    ctx.fillRect(cx-7, cy-6, 5, 12);
    ctx.fillRect(cx+2,  cy-6, 5, 12);
    ctx.font=ttFont(8); ctx.fillStyle="rgba(255,255,255,0.55)"; ctx.textAlign="right";

  }
  function drawTouchBack(label){
    if(!TOUCH){ touchBackBtn=null; return; }
    const bw=90,bh=26,bx=8,by=SH-48;
    ctx.fillStyle="rgba(6,10,20,0.82)"; ctx.fillRect(bx,by,bw,bh);
    ctx.strokeStyle="rgba(255,255,255,0.35)"; ctx.lineWidth=1; ctx.strokeRect(bx+0.5,by+0.5,bw-1,bh-1);
    ctx.font=ttFont(11); ctx.fillStyle="rgba(255,255,255,0.75)"; ctx.textAlign="center";

  function canCheckout(){ return (state===ST.SERVE||state===ST.FLIGHT||state===ST.RESULT) && M.attempts>0 && M.score>=M.winTarget; }
  function checkoutEarly(){ paused=false; sfx.whistle(); endMatch(); }   // bank the win now, skip remaining balls

  // end-of-match result: the word RISES into place, PAUSES, then FALLS AWAY as a pixel cascade.
  // The word is sampled into a grid of square cells once (8-bit look); the same cells are used for
  // the solid hold and for the disintegration, so it reads as the exact word breaking apart.
  let _cascade=null;
  function _buildCascade(word){
    if (_cascade && _cascade.word===word) return _cascade;
    const fs = word.length>5 ? 86 : 116, cell=7;
    const tc=document.createElement("canvas"), tg=tc.getContext("2d");
    const setF=()=>{ tg.font="900 "+fs+"px 'Arial Black','Arial',sans-serif"; tg.textBaseline="middle"; tg.textAlign="center"; };
    setF(); const tw=Math.ceil(tg.measureText(word).width)+24, th=fs+24;
    tc.width=tw; tc.height=th; setF(); tg.fillStyle="#fff"; tg.fillText(word, tw/2, th/2);
    const d=tg.getImageData(0,0,tw,th).data, cells=[];
    for (let y=0;y<th;y+=cell) for (let x=0;x<tw;x+=cell){
      const sx=Math.min(tw-1,(x+cell/2)|0), sy=Math.min(th-1,(y+cell/2)|0);
      if (d[(sy*tw+sx)*4+3]>90) cells.push({ x:x-tw/2, y:y-th/2, delay:(x/tw)*0.32+Math.random()*0.16 });
    }
    return _cascade={ word, cells, cell, w:tw, h:th };
  }
  function drawMatchEndBurst() {
    ctx.fillStyle="rgba(4,6,10,0.66)"; ctx.fillRect(-OX,0,VW,SH);     // full-view dim (under translate OX)
    const cas=_buildCascade(matchEndText), elapsed=3.0-matchEndTimer;
    const RISE=0.42, HOLD=1.20, cx=SW/2, cy=SH/2-12, cl=cas.cell;
    ctx.save(); ctx.translate(cx,cy);
    if (elapsed < RISE+HOLD) {                                        // 1) rise up  2) pause (solid blocky word)
      const p=Math.min(1,elapsed/RISE), e=1-Math.pow(1-p,3), s=0.7+0.3*e;
      ctx.globalAlpha=e; ctx.translate(0,(1-e)*64); ctx.scale(s,s);
      ctx.fillStyle="#000";          for (const c of cas.cells) ctx.fillRect(Math.round(c.x)+2, Math.round(c.y)+2, cl, cl);
      ctx.fillStyle=matchEndColor;   for (const c of cas.cells) ctx.fillRect(Math.round(c.x),   Math.round(c.y),   cl, cl);
    } else {                                                         // 3) pixel cascade — cells fall + fade out
      const ct=elapsed-(RISE+HOLD);
      ctx.fillStyle=matchEndColor;
      for (const c of cas.cells){ const t=ct-c.delay;
        let fall=0, al=1;
        if (t>0){ fall=300*t*t; al=Math.max(0,1-t*1.5); }
        if (al<=0) continue;
        ctx.globalAlpha=al; ctx.fillRect(Math.round(c.x), Math.round(c.y+fall), cl, cl);
      }
    }
    ctx.globalAlpha=1; ctx.restore();
    ctx.textBaseline="alphabetic"; ctx.textAlign="left";
  }
  function drawResultText() {
    if (state===ST.RESULT && resultText) {
      ctx.textAlign="center";
      const isGoal = resultPoints>=4000 || resultText.indexOf("GOO")===0;
      if (isGoal){
        const tt=performance.now()/1000, pulse=1+0.16*Math.sin(tt*18);     // size throb
        const cols=[TTX.green,TTX.yellow,TTX.white,TTX.magenta], col=cols[Math.floor(tt*12)%cols.length];
        ctx.save(); ctx.translate(SW/2,150); ctx.scale(pulse,pulse);
        ctx.font=ttFont(44);
        ctx.fillStyle="rgba(0,0,0,0.9)"; ctx.fillText(resultText,4,5);      // hard shadow for legibility
        ctx.fillStyle=col; ctx.fillText(resultText,0,0); ctx.restore();
      } else {
        ctx.font=ttFont(34);
        ctx.fillStyle="rgba(0,0,0,0.9)"; ctx.fillText(resultText, SW/2+3, 153);
        ctx.fillStyle=resultColor; ctx.fillText(resultText, SW/2, 150);
      }
      if (resultPoints>0){
        ctx.font=ttFont(18);
        const pts = bounced>1 ? Math.round(resultPoints/2) : resultPoints;
        ctx.fillStyle="rgba(0,0,0,0.9)"; ctx.fillText("+"+pts, SW/2+2, 184);
        ctx.fillStyle=TTX.white; ctx.fillText("+"+pts, SW/2, 182);
      }
      ctx.textAlign="left";
    }
  }

  // ================= TELETEXT UI KIT (CEEFAX-style menus/tables) =================
  const TTX = { bg:"#06070b", white:"#ffffff", cyan:"#3df0ff", green:"#4dff7a", yellow:"#ffe23d",
                red:"#ff5252", blue:"#5b7bff", magenta:"#ff6ad5", grey:"#9aa7b4", dim:"#5d6b78", neon:"#39ff14" };
  const TT_SCALE=1.3;   // VT323 renders small per-em; gentle global scale (1.5 was too chunky/overlapping)
  function ttFont(px, w){ return (w||"")+Math.round(px*TT_SCALE)+"px 'VT323','Courier New','Lucida Console',monospace"; }
  function pxFont(px){ return px+"px 'Press Start 2P','Courier New',monospace"; }   // chunky 8-bit (countdown, big headings)
  // nudge the canvas to use the web fonts as soon as they load (rAF redraws, so text just pops in)
  if (document.fonts && document.fonts.load){ document.fonts.load("32px VT323"); document.fonts.load("32px 'Press Start 2P'"); }

  // Clean crisp text helper (anti-aliased, sharp now that the backing store matches the display — the
  // earlier 1-bit threshold eroded VT323's thin strokes and looked broken). ha:'l'|'c'|'r' va:'t'|'m'|'b'.
  function pxText(text, x, y, sizePx, color, ha, va){
    ctx.font=ttFont(sizePx); ctx.fillStyle=color;
    ctx.textAlign = ha==='c'?'center':(ha==='r'?'right':'left');
    ctx.textBaseline = va==='m'?'middle':(va==='b'?'bottom':(va==='t'?'top':'alphabetic'));
    ctx.fillText(String(text), x, y);
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
  function ttClear(){ ctx.fillStyle=TTX.bg; ctx.fillRect(0,0,VW,SH);   // full landscape width
    // faint scanlines for the retro CRT feel
    ctx.fillStyle="rgba(0,0,0,0.16)"; for (let y=0;y<SH;y+=3) ctx.fillRect(0,y,VW,1); }

  // ---- line-by-line "printing" reveal (resets whenever the screen/state changes) ----
  let stateEnterAt=performance.now(), _prevDrawState=null;
  function screenAge(){ return (performance.now()-stateEnterAt)/1000; }
  const TT_LINE=0.06, TT_CPS=140;          // delay between lines + chars/sec within a line
  function ttSub(text, lineIdx){           // visible substring of `text` for its print order
    const age=screenAge()-(lineIdx||0)*TT_LINE;
    if (age<=0) return null;               // not started printing yet
    const n=Math.floor(age*TT_CPS);
    return n>=text.length ? text : text.slice(0,n);
  }
  function ttCursorOn(){ return (Math.floor(performance.now()/260)%2)===0; }
  function ttDone(lines){ return screenAge() > (lines||0)*TT_LINE + 0.25; }   // has the whole reveal finished?
  // print one monospace line; left-aligned at x (or centred on its FULL width so layout is stable).
  // returns true once the whole line has printed.
  function ttPrint(text, x, y, color, lineIdx, opts){
    opts=opts||{}; ctx.font=ttFont(opts.size||13, opts.weight);
    const sub=ttSub(text, lineIdx); if (sub===null) return false;
    let gx=x;
    if (opts.center){ ctx.textAlign="left"; gx=VW/2 - ctx.measureText(text).width/2; }
    else ctx.textAlign="left";
    ctx.fillStyle=color;
    const full=sub.length>=text.length;
    ctx.fillText(sub, gx, y);
    if (!full && ttCursorOn()){ const cw=ctx.measureText("M").width; ctx.fillRect(gx+ctx.measureText(sub).width+1, y-Math.round((opts.size||13)*0.78), cw*0.7, (opts.size||13)*0.9); }
    return full;
  }

  // ---- SCORDAGOL brand logo: LARDILAND-style chunky ITALIC pixel-art ----
  // Built at low resolution (coarse pixels), snapped to hard 1-bit edges (no anti-alias fringe),
  // skewed for italic, given a solid 3D extrude, then upscaled nearest-neighbour = crisp square pixels.
  const logoC=document.createElement("canvas"), logoG=logoC.getContext("2d");   // composed 3D logo
  const lMask=document.createElement("canvas"), lMaskG=lMask.getContext("2d");  // 1-bit silhouette
  const lTint=document.createElement("canvas"), lTintG=lTint.getContext("2d");  // tinted stamp scratch
  function _logoTint(color){           // tint the silhouette (lMask) to `color`, returns lTint
    lTint.width=lMask.width; lTint.height=lMask.height; lTintG.clearRect(0,0,lTint.width,lTint.height);
    lTintG.globalCompositeOperation="source-over"; lTintG.drawImage(lMask,0,0);
    lTintG.globalCompositeOperation="source-in"; lTintG.fillStyle=color; lTintG.fillRect(0,0,lTint.width,lTint.height);
    lTintG.globalCompositeOperation="source-over"; return lTint;
  }
  // ---- crisp 8-bit football: a cached pixel bitmap (no anti-alias), blitted square-by-square ----
  // grid values 0=transparent · 1=white · 2=black. Built once per grid size: a circle silhouette,
  // a hard black rim, a central black pentagon and five black edge patches — the classic pixel ball.
  const _ballBmp={};
  function _ballBitmap(N){
    if (_ballBmp[N]) return _ballBmp[N];
    const c=(N-1)/2, R=N/2-0.5, TURN=2*Math.PI/5, A0=-Math.PI/2;
    const inside=(x,y)=> (x-c)*(x-c)+(y-c)*(y-c) <= R*R;
    const poly=(px,py,pr,rot)=>{ const p=[]; for(let i=0;i<5;i++){const a=rot+i*TURN; p.push([px+Math.cos(a)*pr, py+Math.sin(a)*pr]);} return p; };
    const inP=(x,y,p)=>{ let w=false; for(let i=0,j=p.length-1;i<p.length;j=i++){ const a=p[i],b=p[j];
      if(((a[1]>y)!==(b[1]>y)) && (x < (b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])) w=!w; } return w; };
    const centre=poly(c,c,R*0.40,A0), edges=[];
    for(let i=0;i<5;i++){ const a=A0+i*TURN; edges.push(poly(c+Math.cos(a)*R*0.70, c+Math.sin(a)*R*0.70, R*0.30, a+Math.PI)); }
    const grid=[];
    for(let y=0;y<N;y++){ const row=[]; for(let x=0;x<N;x++){
      if(!inside(x,y)){ row.push(0); continue; }
      const rim = !inside(x-1,y)||!inside(x+1,y)||!inside(x,y-1)||!inside(x,y+1);
      let black = rim || inP(x+0.5,y+0.5,centre);
      if(!black) for(const e of edges){ if(inP(x+0.5,y+0.5,e)){ black=true; break; } }
      row.push(black?2:1);
    } grid.push(row); }
    return _ballBmp[N]=grid;
  }
  function _ball8(g, cx, cy, r){
    const N=15, bmp=_ballBitmap(N), x0=cx-r, y0=cy-r, sp=(2*r)/N;
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const v=bmp[y][x]; if(!v) continue;
      const px=Math.round(x0+x*sp), py=Math.round(y0+y*sp);
      const pw=Math.round(x0+(x+1)*sp)-px, ph=Math.round(y0+(y+1)*sp)-py;
      g.fillStyle = v===2 ? "#0b0b0b" : "#f4f4f4"; g.fillRect(px,py,pw,ph);
    }
  }
  // The composed low-res logo is STATIC, so build it once per (size,depth,colour) and cache it —
  // rebuilding the silhouette + threshold + footballs every frame was needlessly expensive.
  const _logoCache={};
  function _buildLogo(F, depth, face, shadow){
    const key=F+"|"+depth+"|"+face+"|"+shadow;
    if (_logoCache[key]) return _logoCache[key];
    const txt="SCORDAGOL", SKEW=0.22, pad=2, slant=Math.ceil(F*SKEW);
    lMaskG.font="900 "+F+"px 'Arial Black','Arial',sans-serif";
    const tw=Math.ceil(lMaskG.measureText(txt).width);
    const W=tw+slant+pad*2+depth, H=F+pad*2+depth+3;
    lMask.width=W; lMask.height=H;
    // 1-bit ITALIC silhouette, char-by-char, leaving the O's EMPTY (footballs replace them)
    lMaskG.setTransform(1,0,-SKEW,1,0,0);
    lMaskG.font="900 "+F+"px 'Arial Black','Arial',sans-serif"; lMaskG.textBaseline="top"; lMaskG.textAlign="left"; lMaskG.fillStyle="#fff";
    let penX=pad+slant; const oC=[];
    for (const ch of txt){ const cw=lMaskG.measureText(ch).width;
      if (ch==="O") oC.push({x:penX+cw/2, y:pad+F*0.52, r:F*0.47}); else lMaskG.fillText(ch, penX, pad);
      penX+=cw; }
    lMaskG.setTransform(1,0,0,1,0,0);
    const id=lMaskG.getImageData(0,0,W,H), d=id.data;
    for (let i=3;i<d.length;i+=4) d[i] = d[i]>100 ? 255 : 0;   // crisp hard edges (letters only)
    lMaskG.putImageData(id,0,0);
    const c=document.createElement("canvas"); c.width=W; c.height=H; const cg=c.getContext("2d");
    for (let s=depth;s>=1;s--) cg.drawImage(_logoTint(shadow), s, s);   // 3D extrude
    cg.drawImage(_logoTint(face), 0, 0);                                // bright face
    for (const o of oC){ const bx=o.x-SKEW*o.y, by=o.y;                 // footballs in the O slots
      cg.fillStyle=shadow; cg.beginPath(); cg.arc(bx+depth,by+depth,o.r,0,2*Math.PI); cg.fill();
      _ball8(cg, bx, by, o.r); }
    return (_logoCache[key]={c:c, W:W, H:H});
  }
  function drawLogo(cx, baseY, maxW, opts){
    opts=opts||{};
    const L=_buildLogo(opts.F||18, (opts.depth!=null?opts.depth:2), opts.face||"#34ff6e", opts.shadow||"#06371a");
    const scale=Math.min(maxW/L.W, (opts.maxH||150)/L.H);
    const dw=Math.round(L.W*scale), dh=Math.round(L.H*scale);
    const dx=Math.round(cx-dw/2), dy=(opts.cy!=null)?Math.round(opts.cy-dh/2):Math.round(baseY-dh);
    if (opts.whiteBg){ const p=opts.pad!=null?opts.pad:6; ctx.fillStyle="#ffffff"; ctx.fillRect(dx-p,dy-p,dw+p*2,dh+p*2); }
    const prev=ctx.imageSmoothingEnabled; ctx.imageSmoothingEnabled=false;   // nearest-neighbour = hard pixels
    ctx.drawImage(L.c, dx, dy, dw, dh);
    ctx.imageSmoothingEnabled=prev;
  }

      let line="";
      for (const w of para.split(" ")){ const test=line?line+" "+w:w;
        if (ctx.measureText(test).width>maxW && line){ out.push(line); line=w; } else line=test; }
      if (line) out.push(line);
    }
    return out;
  }

  // ================= DAILY CHALLENGE (seeded match + local leaderboard) =================
  function dailyKey(){ const d=new Date(); return ""+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0"); }
  function dailySeed(){ return parseInt(dailyKey(),10)>>>0; }

  let dailyLastScore=0, dailyMatchup="";
  function startDaily(){
    GMODE="daily"; CAR=null;
    const seed=dailySeed(), pr=mulberry32(seed);          // same club + opponent for everyone, today
    const myi=Math.floor(pr()*TEAMS.length); let oi; do{ oi=Math.floor(pr()*TEAMS.length); }while(oi===myi);
    const mt=TEAMS[myi], ot=TEAMS[oi];
    MYCLUB={ slug:mt.slug, name:mt.name, rating:mt.rating };
    OPPONENT={ slug:ot.slug, name:ot.name, rating:ot.rating, home:(Math.floor(pr()*2)===0) };
    dailyMatchup = OPPONENT.home ? (MYCLUB.name+" v "+OPPONENT.name) : (OPPONENT.name+" v "+MYCLUB.name);
    loadKits(MYCLUB.slug, OPPONENT.slug, ()=>startMatch({seed:seed, balls:10}));
  }

    const today=dailyKey(); let bd=loadDaily(); if(!bd || bd.date!==today) bd={date:today, scores:[]};
    const nm=(localStorage.getItem("vc_name")||"YOU").slice(0,12);
    bd.scores.push({name:nm, score:M.score}); bd.scores.sort((a,b)=>b.score-a.score); bd.scores=bd.scores.slice(0,12);
    localStorage.setItem("vc_daily", JSON.stringify(bd));
    dailyLastScore=M.score; state=ST.DAILYBOARD;
  }

  // ================= 2-PLAYER HORSE (turn-based beat-my-score) =================
  // Word length = number of rounds. Each round both players play the SAME seeded serves;
  // higher score claims that letter. Most letters at the end wins.
  let H=null, hSetup=["","","HORSE"], hField=0;
  const COL_A="#5bd0ff", COL_B="#ff8a5b";              // player colours
  function beginHorse(){
    const word=(hSetup[2].trim().toUpperCase().replace(/[^A-Z]/g,"")).slice(0,8) || "HORSE";
    H={ p:[hSetup[0].trim()||"PLAYER 1", hSetup[1].trim()||"PLAYER 2"], word:word, L:word.length,
        round:0, turn:0, owner:[], scores:[null,null], seedBase:(Date.now()>>>0) };
    state=ST.HORSEPASS;
  }
  function startHorseTurn(){
    GMODE="horse"; CAR=null;
    const lp=TEAMBY["Liverpool"]||TEAMS[0];
    MYCLUB={ slug:lp.slug, name:lp.name, rating:lp.rating };       // both players use the same club (fair)
    const seed=(H.seedBase + H.round*7919)>>>0, pr=mulberry32(seed);
    const ot=TEAMS[Math.floor(pr()*TEAMS.length)];
    OPPONENT={ slug:ot.slug, name:ot.name, rating:ot.rating, home:true };
    H.roundSeed=seed;
    loadKits(MYCLUB.slug, OPPONENT.slug, ()=>startMatch({seed:seed, balls:HORSE_BALLS}));
  }
  function horseTurnDone(){
    H.scores[H.turn]=M.score;
    if (H.turn===0){ H.turn=1; state=ST.HORSEPASS; }              // pass device to player 2, same round
    else {
      const a=H.scores[0], b=H.scores[1];
      H.owner[H.round] = a<b ? "A" : (b<a ? "B" : "T");           // round LOSER gets the letter (spell the word = you lose)
      H.round++; H.turn=0; H.scores=[null,null];
      state = (H.round>=H.L) ? ST.HORSEEND : ST.HORSEPASS;
    }
  }
  function horseTally(){ let a=0,b=0; for(const o of H.owner){ if(o==="A")a++; else if(o==="B")b++; } return [a,b]; }

      const i=clubHit(p.x,p.y); if(i>=0) menuSel=i;   // tap club = highlight only; tap CONFIRM button above to proceed
    }
    else if(state===ST.HORSESETUP){ const f=horseFieldHit(p); if(f>=0){ hField=f; kbdOpen(hSetup[hField]); } else kbdOpen(hSetup[hField]); }
    else if(inPlay(state)||state===ST.RESULT){
      if(canCheckout() && p.y<42 && p.x<360){ checkoutEarly(); return; }   // tap the banner (view top-left) to bank the win
      dragging=true;
      try{ canvas.setPointerCapture(e.pointerId); }catch(_){}   // keep pointermove firing even off-canvas
      dragStartFieldX = p.x-OX;   // anchor for relative drag (raw screen field x)
      dragManStartX = manX;        // physical player x; leftFooted delta sign handled in pointermove
      mouseTargetX = manX;         // hold position until finger moves
      if(state===ST.RESULT) resultTimer=0;   // touch during result: skip straight to next serve
    }
    else if(state===ST.TABLE){
      if(clinchBtn && p.x>=clinchBtn.x && p.x<=clinchBtn.x+clinchBtn.w && p.y>=clinchBtn.y && p.y<=clinchBtn.y+clinchBtn.h) endSeasonEarly();
      else pressSelect();
    }
    else if(state===ST.INBOX){ for(const r of inboxRects){ if(p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h){ inboxSel=r.i; pressSelect(); break; } } }
    else if(state===ST.EMAIL){ for(const b of emailBtns){ if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){ emailAction(b.k); break; } } }
    else { pressSelect(); }   // NAME / boards advance on tap
  },{passive:false});
  canvas.addEventListener("pointerup",(e)=>{
    e.preventDefault();
    if(dragging){
      dragging=false; dragStartFieldX=null; dragManStartX=null;
      if(state===ST.SERVE && !kicked && !paused) triggerKick();
    }
    else if(TOUCH && state===ST.NAME){ kbdOpen(nameBuf); }  // touchend: re-focus hidden input so iOS keyboard appears
  },{passive:false});
  canvas.addEventListener("pointercancel",()=>{ dragging=false; dragStartFieldX=null; dragManStartX=null; });

  // ---- fixed-timestep loop at 28 Hz ----
  let last=performance.now(), acc=0;
  function tick(now){
    let frame=(now-last)/1000; last=now; if(frame>0.25) frame=0.25; acc+=frame;
    flash=Math.max(0,flash-frame*1.6);
    while(acc>=DT){ if(assetsReady) swfFrame(); acc-=DT; }
    render();
  }
  const CAP = /[?&]cap=1/.test(location.search);
  function loop(now){ if(!CAP) tick(now); requestAnimationFrame(loop); }   // in cap mode the interval drives ticks
  requestAnimationFrame(loop);
  // Dev/verification aid: rAF is throttled while the tab is backgrounded/offscreen. With ?cap=1
  // drive the sim+render from a fixed interval (sole driver) so frames advance headlessly,
  // and expose handles so a connecting shot / a screen can be scripted for verification.
  if (CAP) {
    setInterval(function(){ tick(performance.now()); }, DT*1000);
    window.__dbg = {
      tick: function(){ tick(performance.now()); },
      setScore: function(s){ M.score=s; return M.score; },   // dev: force score (e.g. to test early checkout)
      // dev: freeze a keeper dive frame for screenshots (no pause overlay)
      holdDive: function(side, frame){
        dive=true; no_dive=false; divedirn=side||"right";
        keeperPose.anim = (side==="left")?"dive_left":"dive_right";
        keeperPose.frame = frame!=null ? frame : (side==="left"?72:122); keeperPose.x=KEEPER_START_X;
        booted=true; resultTimer=99999; resultText=""; state=ST.RESULT;
        return { anim:keeperPose.anim, frame:keeperPose.frame };
      },
      // dev: jump straight to a finished season (transfer inbox) with a random final table
      fakeSeasonEnd: function(myPos){
        GMODE="career";
        CAR={ name:"KOPP", slug:TEAMS[0].slug, season:1, idx:38, fixtures:makeFixtures(TEAMS[0].slug),
              table:freshTable(), news:["{c} crowned!"], titles:0, form:["W","W","D","L","W"], titleOdds:50, offers:null, lastResults:null };
        for (const t of TEAMS){ const r=CAR.table[t.slug]; r.p=38; r.w=5+rnd(22); r.d=rnd(38-r.w); r.l=38-r.w-r.d; r.pts=r.w*3+r.d; r.gd=r.w*2-r.l*2+rnd(10)-5; }
        if (myPos===1){ const r=CAR.table[CAR.slug]; r.w=34; r.d=3; r.l=1; r.pts=105; r.gd=80; }   // force a title
        enterSeasonEnd(); return {state, offers:(CAR.offers||[]).map(o=>o.name), pos:myPosition()};
      },
      // dev: mid-season table where the title is already mathematically won
      clinchTitle: function(){
        GMODE="career";
        CAR={ name:"KOPP", slug:TEAMS[0].slug, season:1, idx:34, fixtures:makeFixtures(TEAMS[0].slug),
              table:freshTable(), news:["Champions elect"], titles:0, form:["W","W","W","W","W"], titleOdds:100, offers:null, lastResults:[] };
        for (const t of TEAMS){ const r=CAR.table[t.slug]; r.p=34; r.w=2+rnd(15); r.d=rnd(10); r.l=34-r.w-r.d; r.pts=r.w*3+r.d; r.gd=r.w-r.l; }
        const me=CAR.table[CAR.slug]; me.p=34; me.w=33; me.d=1; me.l=0; me.pts=100; me.gd=90;
        CAR.lastResults=genGameweekResults("W",{home:true,opp:TEAMS[1].slug});
        state=ST.TABLE; return {state, clinched:titleClinched()};
      },
      kick: triggerKick,
      setMan: function(x){ manX = x; },
      pause: togglePause,
      step: function(n){ for(var i=0;i<(n||1);i++) swfFrame(); return {state,xball:Math.round(xball),yball:Math.round(yball),z:Math.round(z),booted,kicked,manFinished,dbx:Math.round(dbx),dive,no_dive,divedirn,hk:hitkeeper}; },
      forceShot: function(x0,dbxv,zv,keepDef){   // deterministic flight for testing resolution
        countdownT=0; setTargets(); booted=true; innet=false; bounced=1;
        xball=x0; yball=250; z=zv; dbx=dbxv; dby=zv; ybit=YBIT; checked=false;
        dive=false; no_dive=true; divedirn="up"; destination=0; end=0; sc=0;
        kicked=true; cchecked=true; manFinished=true; held=false;
        hitkeeper=0; hitbar=false; lposthit=false; rposthit=false; leftcorner=0; rightcorner=0; topnet=0;
        keeperPose={x:KEEPER_START_X,dir:"up",anim:"idle",frame:1};
        if(!keepDef) defenders.forEach(d=>d.chk=true); window.__rs=null; window.__df=[]; state=ST.FLIGHT;
      },
      vars: function(){ return { state, paused, xball:Math.round(xball), yball:Math.round(yball), z:Math.round(z),
        booted, dive, no_dive, divedirn, kAnim:keeperPose.anim, kFrame:keeperPose.frame, kx:Math.round(keeperPose.x),
        manX:Math.round(manX), mouseTargetX:(mouseTargetX==null?null:Math.round(mouseTargetX)),
        leftFooted, matchEndText, score:M.score }; },
      forcePause: function(){ paused=!paused; return paused; },
      setLeft: function(b){ leftFooted=!!b; return leftFooted; },
      // Measure the keeper sprite's exact pixel bbox as savedCheck() sees it (logical coords).
      keeperExtent: function(frameNum, kx){
        keeperPose.frame=frameNum; if(kx!=null) keeperPose.x=kx;
        offCtx.setTransform(1,0,0,1,0,0); offCtx.clearRect(0,0,SW,420); drawKeeperTo(offCtx);
        const d=offCtx.getImageData(0,0,SW,420).data;
        let minx=9999,maxx=-1,miny=9999,maxy=-1;
        for(let y=0;y<420;y++)for(let x=0;x<SW;x++){ if(d[(y*SW+x)*4+3]>16){ if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y; } }
        return {frame:frameNum, kx:Math.round(keeperPose.x), minx,maxx,miny,maxy};
      },
      // Deterministic serve (fixed velocity/angle), real contact path, no menu needed.
      serve: function(vel,ang){
        setTargets();
        velocity=(vel||20); angle=(ang||37); cangle=Math.cos(angle*DEG); sangle=Math.sin(angle*DEG);
        t=0; bounce=0; bounced=1; booted=false; innet=false; ay=0;
        xball=0; yball=SERVE_Y; z=0; dbx=0; dby=0; ybit=YBIT; yscale=93;
        checked=false; dive=false; no_dive=true; divedirn="up"; destination=0; keeperX=KEEPER_START_X;
        kicked=false; cchecked=false; kickTick=0; manFinished=false; complete_miss=false; end=0; sc=0;
        hitkeeper=0; held=false; hitbar=false; lposthit=false; rposthit=false;
        leftcorner=0; rightcorner=0; topnet=0; znet=0; manKicking=false; manKickT=0;
        keeperPose={ x:KEEPER_START_X, dir:"up", anim:"idle", frame:1 };
        defenders=[
          { ox:117.95, oy:210.25, sx:1.0000, sy:1.0000, thr:240, mag:10, sign:-1, chk:false },
          { ox: 27.60, oy:163.35, sx:0.8982, sy:0.8960, thr:200, mag:20, sign:-1, chk:false },
          { ox:471.15, oy:157.75, sx:0.8234, sy:0.8264, thr:200, mag:10, sign:+1, chk:false } ];
        M.score=0; M.attempts=10; manX=MAN_START_X; mouseTargetX=null; window.__rs=null; clearResult(); state=ST.SERVE;
      },
      // Run ONE real shot: serve, position man, trigger kick at tick `kt`, step to result. Returns the outcome.
      realShot: function(manXpos, kt, vel, ang, noDef){
        this.serve(vel,ang); manX=manXpos;
        if (noDef) defenders.forEach(d=>d.chk=true);
        let contactX=null, contactDbx=null, contactZ=null;
        for (let i=0;i<260;i++){
          if (i===kt) triggerKick();
          const wasBooted=booted; swfFrame();
          if (!wasBooted && booted){ contactX=Math.round(xball); contactDbx=Math.round(dbx); contactZ=Math.round(z); }
          if (state===ST.RESULT || state===ST.OVER) break;
        }
        const rs = window.__rs||{};
        return { kt, connected:!!contactX, contactX, contactDbx, contactZ,
                 finalx:rs.finalx, zres:rs.z, hk:rs.hk, innet:rs.innet, rp:rs.rp, lp:rs.lp, bar:rs.bar,
                 result:resultText, scored:M.score };
      },
      // Sweep all kick timings for a manX; report only CONNECTED shots, tagging wide/over verdicts.
      sweep: function(manXpos, vel, ang, noDef){
        const out=[];
        for (let kt=0; kt<46; kt++){
          const r=this.realShot(manXpos, kt, vel, ang, noDef);
          if (!r.connected) continue;
          const fx=r.finalx, zz=r.zres;
          const wide = (fx!=null) && (fx>RPOST+POSTTOL || fx<LPOST-POSTTOL);
          const over = (zz!=null) && (zz>BARH);
          out.push({kt, cX:r.contactX, cDbx:r.contactDbx, fx, z:zz, hk:r.hk, net:r.innet?1:0,
                    wide:wide?1:0, over:over?1:0, res:r.result, sc:r.scored});
        }
        return out;
      }
    };
  }
})();
</script>
