<!-- Retro fonts: VT323 = teletext/CRT body text · Press Start 2P = chunky 8-bit (countdown, headings).
     Falls back to monospace offline; self-host these for the production/app build. -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%; background: #04060a; overflow: hidden;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    color: #fff; -webkit-user-select: none; user-select: none;
    touch-action: none; -webkit-touch-callout: none; overscroll-behavior: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { background: #04060a; image-rendering: auto; max-width: 100%; max-height: 100%;
           box-shadow: 0 0 50px rgba(0,0,0,0.85); touch-action: none; }
  /* off-screen field used to summon the iOS keyboard for name / word entry */
  #kbd { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0;
         border: 0; padding: 0; font-size: 16px; background: transparent; color: transparent; }

<body>
<div id="wrap"><canvas id="game" width="1100" height="1040"></canvas></div>
<input id="kbd" type="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" />

<script>
"use strict";
(function () {
  // ---- Logical stage ----
  // SW/SH = the FIELD (gameplay) coordinate space — physics, sprites and every draw* live here,
  // UNCHANGED from the original SWF. VW = the landscape VIEW the field is centred inside (16:9).
  const SW = 550, SH = 520;          // field stage (physics-exact; do not change)
  let SCALE = 2;                     // backing-store supersample (recomputed in fit() to match the display = crisp text)
  const VW = 924;                    // landscape view width (16:9 of SH=520) — widescreen monitors + phones
  const OX = Math.round((VW - SW) / 2);   // x-offset that centres the 550-wide field within the 924 view
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  canvas.width = VW * SCALE; canvas.height = SH * SCALE;   // backing store (single source of truth = VW)

  function fit() {
    const r = Math.min(window.innerWidth / VW, window.innerHeight / SH);
    const cssW = Math.floor(VW * r), cssH = Math.floor(SH * r);
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    // size the backing store to the ACTUAL on-screen pixels so the canvas is never up-scaled (= crisp text, no blur)
    const dpr = window.devicePixelRatio || 1, want = Math.max(2, Math.min(4, (cssW * dpr) / VW));
    if (Math.abs(want - SCALE) > 0.01){ SCALE = want; canvas.width = Math.round(VW*SCALE); canvas.height = Math.round(SH*SCALE); }
  }
  window.addEventListener("resize", fit); fit();
  function toggleFullscreen(){
    try { if (!document.fullscreenElement){ const el=document.documentElement; (el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el); }
          else { (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document); } } catch(e){}
  }
  document.addEventListener("fullscreenchange", ()=>setTimeout(fit,60));

  // Your club + current opponent (both per-team recoloured; defaults used for Quick Play).
  let MYCLUB   = { slug:"Liverpool", name:"Liverpool", rating:8 };
  let OPPONENT = { slug:"AstonVilla", name:"Aston Villa", rating:9, home:false };

  // ---- Static assets (kits are loaded dynamically per club, see loadKits) ----
  const IMG = {};
  const sources = { backdrop:"assets/stadium/backdrop.png?v=2",
                    logo:"assets/ui/logo.png?v=2",
                    trophyL:"assets/ui/trophy_league.png?v=1", trophyC:"assets/ui/trophy_cup.png?v=1",
                    trophyE:"assets/ui/trophy_euro.png?v=1",   trophyI:"assets/ui/trophy_intl.png?v=1",
                    katlas:"assets/sprites/keeper_atlas.png?v=m14",
                    ball:"assets/sprites/ball_sheet.png?v=m2", shadow:"assets/sprites/shadow.png?v=s1",
                    strikersheet:"assets/sprites/striker_sheet.png?v=m16",
                    defbase:"assets/sprites/defender_sheet.png?v=m13" };
  let loaded = 0, total = Object.keys(sources).length, assetsReady = false;
  for (const k in sources) {
    const im = new Image();
    im.onload = () => { if (++loaded === total) assetsReady = true; };
    im.onerror = () => { if (++loaded === total) assetsReady = true; };
    im.src = sources[k]; IMG[k] = im;
  }
  let kitsReady = false;
  const _hexRGB = h => { const n=parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; };
  // ================= UNIVERSAL KIT RENDERER (docs/SPRITE_SPEC.md) =================
  // The sprite bases are REGION-TAGGED: pure hues mark recolourable areas, pixel
  // brightness carries the shading. One base set renders ANY kit live:
  //   red=shirt  green=shorts  blue=socks  yellow=sleeves  magenta=hair
  // Patterns (stripes/hoops/halves/quarters/sash) are computed inside the shirt bbox.
  const SPRITES = { striker:[], defender:null, keeper:null };   // per-match recoloured canvases
  // SKIN-AS-REGION sprite format (artgen/render_sprites.py encode must match): ALPHA tags the pixel
  // -> 255 = kit region, 254 = detail (skin/boot/hair/glove, real RGB left as-is), 0 = transparent.
  // Because skin is identified by alpha (not by a cramped RGB range), kit pixels carry FULL-RANGE
  // u/v -> razor stripes. Kit pixel: R=shade, G=u (0-255), B=(regionId<<5)|v5  (v = low 5 bits).
  const KREGION = { 1:"shirt", 2:"shorts", 3:"socks", 4:"sleeve", 5:"collar", 6:"cuff", 7:"sock_top" };
  // patterns evaluated in PER-PART UV space (baked into the base sprite channels):
  // stripes run parallel to the part and mirror symmetrically from its centre line.
  function patVal(p,u,v,n){
    n = n||7;
    if (p==="stripes") return Math.floor(Math.min(0.999,u)*n)%2;
    if (p==="hoops")   return Math.floor(Math.min(0.999,v)*9)%2;
    if (p==="halves")  return u>0.5?1:0;
    if (p==="quarters")return ((u>0.5)?1:0)^((v>0.5)?1:0);
    if (p==="sash")    return Math.abs(u+v-1)<0.18?1:0;
    return 0;
  }
  const SLEEVE_STRIPE_N = 20;  // sleeve stripe count. The visible arm spans only a NARROW band of the cylindrical Kit_UV, so it needs ~3-4x the torso count for the on-screen stripe WIDTH to match (owner iterated 5->10->20; 20 matches the torso at true game size).
  // Anti-aliased stripe colour: blend c1<->c2 with a SOFT but TIGHT transition at each boundary.
  // The skin-as-region rework freed the baked u to FULL 256 levels (was ~88), so stripe edges are
  // now razor at source; aa=0.06 is a thin softening that the in-game ~3x downscale finishes off.
  function stripeMix(u, n, c1, c2){
    const x=Math.min(0.999,Math.max(0,u))*n, fl=Math.floor(x), fr=x-fl, band=fl&1;
    const d=Math.min(fr,1-fr), aa=0.06;       // distance to nearest stripe edge (tighter = crisper; full-precision u now)
    let t = band;
    if (d<aa){ const k=(aa-d)/aa*0.5; t = band ? 1-k : k; }   // soften toward the neighbour near the edge
    return [c1[0]+(c2[0]-c1[0])*t, c1[1]+(c2[1]-c1[1])*t, c1[2]+(c2[2]-c1[2])*t];
  }
  function kitCols(kit){ const g=n=>PAL[n]||n||"#cccccc";
    return { c1:_hexRGB(g(kit.c1)), c2:_hexRGB(g(kit.c2||kit.c1)), sleeves:_hexRGB(g(kit.sleeves||kit.c1)),
             shorts:_hexRGB(g(kit.shorts||"white")), socks:_hexRGB(g(kit.socks||kit.c1)),
             collar:_hexRGB(g(kit.collar||kit.c1)), cuff:_hexRGB(g(kit.cuff||kit.c1)),
             sockTop:_hexRGB(g(kit.sockTop||kit.socks||kit.c1)) };   // new regions default sensibly
  }
  function buildKit(im, kit, hairRGB, skinMul){
    skinMul = skinMul || 1;
    const c=document.createElement("canvas"); c.width=im.naturalWidth; c.height=im.naturalHeight;
    const g=c.getContext("2d",{willReadFrequently:true}); g.drawImage(im,0,0);
    const id=g.getImageData(0,0,c.width,c.height), d=id.data, K=kitCols(kit);
    const sN = kit.stripeN||7, slN = kit.sleeveN||SLEEVE_STRIPE_N;   // sleeve count (cylindrical Kit_UV -> independent of torso)
    for (let i=0;i<d.length;i+=4){
      const a=d[i+3];
      if (a<8) continue;
      if (a<255){
        // DETAIL (skin/boots/hair/glove): real pixels. Lighten warm SKIN per-sprite (boots/hair dark/cool -> left alone)
        const r=d[i],gg=d[i+1],b=d[i+2];
        if (skinMul!==1 && r>90 && r>=gg && gg>=b-6 && (r-b)>10){
          d[i]=Math.min(255,r*skinMul); d[i+1]=Math.min(255,gg*skinMul); d[i+2]=Math.min(255,b*skinMul);
        }
        continue;
      }
      // KIT pixel: R=shade, G=u (0-255), B=(regionId<<5)|v5
      const shade=d[i], u=d[i+1]/255, bb=d[i+2], region=bb>>5, v=(bb&31)/31;
      let col;
      if (region===1){ col = (kit.p==="stripes") ? stripeMix(u, sN, K.c1, K.c2) : (patVal(kit.p, u, v, sN) ? K.c2 : K.c1); }
      else if (region===2){ col=K.shorts; }
      else if (region===3){ col=K.socks; }
      else if (region===4){ col = (kit.sleeveP==="stripes") ? stripeMix(u, slN, K.sleeves, K.c2) : ((kit.sleeveP && patVal(kit.sleeveP, u, v, slN)) ? K.c2 : K.sleeves); }
      else if (region===5){ col=K.collar; }
      else if (region===6){ col=K.cuff; }
      else if (region===7){ col=K.sockTop; }
      else continue;
      const f=shade/255*1.04;                       // cel bands survive any kit colour
      d[i]=Math.min(255,col[0]*f); d[i+1]=Math.min(255,col[1]*f); d[i+2]=Math.min(255,col[2]*f);
    }
    g.putImageData(id,0,0); return c;
  }
  // kit selection: home side wears home; the visitor switches to away on a colour clash
  function kitFor(slug, away){
    const t=TEAMBY[slug]||{};
    const ks=t.kits||{ h:{ p:(t.pattern==="stripes"?"stripes":"solid"), c1:t.shirt||"grey", c2:t.stripe2,
                           sleeves:(t.sleeves&&t.sleeves!==t.shirt)?t.sleeves:null,
                           shorts:t.shorts||"white", socks:t.socks||t.shirt||"grey" },
                       a:{ p:"solid", c1:(t.shirt==="white"?"red":"white"), shorts:"black", socks:"white" } };
    return away ? (ks.a||ks.h) : ks.h;
  }
  const kitHex=k=>PAL[k.c1]||k.c1||"#cccccc";
  const GK_COLS=["#ffe23d","#3df04f","#ff8a00","#b9c2cc"];   // era keeper kits: yellow/green/orange/grey
  // the three region-tagged sprite bases the kit renderer recolours — kits bake to null until these exist
  function spriteBasesReady(){ return !!(IMG.strikersheet&&IMG.strikersheet.naturalWidth && IMG.defbase&&IMG.defbase.naturalWidth && IMG.katlas&&IMG.katlas.naturalWidth); }
  function loadKits(mySlug, oppSlug, cb, _waited){
    // CRITICAL: if a match starts before the sprite sheets finish downloading, every SPRITES.* below
    // bakes to null — the keeper then falls back to its RAW region-tag atlas (the "rainbow kit" bug) and
    // the striker/defender vanish. Defer the build until the bases are in (cap ~6s so a genuine asset
    // failure still surfaces visibly instead of soft-locking). In Node the stub images are ready at once.
    _waited = _waited||0;
    if (!spriteBasesReady() && _waited < 6000){ matchLoading=true; setTimeout(()=>loadKits(mySlug, oppSlug, cb, _waited+50), 50); return; }
    matchLoading=false;
    kitsReady=false;
    let myKit=kitFor(mySlug,false), oppKit=kitFor(oppSlug,false);
    if (OPPONENT.home){ if (colDist(kitHex(myKit), kitHex(oppKit))<95) myKit=kitFor(mySlug,true); }
    else              { if (colDist(kitHex(oppKit), kitHex(myKit))<95) oppKit=kitFor(oppSlug,true); }
    const hair=HAIR_COLOURS[rnd(HAIR_COLOURS.length)];
    const skinM = ()=> 1.0 + rnd(5)*0.045;   // per-sprite skin lightness (subtle 1.0..1.18 variation) — was 1.22-1.52 which over-brightened the brighter bake -> overexposed (owner)
    SPRITES.striker  = (IMG.strikersheet&&IMG.strikersheet.naturalWidth) ? buildKit(IMG.strikersheet, myKit, hair, skinM()) : null;
    SPRITES.defender = (IMG.defbase&&IMG.defbase.naturalWidth) ? buildKit(IMG.defbase, oppKit, HAIR_COLOURS[rnd(HAIR_COLOURS.length)], skinM()) : null;
    const gk = GK_COLS.find(cn => colDist(cn,kitHex(myKit))>110 && colDist(cn,kitHex(oppKit))>110) || GK_COLS[0];
    SPRITES.keeper   = (IMG.katlas&&IMG.katlas.naturalWidth) ? buildKit(IMG.katlas, {p:"solid",c1:gk,shorts:"#15171d",socks:gk}, [34,28,24], skinM()) : null;
    kitsReady=true; cb&&cb();
  }
  // Team roster (kits + ratings) for career mode.
  let TEAMS = [], TEAMBY = {}, PAL = {};
  let LEAGUES = {}, LEAGUE_META = {}, LG_DIFF = 1.0;   // leagueId -> sorted teams array / meta; LG_DIFF = active league AI strength (England 1.0 hardest)
  let rosterStatus = "loading";   // loading | ok | error  (surfaced on the menu so failures aren't silent)
  fetch("assets/teams.json")
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(j=>{
      const eng=j.teams.slice().sort((a,b)=>a.name.localeCompare(b.name));   // club-select listed A–Z
      LEAGUES.ENG=eng; LEAGUE_META.ENG={id:"ENG",name:"Premier League",country:"England",targetMod:1.0,drawMod:1.0,flag:{t:"cross",c:["#ffffff","#d62718"]}};
      TEAMS=eng; PAL=j.palette; for (const t of eng) TEAMBY[t.slug]=t; rosterStatus="ok"; })
    .catch(e=>{ rosterStatus="error"; try{ console.error("teams.json failed to load:", e); }catch(_){} });
  // Keeper sprite-atlas manifest (per-frame rects + offsets, all 371-frame anims packed).
  let KMAN = null, KSCALE = 2;   // KSCALE = atlas export scale (render px per unified px); read from the manifest
  fetch("assets/sprites/keeper_atlas.json?v=m14").then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(j=>{ KMAN = j.frames; KSCALE = j.scale || 2; })
    .catch(e=>{ try{ console.error("keeper_atlas.json failed to load:", e); }catch(_){} });
  // ---- L1 perimeter ad boards: manifest + images (sold sponsor boards just replace files in
  // assets/boards/ + boards.json — no code change). Failure falls back to procedural house boards.
  // NB: paths must never contain "ads"/"advert" — desktop ad-blockers block such URLs.
  const HOARD_Y = 104, HOARD_H = 34, HOARD_SLOT = 132, HOARD_N = 7;   // 7 x 132 = 924 = VW (docs/STADIUM_ASSET_SPEC.md §3)
  let ADS = [], ADS_IMG = {}, matchBoards = [];
  fetch("assets/boards/boards.json?v=1")
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(j=>{ ADS = j.boards||[];
      for (const b of ADS){ const im=new Image(); im.src="assets/boards/"+b.img+"?v=1"; ADS_IMG[b.id]=im; } })
    .catch(e=>{ try{ console.error("boards.json failed to load:", e); }catch(_){} });
  function pickBoards(pr){       // weighted pick of 7 boards; pr = match RNG so seeded (daily/HORSE) matches show identical boards
    matchBoards = [];
    if (!ADS.length) return;
    const tot = ADS.reduce((s,b)=>s+(b.weight||1), 0);
    const draw = ()=>{ let x=pr()*tot, id=ADS[ADS.length-1].id;
      for (const b of ADS){ x -= (b.weight||1); if (x<=0){ id=b.id; break; } } return id; };
    for (let i=0;i<HOARD_N;i++){
      let id = draw();
      for (let tries=0; ADS.length>1 && id===matchBoards[i-1] && tries<8; tries++) id = draw();   // no same board twice in a row
      matchBoards.push(id);
    }
  }
  // ---- world data: European clubs, nations (flags + real-life-based ratings), cup minnows ----
  let WORLD=null, worldStatus="loading";
  fetch("assets/world/world.json?v=1")
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(j=>{ WORLD=j; worldStatus="ok";
      for (const t of [].concat(j.euro||[], j.nations||[], j.minnows||[]))
        if (!TEAMBY[t.slug]) TEAMBY[t.slug]=t; })        // kits/ratings join the live-recolour lookup
    .catch(e=>{ worldStatus="error"; try{ console.error("world.json failed to load:", e); }catch(_){} });
  // ---- foreign leagues (career mode E3): elite leagues you can start a career in ----
  let leaguesStatus="loading";
  fetch("assets/world/leagues.json?v=1")
    .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(j=>{ for (const lg of (j.leagues||[])){
        LEAGUES[lg.id]=lg.teams.slice().sort((a,b)=>a.name.localeCompare(b.name));
        LEAGUE_META[lg.id]={id:lg.id, name:lg.name, country:lg.country, targetMod:lg.targetMod||1, drawMod:lg.drawMod||1, flag:lg.flag};
        for (const t of lg.teams) if(!TEAMBY[t.slug]) TEAMBY[t.slug]=t; }
      leaguesStatus="ok";
      if (CAR && CAR.leagueId) setActiveLeague(CAR.leagueId); })   // re-apply if a foreign career was already loaded
    .catch(e=>{ leaguesStatus="error"; try{ console.error("leagues.json failed to load:", e); }catch(_){} });
  function setActiveLeague(id){ if (LEAGUES[id]) TEAMS = LEAGUES[id]; else if (LEAGUES.ENG) TEAMS = LEAGUES.ENG;
    LG_DIFF = (LEAGUE_META[id] && LEAGUE_META[id].targetMod) || 1.0; }   // scales the league-sim AI strength only (sacred physics untouched)
  function leagueList(){ return ["ENG","ESP","ITA","GER","FRA"].filter(id=>LEAGUE_META[id]); }
  function activeLeagueMeta(){ return LEAGUE_META[(CAR&&CAR.leagueId)||"ENG"] || LEAGUE_META.ENG || {name:"League",targetMod:1,drawMod:1}; }
  // Reigning champion shown on the league-select screen. That screen is new-career-only (no save
  // exists yet), so the champion of a fresh universe = the strongest club: position 1 where the
  // league supplies positions (ENG), else top rating, stable tie-break by name.
  function leagueChampion(id){
    const teams=LEAGUES[id]; if(!teams||!teams.length) return null;
    return teams.slice().sort((a,b)=>
      ((a.position||99)-(b.position||99)) || ((b.rating||0)-(a.rating||0)) || a.name.localeCompare(b.name)
    )[0];
  }
  function nationOf(slug){ return ((WORLD&&WORLD.nations)||[]).find(n=>n.slug===slug)||null; }

  // Keeper labelled animation ranges actually used by the original (frame_10 / frame_9):
  //   dive_left/right = gotoandplay; central catch = gotoandstop a single frame by height.
  const KEEPER_ANIMS = { idle:[1,1], dive_left:[50,99], dive_right:[100,149],
                         low_catch:[323,323], mid_catch:[328,328], high_catch:[354,354] };

  // ---- Exact constants (decompiled) ----
  // The SWF runs at 28 fps. Clip enterFrames (striker movement, animations) fire at 28 Hz,
  // but the game-logic main timeline is a 2-frame loop (mainloop=frame9 -> frame10 -> goto),
  // so ball physics / scoring / keeper run at 14 Hz. We mirror that split exactly.
  const FPS = 28, DT = 1 / FPS;       // SWF frame rate (striker + animations)
  const LPOST = 135, RPOST = 430, BARH = 105, POSTTOL = 13;   // exact SWF (frame_9)
  const KEEPER_START_X = 263;
  const MAN_MIN_X = 50, MAN_MAX_X = 500, MAN_START_X = 450, MAN_Y = 300;
  const SERVE_Y = 300, GOAL_RESOLVE_Y = 160, NET_GOAL_Y = 150, YBIT = 8;
  const KICK_FRAMES = 5;             // SWF frames from Space to contact (owner's pick: one frame earlier than the original 6; a fractional 4.5 isn't representable — contact resolves on a discrete tick). drawStriker is parameterised on this.
  // Defender = inner man sprite (DefineSprite_151), exact registration origin from swf.xml
  const DEF_W = 90, DEF_H = 155, DEF_OX = 45, DEF_OY = 78;   // OX/OY are ON-SCREEN anchors (rel. to W/H) -> stay fixed when DEF_FW/FH bump for 2x source
  const DEF_FW = 268, DEF_FH = 460, DEF_FRAMES = 4;          // defender_sheet: 268x460 frame (2x), 4 pose variants (engine picks 3 distinct/match)
  // defender stage bbox (= opponent.man.hitTest); origin (ox,oy) maps to the opponent placement
  function defBox(d){ return { x0:d.ox-DEF_OX*d.sx, x1:d.ox+(DEF_W-DEF_OX)*d.sx,
                               y0:d.oy-DEF_OY*d.sy, y1:d.oy+(DEF_H-DEF_OY)*d.sy }; }
  const DEG = Math.PI / 180;
  // Swappable RNG: normal play uses Math.random; daily challenge + HORSE rounds use a SEEDED
  // generator so everyone (or both players) faces an identical serve/keeper/defender sequence.
  let RAND = Math.random;
  function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
  function seedRand(seed){ RAND = (seed==null) ? Math.random : mulberry32(seed>>>0); }
  const rnd = (n) => Math.floor(RAND() * n);   // emulate AS random(n) => 0..n-1 (via swappable RAND)
  const clamp = (v, lo, hi) => v < lo ? lo : (v > hi ? hi : v);

  // ---- Audio: the ORIGINAL SWF sound effects (decompiled to assets/snd) ----
  //   116 shotsnd -> kick   118 crink -> post/woodwork   171 -> whistle
  //   172 -> goal cheer   173 -> boos   174 near_miss "ooh" -> save
  const SND = {};
  for (const n of ["kick","post","whistle","goal","boos","ooh"]) {
    const a = new Audio("assets/snd/"+n+".mp3?v=hr5"); a.preload="auto"; SND[n]=a;
  }
  let audioUnlocked=false;
  function audio(){                       // prime playback on first user gesture (autoplay policy)
    if (audioUnlocked) return; audioUnlocked=true;
    for (const n in SND){ const a=SND[n];

  function freshTable(){ const t={}; for (const tm of TEAMS) t[tm.slug]={p:0,w:0,d:0,l:0,pts:0,gd:0}; return t; }
  function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=rnd(i+1); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  // then the reverse fixture in the second half — so you never face a team twice until you've
  // played everyone once (like a real league).
  function makeFixtures(slug){
    const others = TEAMS.filter(t=>t.slug!==slug).map(t=>t.slug);
    const firstHome = {}; for (const o of others) firstHome[o] = rnd(2)===0;
    const first  = shuffle(others.map(o=>({opp:o, home: firstHome[o]})));
    const second = shuffle(others.map(o=>({opp:o, home: !firstHome[o]})));
    return first.concat(second);

  // ---- season calendar: league matchdays with cup / European fixtures slotted between ----
  const CUP_AFTER=[6,12,19,26,33], EURO_G_AFTER=[4,9,14,18,23,27], EURO_SF_AFTER=30, EURO_F_AFTER=35;

  function buildCalendar(hasEuro, mds){
    // mds = league matchdays (=(teams-1)*2). England=38; foreign leagues scale the cup/Euro
    // slots proportionally so any league size keeps the same competition shape.
    const N = mds || 38, scale = x => N===38 ? x : Math.max(1, Math.round(x/38*N));
    const cupAfter = CUP_AFTER.map(scale), euroGAfter = EURO_G_AFTER.map(scale);
    const euroSF = scale(EURO_SF_AFTER), euroF = scale(EURO_F_AFTER);
    const cal=[];
    for (let md=0; md<N; md++){
      cal.push({t:'L'});
      const after=md+1, ci=cupAfter.indexOf(after);
      if (ci>=0) cal.push({t:'C', r:ci});
      if (hasEuro){ const ei=euroGAfter.indexOf(after);
        if (ei>=0) cal.push({t:'E', k:ei});
        if (after===euroSF) cal.push({t:'E', k:6});
        if (after===euroF)  cal.push({t:'E', k:7}); }
    }
    return cal;
  }
  function leagueMatchdays(){ return Math.max(2, (TEAMS.length-1)*2); }   // double round-robin

  // ---- Title-race model (shared by simRound + computeTitleOdds) ----
  // A team's per-game win chance is a GENTLE function of its strength so a single rating point
  // doesn't compound into a near-certain title over 38 games. Strength = static rating blended
  // with the team's OBSERVED points-per-game once it has played, so the table reacts to real
  // results. computeTitleOdds also draws a per-team "form" offset each simulated season, giving
  // realistic tails: the favourites sit ~25%, the chasing pack has a genuine chance, and the
  // number visibly MOVES as you win or lose (the old model pinned everyone outside the top 2 at 1%).
  // ODDS_FORM = per-season form variance. Higher = more upsets => a points lead is worth less,
  // so a 5pt lead with 15 games left reads ~60% (like a real betting market) instead of ~74%.
  // Calibrated against real recent EPL tables (sim-verified over 400 seasons):
  // champions avg ~87 (range ~71-105), 4th ~71, 7th ~60, 10th ~50, 17th ~32, bottom ~22.
  // ODDS_EXP makes the strength curve convex so elite clubs stay elite while mid-table
  // drops to realistic totals; the observed-ppg blend is capped so leaders don't regress.
  const ODDS_W0 = 0.16, ODDS_WS = 0.52, ODDS_EXP = 1.4, ODDS_DRAW = 0.24, ODDS_FORM = 0.14;
  const winProb = (s)=> clamp(ODDS_W0 + ODDS_WS*Math.pow(s, ODDS_EXP)*LG_DIFF, 0.10, 0.78);
  function teamStrength(slug){
    const t=TEAMBY[slug], r=CAR.table[slug]; let s=(t.rating-1)/9;
    if (r.p>=3){ const ppg=r.pts/r.p, sImp=ppg/3, w=Math.min(0.35, r.p/24); s=(1-w)*s + w*sImp; }
    return clamp(s, 0, 1);
  }
  // simulate one matchday for all teams except those given (player's + opponent's real result handled separately)
  function simRound(exclude){
    for (const tm of TEAMS){
      if (exclude.indexOf(tm.slug)>=0) continue;
      const pW = winProb(teamStrength(tm.slug));
      const row = CAR.table[tm.slug]; row.p++; const x=Math.random();
      if (x < pW){ row.w++; row.pts+=3; row.gd+=1+rnd(2); }
      else if (x < pW+ODDS_DRAW){ row.d++; row.pts+=1; }
      else { row.l++; row.gd-=1+rnd(2); }
    }
  }
  // Monte-Carlo the rest of the season -> % chance the player finishes 1st.
  function computeTitleOdds(){
    if (!CAR) return null;
    const N=500, total=CAR.fixtures.length, me=CAR.slug; let wins=0;
    const sT={}; for (const t of TEAMS) sT[t.slug]=teamStrength(t.slug);   // base strengths once per call
    for (let k=0;k<N;k++){
      const pts={}, gd={};
      for (const t of TEAMS){ const r=CAR.table[t.slug]; pts[t.slug]=r.pts; gd[t.slug]=r.gd;
        const form=(Math.random()*2-1)*ODDS_FORM;                          // this team runs hot/cold this season
        const pW=clamp(winProb(sT[t.slug]) + form, 0.08, 0.82);
        for (let g=total-r.p; g>0; g--){ const x=Math.random();
          if (x<pW){ pts[t.slug]+=3; gd[t.slug]++; } else if (x<pW+ODDS_DRAW){ pts[t.slug]++; } else { gd[t.slug]--; } }
      }
      let best=me;
      for (const t of TEAMS){ if (pts[t.slug]>pts[best] || (pts[t.slug]===pts[best] && gd[t.slug]>gd[best])) best=t.slug; }
      if (best===me) wins++;
    }
    let pct=Math.round(wins/N*100);
    // floor at 1% only while the player can still mathematically reach the top rival's current points
    if (pct===0){
      const myMax=CAR.table[me].pts + (total-CAR.table[me].p)*3;
      let bestRival=0;
      for (const t of TEAMS){ if (t.slug===me) continue;
        if (CAR.table[t.slug].pts>bestRival) bestRival=CAR.table[t.slug].pts; }
      if (myMax>bestRival) pct=1;
    }
    return pct;
  }

      if (keeperPose.frame < a[1]) keeperPose.frame++;
    }

    // game logic runs every frame (28 Hz) — full-rate cross, matches the original's feel
    logicStep();
  }

  // ---- 14 Hz logic: frame_9 (physics + resolve) then frame_10 (contact, defenders, keeper, end) ----
  function logicStep() {
    // ===== frame_9: ball physics =====
    t += 0.06;
    if (!booted) {
      yball = SERVE_Y;
      xball = ay*10;                              // xball lags ay by one step (faithful)
      ay = cangle*velocity*t + bounce;
      z = (sangle*velocity*t - 5*t*t)*10;
      if (z<0) { t=0; bounce=ay; bounced=2; velocity*=0.7; z=0; }
      yscale = 10 + 90*yball/325;
    } else if (!innet && !held) {        // held = keeper has caught it: freeze the ball in his hands
      xball -= dbx; yball -= ybit; z += dby/13;
      yscale = 10 + 90*yball/325;
      if (yball<GOAL_RESOLVE_Y && !checked) {
        checked=true; savedCheck();
        // ===== EXACT transcription of frame_9 resolution =====
        if (hitkeeper===0) {
          if (Math.abs(xball-RPOST)<POSTTOL && z<BARH) {
            rposthit=true; ybit=-ybit; dbx=-10; M.score+=Math.round(150/bounced); flagResult("WOODWORK!","#ff9f1c",150); sfx.post(); barShakeT=0.35;
          }
          if (Math.abs(xball-LPOST)<POSTTOL && z<BARH) {
            lposthit=true; ybit=-ybit; dbx=10; M.score+=Math.round(150/bounced); flagResult("WOODWORK!","#ff9f1c",150); sfx.post(); barShakeT=0.35;
          }
          if (z>=BARH-15 && z<=BARH && xball>LPOST && xball<RPOST) {
            if (!(lposthit||rposthit)) { hitbar=true; dby=10; M.score+=Math.round(150/bounced); flagResult("OFF THE BAR!","#ff9f1c",150); sfx.post(); barShakeT=0.35; }
          }
          if (xball>LPOST && xball<RPOST && z<BARH && !rposthit && !lposthit && !hitbar) {
            innet=true;   // GOAL
          } else if (!rposthit && !lposthit && !hitbar) {
            flagResult("MISSED!","#ff5d5d",0);   // wide/over -> miss (no score; cosmetic text only)
          }
        } else {
          M.score+=Math.round(300/bounced); flagResult("SAVED!","#ffd23f",300); sfx.save();
          if (divedirn==="left"){ ybit=-ybit; dbx=10; dby=-dby; } else { ybit=-ybit; dbx=-10; dby=-dby; }
          if (no_dive){ held=true; keeperPose.anim="catch"; keeperPose.frame = (z<30 ? 323 : (z<60 ? 328 : 354)); }
        }
        if (window.__dbg) window.__rs={finalx:Math.round(xball),z:Math.round(z),hk:hitkeeper,innet,rp:rposthit,lp:lposthit,bar:hitbar};
      }
    } else {
      xball -= dbx; yball -= 6; z += dby/12;
      yscale = 10 + 90*yball/325;
      if (rightcorner===1){ dbx=10; rightcorner=0; }
      if (leftcorner===1){ dbx=-10; leftcorner=0; }
      if (topnet===1){ z=znet-20; }
      if (yball<NET_GOAL_Y) {
        end=1; M.score+=Math.round(4000/bounced); sc=1; M.goals++;
        netBulgeT=0.5; netBulgeX=xball; netBulgeY=clamp(yball-z, 72, 158);   // ripple the net at the entry point
        flagResult("GOOOOAL!","#46e36b",4000); sfx.goal(); flash=0.6;
      }
    }

    // ===== frame_10: contact, defenders, keeper, end =====
    // contact resolves once the kick animation has reached its strike frame
    if (kicked && !cchecked && manFinished) {
      cchecked=true;
      dbx = manX + 15 - xball;
      dby = z;
      if (z<40 && Math.abs(dbx)<30) {
        booted=true; innet=false; M.score += Math.round(100/bounced); sfx.kick();
        state=ST.FLIGHT;
      } else {
        complete_miss=true;   // whiff – attempt lost when ball rolls off
      }
    }
    dby = z;   // frame_10 line 50

    // defenders: each gets ONE hitTest the moment the ball passes its depth threshold (frame_10 1-30)
    if (booted) {
      const bx = xball, by = yball - z;   // ball._x, ball._y (screen)
      for (const d of defenders) {
        if (!d.chk && yball < d.thr) {
          d.chk = true;
          const b = defBox(d);
          if (bx>=b.x0 && bx<=b.x1 && by>=b.y0 && by<=b.y1){ dbx += d.sign*(d.mag + rnd(8));
            if (window.__df) window.__df.push({ox:d.ox,sign:d.sign,atx:Math.round(bx),aty:Math.round(by),newdbx:Math.round(dbx)}); }
        }
      }
    }

    // keeper dive AI
    if (booted && !dive) {
      dive=true; destination = xball - 18*dbx; divedirn="up";
      if (rnd(10)<8) {
        if (destination>310 && destination<500){ divedirn="right"; no_dive=false; keeperPose.anim="dive_right"; keeperPose.frame=KEEPER_ANIMS.dive_right[0]; }
        if (destination<250 && destination>50){ divedirn="left"; no_dive=false; keeperPose.anim="dive_left"; keeperPose.frame=KEEPER_ANIMS.dive_left[0]; }
      }
      keeperPose.dir = divedirn;
    }
    if (dive && no_dive) {
      if (destination>keeperPose.x) keeperPose.x+=1;
      if (destination<keeperPose.x) keeperPose.x-=1;
    }

    // end conditions + serve roll-off
    if (yball<100) end=1;
    if (hitbar && z>200) end=1;
    if ((lposthit||rposthit||hitkeeper===1) && yball>200) end=1;
    if (t>7) end=1;

    const shotOver = (end===1) || (!booted && xball>=600);
    if (shotOver) {
      if (!booted) flagResult(complete_miss ? "MISSED IT!" : "NO CONTACT", "#9aa7b4", 0);
      if (!sc || GMODE==="horse") M.attempts--;     // goals (sc=1) are free shots — except HORSE: exactly one delivery per go
      resultTimer = 1.0;
      state = ST.RESULT;
    }
  }

  function flagResult(txt,col,pts){ if(resultText==="" || pts>0){ resultText=txt; resultColor=col; resultPoints=pts; } }

  // =================== RENDER ===================
  function clearResult(){ resultText=""; resultColor="#fff"; resultPoints=0; }

  // Logical (zoom-1) sprite sizes + registration origins. Bitmaps are exported at 3x and
  // drawn at these logical sizes so the browser downscales -> crisp (vector-equivalent at this canvas).
  const BALL_W = 41, BALL_H = 41, BALL_OX = 19.6, BALL_OY = 34.1;
  const BALL_FW = 132, BALL_FH = 132, BALL_FRAMES = 24;   // rotating Tango sheet
  const SHADOW_W = 28, SHADOW_H = 11, SHADOW_OX = 13.0, SHADOW_OY = 0.0;
  function drawBall() {
    if (state===ST.COUNTDOWN) return;     // when held, keep drawing the ball (frozen in the keeper's hands)
    // smooth the 28Hz physics position to the render rate (render-only; never feeds physics/save).
    let bx=xball, by=yball, bz=z;
    if (BALL_SMOOTH && (state===ST.SERVE||state===ST.FLIGHT) && !held){
      const dx=xball-pXball, dy=yball-pYball, dz=z-pZ;
      if (Math.abs(dx)<80 && Math.abs(dy)<120){          // small step -> lerp; large -> a reset/teleport, snap
        bx=pXball+dx*ballAlpha; by=pYball+dy*ballAlpha; bz=pZ+dz*ballAlpha;
      }
    }
    const ysc = 10 + 90*by/325;                          // ball size follows the interpolated height
    const ss = ysc/100;                                  // shadow + in-net ball use full yscale
    const bs = (innet ? ysc : ysc*0.8)/100;              // /ball uses yscale*0.8, /ball2 (in net) uses yscale (frame_9 :276/:285)
    // shadow: origin (13.0, 0.0) maps to (xball, yball); alpha ~0.25 (original CXFORM alphaMult 64/256)
    if (by>=130 && IMG.shadow.naturalWidth) {
      ctx.globalAlpha=0.25;
      ctx.drawImage(IMG.shadow, bx-SHADOW_OX*ss, by-SHADOW_OY*ss, SHADOW_W*ss, SHADOW_H*ss);
      ctx.globalAlpha=1;
    }
    // ball: origin (19.6, 34.1) maps to (xball, yball-z); cycle the rotating Tango sheet
    if (IMG.ball.naturalWidth) {
      const bf = ((ballSpin % BALL_FRAMES) + BALL_FRAMES) % BALL_FRAMES;
      ctx.drawImage(IMG.ball, bf*BALL_FW, 0, BALL_FW, BALL_FH,
                    bx-BALL_OX*bs, (by-bz)-BALL_OY*bs, BALL_W*bs, BALL_H*bs);
    }
  }

  function drawKeeper() { drawKeeperTo(ctx); }

  // Exact keeper placement scale from the SWF (PlaceObject / keeps._yscale=78).
  // Feet-anchor: keeper standing feet (PNG 300,197) -> stage (keeps._x=263, goal-line y=163).
  const KEEPER_SX = 0.7530, KEEPER_SY = 0.7767;
  const KEEPER_FEET_PX = 300, KEEPER_FEET_PY = 197;   // standing feet/centre in the 596x263 sprite
  const KEEPER_STAGE_Y = 163;                          // goal line (measured from pitch.jpg post base)

  // Render the current keeper frame from the sprite atlas. Frames share a unified canvas, so
  // each frame's (ox,oy) offset (logical px) positions it relative to the fixed feet anchor;
  // side-dive frames carry the lateral motion internally (keeps._x stays put on a dive).
  function drawKeeperTo(g) {
    if (!KMAN) return;
    const fr = KMAN[String(keeperPose.frame)] || KMAN["1"];
    if (!fr) return;
    const sheet = SPRITES.keeper || IMG.katlas;
    if (!sheet || !(sheet.naturalWidth||sheet.width)) return;
    g.save();
    g.translate(keeperPose.x, KEEPER_STAGE_Y);     // central keeper shuffles x; dives keep x=263
    g.drawImage(sheet, fr.x, fr.y, fr.w, fr.h,
                (fr.ox - KEEPER_FEET_PX)*KEEPER_SX, (fr.oy - KEEPER_FEET_PY)*KEEPER_SY,
                (fr.w/KSCALE)*KEEPER_SX, (fr.h/KSCALE)*KEEPER_SY);   // /KSCALE: atlas export scale
    g.restore();
  }

  // exact: gameplay player placed at scale 1.0 (root); registration origin (101.2,126.5) -> (man._x, man._y)
  const STRIKER_OX = 109, STRIKER_OY = 162, STRIKER_W = 191, STRIKER_H = 243;   // OX/OY are ON-SCREEN anchors (rel. to W/H), NOT source res -> stay fixed when FW/FH bump
  const STRIKER_FW = 600, STRIKER_FH = 764, STRIKER_FRAMES = 16;   // sheet: frame 0 idle, 1..15 = Shot f1..f15
  const STRIKER_CONTACT = 12;   // sheet frame of the foot-on-ball strike (Shot f12), aligned to the boot tick (owner: one frame earlier)
  function drawStriker() {
    const sh=SPRITES.striker;
    if (!sh) return;
    // Ball is booted at manKickT≈KICK_FRAMES, so the strike pose (STRIKER_CONTACT) must land on
    // that tick: wind-up plays over 0..KICK_FRAMES, then follow-through 1/tick, holding the last
    // frame (never index past the sheet, so the striker never vanishes after the kick).
    let f = 0;
    if (manKicking) {
      f = (manKickT <= KICK_FRAMES)
        ? Math.round(manKickT / KICK_FRAMES * STRIKER_CONTACT)
        : Math.min(STRIKER_CONTACT + (manKickT - KICK_FRAMES), STRIKER_FRAMES - 1);
    }
    ctx.drawImage(sh, f*STRIKER_FW, 0, STRIKER_FW, STRIKER_FH,
                  manX - STRIKER_OX, MAN_Y - STRIKER_OY, STRIKER_W, STRIKER_H);
  }

  function drawDefenders() {
    const dim=SPRITES.defender; if (!dim) return;
    // far (smaller) first for correct overlap; draw man origin (DEF_OX,DEF_OY) at the opponent placement
    const order = defenders.slice().sort((a,b)=>a.sy-b.sy);
    for (const d of order) {
      const v = ((d.variant||0) % DEF_FRAMES + DEF_FRAMES) % DEF_FRAMES;   // per-defender pose
      const dw=DEF_W*d.sx, dh=DEF_H*d.sy, dx=d.ox - DEF_OX*d.sx, dy=d.oy - DEF_OY*d.sy;
      if (d.mir){                                                          // mirror some defenders -> more apparent variety
        ctx.save(); ctx.translate(dx+dw/2, 0); ctx.scale(-1,1);
        ctx.drawImage(dim, v*DEF_FW, 0, DEF_FW, DEF_FH, -dw/2, dy, dw, dh); ctx.restore();
      } else {
        ctx.drawImage(dim, v*DEF_FW, 0, DEF_FW, DEF_FH, dx, dy, dw, dh);
      }
    }
  }

  // chunky 3D arcade panel border: raised (light TL / dark BR) or inset (dark TL / light BR)
  function bevel(x,y,w,h,fill,inset,t,light){
    t=t||3; light=light||"#5a5f68";
    ctx.fillStyle=fill; ctx.fillRect(x,y,w,h);
    ctx.fillStyle=inset?"#0b0d11":light; ctx.fillRect(x,y,w,t); ctx.fillRect(x,y,t,h);             // top + left
    ctx.fillStyle=inset?light:"#0b0d11"; ctx.fillRect(x,y+h-t,w,t); ctx.fillRect(x+w-t,y,t,h);     // bottom + right
  }
  // ---- 16-bit scoreboard numerals: 5x7 pixel bitmap digits with per-row shading and a
  // hard drop shadow — the digitised Mega Drive scoreboard look (not flat 7-seg).
  const _DIG={ '0':["01110","10001","10001","10001","10001","10001","01110"],
               '1':["00100","01100","00100","00100","00100","00100","01110"],
               '2':["01110","10001","00001","00010","00100","01000","11111"],
               '3':["11110","00001","00001","01110","00001","00001","11110"],
               '4':["00010","00110","01010","10010","11111","00010","00010"],
               '5':["11111","10000","11110","00001","00001","10001","01110"],
               '6':["00110","01000","10000","11110","10001","10001","01110"],
               '7':["11111","00001","00010","00100","01000","01000","01000"],
               '8':["01110","10001","10001","01110","10001","10001","01110"],
               '9':["01110","10001","10001","01111","00001","00010","01100"],
               '-':["00000","00000","00000","01110","00000","00000","00000"],
               ' ':["00000","00000","00000","00000","00000","00000","00000"] };
  function _shadeHex(hex, amt){           // amt>0 lighten toward white, amt<0 darken toward black
    const n=parseInt(hex.slice(1),16); let r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    if (amt>=0){ r+= (255-r)*amt; g+=(255-g)*amt; b+=(255-b)*amt; } else { r*=1+amt; g*=1+amt; b*=1+amt; }
    return "rgb("+Math.round(r)+","+Math.round(g)+","+Math.round(b)+")";
  }
  function ledDigit(x,y,w,h,ch,on,off){
    const g=_DIG[ch]||_DIG[' '], c=Math.max(2,Math.floor(Math.min(w/5,h/7)));
    const dx=x+Math.round((w-5*c)/2), dy=y+Math.round((h-7*c)/2);
    for(let r=0;r<7;r++){                                          // shaded face: bright crown, dark base (no drop shadow — cast onto the board read oddly)
      ctx.fillStyle=_shadeHex(on, r<1?0.45 : r<2?0.22 : r>=6?-0.30 : r>=5?-0.15 : 0);
      for(let q=0;q<5;q++) if(g[r][q]==="1") ctx.fillRect(dx+q*c, dy+r*c, c, c);
    }
  }
  function drawLED(x,y,w,h,str,on,off){
    const n=str.length||1, c=Math.max(2,Math.floor(Math.min(w/(6*n), h/7)));
    const dw=c*6, x0=x+w-n*dw, y0=y+Math.round((h-7*c)/2);         // right-aligned in box
    for (let i=0;i<n;i++) ledDigit(x0+i*dw, y0, c*5, c*7, str[i], on, off);
  }

    let fs=16; ctx.font=ttFont(fs,"bold "); while (ctx.measureText(name).width>w-18 && fs>9){ fs--; ctx.font=ttFont(fs,"bold "); }

  function canCheckout(){ return (state===ST.SERVE||state===ST.FLIGHT||state===ST.RESULT) && M.attempts>0 && M.score>=M.winTarget; }

  // end-of-match result: the word RISES into place, PAUSES, then FALLS AWAY as a pixel cascade.
  // The word is sampled into a grid of square cells once (8-bit look); the same cells are used for
  // the solid hold and for the disintegration, so it reads as the exact word breaking apart.
  let _cascade=null;
  function _buildCascade(word){
    if (_cascade && _cascade.word===word) return _cascade;
    const fs = word.length>5 ? 86 : 116, cell=7;
    const tc=document.createElement("canvas"), tg=tc.getContext("2d");
    const setF=()=>{ tg.font="900 "+fs+"px 'Arial Black','Arial',sans-serif"; tg.textBaseline="middle"; tg.textAlign="center"; };
    setF(); const tw=Math.ceil(tg.measureText(word).width)+24, th=fs+24;
    tc.width=tw; tc.height=th; setF(); tg.fillStyle="#fff"; tg.fillText(word, tw/2, th/2);
    const d=tg.getImageData(0,0,tw,th).data, cells=[];
    for (let y=0;y<th;y+=cell) for (let x=0;x<tw;x+=cell){
      const sx=Math.min(tw-1,(x+cell/2)|0), sy=Math.min(th-1,(y+cell/2)|0);
      if (d[(sy*tw+sx)*4+3]>90) cells.push({ x:x-tw/2, y:y-th/2, delay:(x/tw)*0.32+Math.random()*0.16 });
    }
    return _cascade={ word, cells, cell, w:tw, h:th };
  }
  function _cellHash(c){ return (((Math.abs(c.x)|0)*73856093)^((Math.abs(c.y)|0)*19349663))%1000/1000; }
  function drawMatchEndBurst() {
    ctx.fillStyle="rgba(4,6,10,0.72)"; ctx.fillRect(-OX,0,VW,SH);
    const word=matchEndText, elapsed=1.6-matchEndTimer;
    const fs = word.length>5 ? 100 : 138;                 // big, clean — solid text, no cell grid
    ctx.save();
    ctx.translate(SW/2, SH/2-6);
    // entrance: slam down -> small settle bounce -> hold -> fade out
    let yOff=0, scale=1, alpha=1;
    if (elapsed<0.18){ const p=elapsed/0.18; yOff=-(1-p)*(1-p)*360; scale=0.88+0.12*p; alpha=Math.min(1,p*6); }
    else if (elapsed<0.36){ const p=(elapsed-0.18)/0.18; scale=1+0.07*Math.sin(p*Math.PI); }
    else if (elapsed>1.25){ alpha=Math.max(0,(1.6-elapsed)/0.35); }
    ctx.globalAlpha=alpha;
    ctx.translate(0,yOff); ctx.scale(scale,scale);
    ctx.transform(1,0,-0.17,1,0,0);                       // italic shear (even, no gridlines)
    ctx.font="900 "+fs+"px 'Arial Black','Arial',sans-serif";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillText(word, 7, 8);                         // drop shadow (depth)
    ctx.lineJoin="round"; ctx.lineWidth=Math.max(4,fs*0.06); ctx.strokeStyle="#0a0c12"; ctx.strokeText(word,0,0);  // crisp even outline
    ctx.fillStyle=matchEndColor; ctx.fillText(word,0,0);                               // solid colour fill
    if (elapsed>0.06 && elapsed<0.30){ ctx.globalAlpha=alpha*Math.max(0,0.55-(elapsed-0.06)*2.6); ctx.fillStyle="#fff"; ctx.fillText(word,0,0); }  // slam flash
    ctx.restore();
    ctx.globalAlpha=1; ctx.textBaseline="alphabetic"; ctx.textAlign="left";
  }
  function drawResultText() {
    if (state===ST.RESULT && resultText) {
      ctx.textAlign="center";
      const isGoal = resultPoints>=4000 || resultText.indexOf("GOO")===0;
      if (isGoal){
        const tt=performance.now()/1000, pulse=1+0.18*Math.sin(tt*18);     // size throb
        const cols=[TTX.green,TTX.yellow,TTX.white,TTX.magenta], col=cols[Math.floor(tt*12)%cols.length];
        ctx.save(); ctx.translate(SW/2,150); ctx.scale(pulse,pulse);
        ctx.font=ttFont(56);
        ctx.fillStyle="rgba(0,0,0,0.9)"; ctx.fillText(resultText,4,5);      // hard shadow for legibility
        ctx.fillStyle=col; ctx.fillText(resultText,0,0); ctx.restore();
      } else {
        ctx.font=ttFont(42);
        ctx.fillStyle="rgba(0,0,0,0.9)"; ctx.fillText(resultText, SW/2+3, 153);
        ctx.fillStyle=resultColor; ctx.fillText(resultText, SW/2, 150);
      }
      if (resultPoints>0){
        ctx.font=ttFont(22);
        const pts = bounced>1 ? Math.round(resultPoints/2) : resultPoints;
        ctx.fillStyle="rgba(0,0,0,0.9)"; ctx.fillText("+"+pts, SW/2+2, 196);
        ctx.fillStyle=TTX.white; ctx.fillText("+"+pts, SW/2, 194);
      }
      ctx.textAlign="left";
    }
  }

  // ================= TELETEXT UI KIT (CEEFAX-style menus/tables) =================
  const TTX = { bg:"#06070b", white:"#ffffff", cyan:"#3df0ff", green:"#4dff7a", yellow:"#ffe23d",
                red:"#ff5252", blue:"#5b7bff", magenta:"#ff6ad5", grey:"#9aa7b4", dim:"#5d6b78", neon:"#39ff14" };
  const TT_SCALE=1.3;   // VT323 renders small per-em; gentle global scale (1.5 was too chunky/overlapping)
  function ttFont(px, w){ return (w||"")+Math.round(px*TT_SCALE)+"px 'VT323','Courier New','Lucida Console',monospace"; }
  function pxFont(px){ return px+"px 'Press Start 2P','Courier New',monospace"; }   // chunky 8-bit (countdown, big headings)
  // Pixel-precise centred text: places the glyph's VISUAL centre at (cx,cy) using real font
  // metrics, so a box drawn symmetrically around (cx,cy) lines up on BOTH axes. The single
  // source of truth for "centre text in a box" — use it instead of guessing baseline offsets.
  // (Real browsers expose actualBoundingBox*; the Node CI stub doesn't, so it falls back.)
  function centredText(text, cx, cy, align){
    const m=ctx.measureText(text), a=m.actualBoundingBoxAscent, d=m.actualBoundingBoxDescent;
    const dy=(typeof a==="number" && !isNaN(a)) ? (a-d)/2 : (parseInt(ctx.font,10)||14)*0.34;   // baseline offset to centre glyph on cy
    const pa=ctx.textAlign, pb=ctx.textBaseline;
    ctx.textAlign=align||"center"; ctx.textBaseline="alphabetic"; ctx.fillText(text, cx, cy+dy);   // align="left" => vertical-only centring
    ctx.textAlign=pa; ctx.textBaseline=pb;
  }
  // nudge the canvas to use the web fonts as soon as they load (rAF redraws, so text just pops in)
  if (document.fonts && document.fonts.load){ document.fonts.load("32px VT323"); document.fonts.load("32px 'Press Start 2P'"); }

  // Clean crisp text helper (anti-aliased, sharp now that the backing store matches the display — the
  // earlier 1-bit threshold eroded VT323's thin strokes and looked broken). ha:'l'|'c'|'r' va:'t'|'m'|'b'.
  function pxText(text, x, y, sizePx, color, ha, va){
    ctx.font=ttFont(sizePx); ctx.fillStyle=color;
    ctx.textAlign = ha==='c'?'center':(ha==='r'?'right':'left');
    ctx.textBaseline = va==='m'?'middle':(va==='b'?'bottom':(va==='t'?'top':'alphabetic'));
    ctx.fillText(String(text), x, y);
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }
  function ttClear(){ ctx.fillStyle=TTX.bg; ctx.fillRect(0,0,VW,SH);   // full landscape width
    // faint scanlines for the retro CRT feel
    ctx.fillStyle="rgba(0,0,0,0.16)"; for (let y=0;y<SH;y+=3) ctx.fillRect(0,y,VW,1); }

  // ---- line-by-line "printing" reveal (resets whenever the screen/state changes) ----
  let stateEnterAt=performance.now(), _prevDrawState=null;
  function screenAge(){ return (performance.now()-stateEnterAt)/1000; }
  const TT_LINE=0.06, TT_CPS=140;          // delay between lines + chars/sec within a line
  function ttSub(text, lineIdx){           // visible substring of `text` for its print order
    const age=screenAge()-(lineIdx||0)*TT_LINE;
    if (age<=0) return null;               // not started printing yet
    const n=Math.floor(age*TT_CPS);
    return n>=text.length ? text : text.slice(0,n);
  }
  function ttCursorOn(){ return (Math.floor(performance.now()/260)%2)===0; }
  function ttDone(lines){ return screenAge() > (lines||0)*TT_LINE + 0.25; }   // has the whole reveal finished?
  // print one monospace line; left-aligned at x (or centred on its FULL width so layout is stable).
  // returns true once the whole line has printed.
  function ttPrint(text, x, y, color, lineIdx, opts){
    opts=opts||{}; ctx.font=ttFont(opts.size||13, opts.weight);
    const sub=ttSub(text, lineIdx); if (sub===null) return false;
    let gx=x;
    if (opts.center){ ctx.textAlign="left"; gx=VW/2 - ctx.measureText(text).width/2; }
    else ctx.textAlign="left";
    ctx.fillStyle=color;
    const full=sub.length>=text.length;
    ctx.fillText(sub, gx, y);
    if (!full && ttCursorOn()){ const cw=ctx.measureText("M").width; ctx.fillRect(gx+ctx.measureText(sub).width+1, y-Math.round((opts.size||13)*0.78), cw*0.7, (opts.size||13)*0.9); }
    return full;

  // ---- crisp 8-bit football: a cached pixel bitmap (no anti-alias), blitted square-by-square ----
  // grid values 0=transparent · 1=white · 2=black. Built once per grid size: a circle silhouette,
  // a hard black rim, a central black pentagon and five black edge patches — the classic pixel ball.
  const _ballBmp={};
  function _ballBitmap(N){
    if (_ballBmp[N]) return _ballBmp[N];
    const c=(N-1)/2, R=N/2-0.5, TURN=2*Math.PI/5, A0=-Math.PI/2;
    const inside=(x,y)=> (x-c)*(x-c)+(y-c)*(y-c) <= R*R;
    const poly=(px,py,pr,rot)=>{ const p=[]; for(let i=0;i<5;i++){const a=rot+i*TURN; p.push([px+Math.cos(a)*pr, py+Math.sin(a)*pr]);} return p; };
    const inP=(x,y,p)=>{ let w=false; for(let i=0,j=p.length-1;i<p.length;j=i++){ const a=p[i],b=p[j];
      if(((a[1]>y)!==(b[1]>y)) && (x < (b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])) w=!w; } return w; };
    const centre=poly(c,c,R*0.40,A0), edges=[];
    for(let i=0;i<5;i++){ const a=A0+i*TURN; edges.push(poly(c+Math.cos(a)*R*0.70, c+Math.sin(a)*R*0.70, R*0.30, a+Math.PI)); }
    const grid=[];
    for(let y=0;y<N;y++){ const row=[]; for(let x=0;x<N;x++){
      if(!inside(x,y)){ row.push(0); continue; }
      const rim = !inside(x-1,y)||!inside(x+1,y)||!inside(x,y-1)||!inside(x,y+1);
      let black = rim || inP(x+0.5,y+0.5,centre);
      if(!black) for(const e of edges){ if(inP(x+0.5,y+0.5,e)){ black=true; break; } }
      row.push(black?2:1);
    } grid.push(row); }
    return _ballBmp[N]=grid;
  }
  function _ball8(g, cx, cy, r){
    const N=15, bmp=_ballBitmap(N), x0=cx-r, y0=cy-r, sp=(2*r)/N;
    for(let y=0;y<N;y++) for(let x=0;x<N;x++){ const v=bmp[y][x]; if(!v) continue;
      const px=Math.round(x0+x*sp), py=Math.round(y0+y*sp);
      const pw=Math.round(x0+(x+1)*sp)-px, ph=Math.round(y0+(y+1)*sp)-py;
      g.fillStyle = v===2 ? "#0b0b0b" : "#f4f4f4"; g.fillRect(px,py,pw,ph);
    }
  }
  // ---- Headings: STANDARDISED TELETEXT (upright VT323, solid colour, subtle depth). `drawHeadline`
  // is the single renderer for every big in-game heading (MULTIPLAYER, START, player/champion names,
  // HORSE letters…). The HOMESCREEN SCORDAGOL logo is the ONE exception — it uses drawSportyLogo.
  // (Owner direction: sporty/italic look on the homescreen only; everything else = plain teletext.)
  const LOGO_ACCENT="#2fd45c";   // legacy SCORDAGOL green accent (still used by some UI strokes)
  function headFont(px){ return px+"px 'VT323','Courier New',monospace"; }   // upright teletext face
  // Big heading at (cx,cy), centred on cy. opts: {color, align}. Kept call-compatible with the old
  // rainbow-italic renderer — legacy `skew`/`streak` opts are accepted but ignored (headings are
  // plain teletext now), so existing call sites need no changes.
  function drawHeadline(text, cx, cy, size, opts){
    opts=opts||{};
    const align=opts.align||"center";
    ctx.save();
    ctx.font=headFont(size); ctx.textAlign=align; ctx.textBaseline="middle";
    ctx.fillStyle="rgba(0,0,0,0.55)"; ctx.fillText(text, cx+Math.max(1,size*0.04), cy+Math.max(1,size*0.06));   // soft depth
    ctx.fillStyle=opts.color||TTX.white;
    ctx.fillText(text, cx, cy);
    ctx.restore();
  }
  function drawLogo(cx, baseY, maxW, opts){            // SCORDAGOL wordmark in standard teletext (sub-screen headers)
    opts=opts||{};
    const txt="SCORDAGOL", maxH=opts.maxH||150, cy=(opts.cy!=null)?opts.cy:baseY-maxH/2;
    let s=Math.min(maxH, 132);
    ctx.font=headFont(s); let w=ctx.measureText(txt).width;
    if (w>maxW) s=Math.max(12, s*maxW/w);
    drawHeadline(txt, cx, cy, Math.round(s), {color:opts.color||TTX.white});
  }
  // ---- HOMESCREEN logo ONLY: bold, chunky, italic 3D-extruded wordmark (Lardiland/sporty look). ----
  // Press Start 2P slab letters, skewed for an italic lean, stacked dark copies for depth, a red→gold
  // vertical gradient face and a dark keyline. Deliberately NOT teletext — this is the brand splash.
  const SPORTY_SKEW=0.18;
  function sportyFont(px){ return px+"px 'Press Start 2P','Courier New',monospace"; }
  function drawSportyLogo(cx, cy, maxW, maxH){
    const txt="SCORDAGOL";
    // fit to the width budget (the skew widens it a touch); height is the secondary cap
    let s=Math.min(maxH, 96);
    ctx.font=sportyFont(s); let w=ctx.measureText(txt).width*(1+SPORTY_SKEW*0.5);
    if (w>maxW) s=Math.max(12, Math.floor(s*maxW/w));
    ctx.save();
    ctx.font=sportyFont(s); ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.translate(cx, cy); ctx.transform(1,0,-SPORTY_SKEW,1,0,0);   // italic lean
    const depth=Math.max(3, Math.round(s*0.13));
    for (let k=depth;k>=1;k--){                                     // 3D extrude — dark-red copies receding down-right
      ctx.fillStyle = k>depth*0.5 ? "#3a0608" : "#5e0c10";
      ctx.fillText(txt, k*0.9, k*0.9);
    }
    const g=ctx.createLinearGradient(0,-s*0.6,0,s*0.6);             // face: bright red → gold (sporty kit colours)
    g.addColorStop(0,   "#ff5a4d"); g.addColorStop(0.45,"#ff1f2e");
    g.addColorStop(0.55,"#e4101d"); g.addColorStop(1,   "#ffcf3a");
    ctx.fillStyle=g; ctx.fillText(txt, 0, 0);
    ctx.lineWidth=Math.max(1.5,s*0.03); ctx.strokeStyle="#240305"; ctx.strokeText(txt, 0, 0);   // dark keyline
    ctx.restore();
  }

  // ---- team colours for the in-game info panel (primary = shirt, secondary contrasts it) ----
  function hexLum(hex){ const n=parseInt(hex.slice(1),16); return 0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255); }
  function colDist(a,b){ const x=parseInt(a.slice(1),16), y=parseInt(b.slice(1),16);
    const dr=((x>>16)&255)-((y>>16)&255), dg=((x>>8)&255)-((y>>8)&255), db=(x&255)-(y&255);
    return Math.sqrt(dr*dr+dg*dg+db*db); }
  function teamColors(slug){
    const t=TEAMBY[slug]||{}, prim=PAL[t.shirt]||"#c8102e", pl=hexLum(prim);
    const cands=[t.swatch_accent, t.stripe2, (t.sleeves!==t.shirt?t.sleeves:null),
                 (t.shorts!==t.shirt?t.shorts:null), (t.socks!==t.shirt?t.socks:null)];
    let sec=null;
    // pick the first kit accent that's a visibly different COLOUR from the shirt — RGB distance
    // catches same-luminance hues (e.g. red vs blue) that a luminance-only test would miss
    for (const c of cands){ if (c && PAL[c] && colDist(PAL[c],prim)>80){ sec=PAL[c]; break; } }
    if (!sec) sec = pl>140 ? "#101418" : "#ffffff";          // fallback: contrast by luminance
    // ensure target tints stay legible: a dimmer version of secondary for sub-labels
    return { primary:prim, secondary:sec, dark:pl<120 };
  }
  let teamHud = { primary:"#c8102e", secondary:"#ffffff", dark:true };
  function lighten(hex, amt){ const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
    r=Math.round(r+(255-r)*amt); g=Math.round(g+(255-g)*amt); b=Math.round(b+(255-b)*amt);

  function drawTable(){

    const tbl = standings(), mypos = myPosition();
    const fx=CAR.fixtures[CAR.idx], opp=TEAMBY[fx.opp], meName=TEAMBY[CAR.slug].name;
    if (CAR.titleOdds==null) CAR.titleOdds=computeTitleOdds();
    // ---- header: plain blue bar — SCORDAGOL · CAREER · SEASON N ----
    const HBY=4, HBH=TOUCH?40:32;
    careerBar(HBY, HBH, "CAREER", "SEASON "+CAR.season);

    // ---- Ceefax-style full-height two-column league table + clean info footer ----
    // Shared by desktop and touch (identical 924x520 stage); only the call-to-action
    // wording and the on-screen MENU button differ on touch. Vertical start is derived
    // from the header height (HBH is 8px taller on touch) so nothing collides up top.
    {
      const ht=HBY+HBH, xPad=20;
      // section header: green title left, matchday indicator far right, on a blue rule
      ctx.font=ttFont(20); ctx.fillStyle=TTX.green; ctx.textAlign="left"; ctx.fillText(activeLeagueMeta().name.toUpperCase()+" TABLE", xPad, ht+24);
      ctx.textAlign="right"; ctx.font=ttFont(16); ctx.fillStyle=TTX.yellow;
      ctx.fillText("MATCHDAY "+(CAR.idx+1)+" OF "+CAR.fixtures.length, VW-xPad, ht+24); ctx.textAlign="left";
      ctx.fillStyle="#0044bb"; ctx.fillRect(xPad,ht+30,VW-xPad*2,3);
      // two balanced columns spanning the full width with a slim centre gutter
      const colX=[44,490], blockW=394, top=ht+54, rowH=25, hdrY=ht+48, NAMEX=30;
      const CEN={ PL:120, W:92, D:66, L:40, PT:12 };   // PL (played) sits left of W D L
      ctx.font=ttFont(13); ctx.textBaseline="alphabetic";
      for (const x of colX){ const xr=x+blockW;
        ctx.fillStyle="#9aaabb";
        ctx.textAlign="left";   ctx.fillText("P", x, hdrY); ctx.fillText("TEAM", x+NAMEX, hdrY);
        ctx.textAlign="center"; ctx.fillText("W", xr-CEN.W, hdrY); ctx.fillText("D", xr-CEN.D, hdrY);
        ctx.fillText("L", xr-CEN.L, hdrY); ctx.fillText("PL", xr-CEN.PL, hdrY);
        ctx.fillStyle=TTX.yellow; ctx.fillText("PT", xr-CEN.PT, hdrY);
      }
      ctx.textAlign="left";
      ctx.fillStyle="rgba(255,255,255,0.22)"; ctx.fillRect(xPad,hdrY+5,VW-xPad*2,1);
      // centre gutter divider (teletext column rule)
      ctx.fillStyle="rgba(255,255,255,0.08)"; ctx.fillRect(VW/2-0.5, top, 1, 10*rowH);
      for (let i=0;i<tbl.length;i++){
        if (ttSub(tbl[i].name, i)===null) continue;
        const t=tbl[i], r=CAR.table[t.slug], mine=t.slug===CAR.slug;
        const col=Math.floor(i/10), row=i%10, x=colX[col], xr=x+blockW, ry=top+row*rowH, y=ry+18;
        // zebra striping + relegation-zone shading + my-team highlight
        if (i>=17){ ctx.fillStyle="rgba(150,30,30,0.26)"; ctx.fillRect(x-6,ry,blockW+12,rowH); }
        else if (row%2===1){ ctx.fillStyle="rgba(255,255,255,0.03)"; ctx.fillRect(x-6,ry,blockW+12,rowH); }
        if (mine){ ctx.fillStyle="rgba(255,255,255,0.10)"; ctx.fillRect(x-6,ry,blockW+12,rowH);
          ctx.strokeStyle="rgba(255,255,255,0.55)"; ctx.lineWidth=1.5; ctx.strokeRect(x-6+0.75,ry+0.75,blockW+12-1.5,rowH-1.5); }
        const isFirst=i===0;
        const base = isFirst ? "#ffd700" : (i<4 ? TTX.cyan : (i>=17 ? "#ff8888" : TTX.white));
        ctx.font=ttFont(16); ctx.textAlign="left";
        ctx.fillStyle=base; ctx.fillText(""+(i+1), x, y);
        let nm=t.name; while (nm.length>3 && ctx.measureText(nm).width > blockW-CEN.PL-30){ nm=nm.slice(0,-1); }
        ctx.fillStyle=base; ctx.fillText(nm, x+NAMEX, y);
        ctx.font=ttFont(15); ctx.textAlign="center";
        ctx.fillStyle=TTX.green;  ctx.fillText(""+r.w,   xr-CEN.W,  y);
        ctx.fillStyle=TTX.grey;   ctx.fillText(""+r.d,   xr-CEN.D,  y);
        ctx.fillStyle="#e08a8a";  ctx.fillText(""+r.l,   xr-CEN.L,  y);
        ctx.fillStyle=TTX.dim;    ctx.fillText(""+r.p,   xr-CEN.PL, y);
        ctx.fillStyle=isFirst?"#ffd700":TTX.yellow; ctx.fillText(""+r.pts, xr-CEN.PT, y);
        ctx.textAlign="left";
        // zone divider lines — gold under the leader, green after top-4, red above the drop zone
        if (i===0){  ctx.fillStyle="rgba(255,210,0,0.55)"; ctx.fillRect(x-6,ry+rowH-1,blockW+12,1); }
        if (i===3){  ctx.fillStyle="rgba(80,210,80,0.5)";  ctx.fillRect(x-6,ry+rowH-1,blockW+12,2); }
        if (i===16){ ctx.fillStyle="rgba(210,60,60,0.5)";  ctx.fillRect(x-6,ry+rowH-1,blockW+12,2); }
      }
      ctx.textAlign="left";
      const tblBottom = top+10*rowH;

      // ---- footer: two aligned rows — headings (FORM | POSITION | TITLE ODDS) then values
      //      (W/D/L chips | 1ST | 34%) on a shared baseline, all centred on thirds ----
      const form = (CAR.form||[]).slice(0,5).reverse();
      const c1=VW*0.25, c2=VW*0.50, c3=VW*0.75;
      const hY=tblBottom+20, vY=hY+24;
      ctx.fillStyle="rgba(255,255,255,0.12)";
      ctx.fillRect(VW*0.375,hY-10,1,(vY-hY)+22); ctx.fillRect(VW*0.625,hY-10,1,(vY-hY)+22);
      ctx.textBaseline="middle"; ctx.textAlign="center";
      ctx.font=ttFont(13); ctx.fillStyle=TTX.grey;
      ctx.fillText("FORM", c1, hY); ctx.fillText("POSITION", c2, hY);
      ctx.fillText(titleClinched()?"STATUS":"TITLE ODDS", c3, hY);
      // value row — roomy W/D/L chips with truly centred letters
      const chipW=24, chipH=22, gap=6;
      if (!form.length){ ctx.font=ttFont(16); ctx.fillStyle=TTX.dim; ctx.fillText("--", c1, vY); }
      else { let fcx = c1 - (form.length*(chipW+gap)-gap)/2;
        for (const rf of form){
          ctx.fillStyle = rf==="W"?"#1f9d49":(rf==="D"?"#5a626b":"#c43a3a");
          ctx.fillRect(fcx, vY-chipH/2, chipW, chipH);
          ctx.font=ttFont(15); ctx.fillStyle="#ffffff"; ctx.fillText(rf, fcx+chipW/2, vY+1);
          fcx += chipW+gap;
        } }
      ctx.font=ttFont(18); ctx.fillStyle=TTX.cyan; ctx.fillText(ord(mypos).toUpperCase(), c2, vY);
      if (titleClinched()){ ctx.font=ttFont(17); ctx.fillStyle=TTX.neon; ctx.fillText("★ CHAMPIONS", c3, vY); }
      else { ctx.font=ttFont(18); ctx.fillStyle=TTX.yellow; ctx.fillText(CAR.titleOdds+"%", c3, vY); }
      ctx.textBaseline="alphabetic"; ctx.textAlign="left";

      // NEXT MATCH — prominent centred panel
      const nbW=600, nbX=VW/2-nbW/2, nbY=vY+16, nbH=48;
      ctx.fillStyle="#0a1224"; ctx.fillRect(nbX,nbY,nbW,nbH);
      ctx.strokeStyle=TTX.blue; ctx.lineWidth=2; ctx.strokeRect(nbX+1,nbY+1,nbW-2,nbH-2);
      ttBar("NEXT MATCH", nbX, nbY, nbW, 18, TTX.blue, TTX.white, {center:true, size:13});
      const tag = fx.home ? " (H)" : " (A)";
      const fixtureStr = fx.home ? (meName+tag+"  v  "+opp.name) : (opp.name+"  v  "+meName+tag);
      let fsz=22; ctx.textAlign="center"; ctx.font=ttFont(fsz);
      while (ctx.measureText(fixtureStr).width > nbW-28 && fsz>12){ fsz--; ctx.font=ttFont(fsz); }
      ctx.fillStyle=TTX.white; ctx.fillText(fixtureStr, VW/2, nbY+40);

      // call-to-action / clinch button — touch taps, desktop uses keyboard
      clinchBtn=null;
      if (titleClinched()){
        const bw=460,bh=26,bx=VW/2-bw/2,by=nbY+nbH+8;
        ctx.fillStyle=TTX.neon; ctx.fillRect(bx,by,bw,bh);
        ctx.fillStyle="#06070b"; ctx.font=ttFont(14); ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText(TOUCH?"★ CHAMPIONS · TAP TO END SEASON":"★ CHAMPIONS · CLICK / E TO END SEASON", VW/2, by+bh/2+1);
        ctx.textBaseline="alphabetic"; clinchBtn={x:bx,y:by,w:bw,h:bh};
      } else if (ttCursorOn()){
        ctx.fillStyle=TTX.neon; ctx.font=ttFont(20); ctx.textAlign="center"; ctx.fillText(TOUCH?"TAP  TO  PLAY":"SPACE  /  CLICK  TO  PLAY", VW/2, nbY+nbH+22);
      }
      // ★ TROPHIES button — bottom-right (click/tap; desktop also key T)
      { const tbW=116,tbH=26,tbX=VW-tbW-10,tbY=nbY+nbH+8;
        ctx.fillStyle="rgba(0,0,10,0.55)"; ctx.fillRect(tbX,tbY,tbW,tbH);
        ctx.strokeStyle="#ffd700"; ctx.lineWidth=1; ctx.strokeRect(tbX+0.5,tbY+0.5,tbW-1,tbH-1);
        ctx.font=ttFont(13); ctx.fillStyle="#ffd700"; ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText("★ TROPHIES", tbX+tbW/2, tbY+tbH/2+1); ctx.textBaseline="alphabetic"; ctx.textAlign="left";
        trophyRoomBtn={x:tbX,y:tbY,w:tbW,h:tbH};
      }
      // ← MENU button (touch only) — bottom-left, clear of the centred CTA and ticker
      if (TOUCH){ const bbW=92,bbH=26,bbX=10,bbY=nbY+nbH+8;
        ctx.fillStyle="rgba(0,0,10,0.55)"; ctx.fillRect(bbX,bbY,bbW,bbH);
        ctx.strokeStyle=TTX.yellow; ctx.lineWidth=1; ctx.strokeRect(bbX+0.5,bbY+0.5,bbW-1,bbH-1);
        ctx.font=ttFont(13); ctx.fillStyle=TTX.yellow; ctx.textAlign="center"; ctx.textBaseline="middle";
        ctx.fillText("← MENU",bbX+bbW/2,bbY+bbH/2+1); ctx.textBaseline="alphabetic"; ctx.textAlign="left";
        touchBackBtn={x:bbX,y:bbY,w:bbW,h:bbH}; }
      drawTicker(CAR.lastResults, 510);
      ctx.textAlign="left";
    }
  }
  // horizontal scrolling ticker of last-gameweek results
  function drawTicker(items, y){
    if (!items || !items.length) return;
    ctx.fillStyle="#ff7a1e"; ctx.font=ttFont(11,"bold "); ctx.textAlign="left";   // neon orange, no background fill
    const text = "LATEST RESULTS:    " + items.join("        ") + "        ";
    const tw=ctx.measureText(text).width, off=(performance.now()/1000*55)%tw;
    ctx.save(); ctx.beginPath(); ctx.rect(0,y-15,VW,22); ctx.clip();
    for (let x=-off; x<VW; x+=tw) ctx.fillText(text, x, y);
    ctx.restore(); ctx.textAlign="center";
  }
  // ---- Smail wordmark: multicoloured parody webmail brand, drawn at any size ----
  function drawSmailMark(x, cy, px){
    const cols=["#5b8cff","#ff5252","#ffce3d","#5b8cff","#4dff7a"], word="Smail";
    ctx.font="bold "+px+"px 'Trebuchet MS','Arial',sans-serif"; ctx.textBaseline="middle"; ctx.textAlign="left";
    let gx=x;
    for (let i=0;i<word.length;i++){ ctx.fillStyle=cols[i]; ctx.fillText(word[i], gx, cy+1); gx+=ctx.measureText(word[i]).width; }
    ctx.textBaseline="alphabetic";
    return gx-x;
  }

  // ---- trophy room: Sega-style renders on cabinet shelves ----
  function drawTrophyRoom(){
    ttBar("TROPHY ROOM", 0, 12, VW, 30, TTX.blue, "#ffd700", {size:17});
    const tr=(CAR && CAR.trophies)||[];
    ctx.textAlign="right"; ctx.font=ttFont(12); ctx.fillStyle=TTX.grey;
    ctx.fillText(tr.length+" TROPH"+(tr.length===1?"Y":"IES"), VW-14, 34); ctx.textAlign="left";
    // cabinet
    ctx.fillStyle="#15100c"; ctx.fillRect(40,56,VW-80,SH-104);
    ctx.strokeStyle="#3a2a18"; ctx.lineWidth=3; ctx.strokeRect(41.5,57.5,VW-83,SH-107);
    const shelfY=[226,408], shX=72, shW=VW-144;
    for (const sy of shelfY){
      ctx.fillStyle="#54381c"; ctx.fillRect(shX,sy,shW,9);
      ctx.fillStyle="#33220f"; ctx.fillRect(shX,sy+9,shW,4);
    }
    if (!tr.length){
      ctx.textAlign="center";
      ctx.font=ttFont(20); ctx.fillStyle=TTX.grey; ctx.fillText("NOTHING IN THE CABINET YET.", VW/2, 150);
      ctx.font=ttFont(14); ctx.fillStyle=TTX.dim;  ctx.fillText("EARLY DOORS. TAKE EACH GAME AS IT COMES.", VW/2, 178);
    } else {
      const TIMG={league:IMG.trophyL, cup:IMG.trophyC, euro:IMG.trophyE, intl:IMG.trophyI};
      const TLBL={league:"LGE", cup:"CUP", euro:"EUR", intl:"WLD"};
      const perShelf=8, tw=66, th=88, slot=96;
      tr.slice(0,perShelf*2).forEach((tp,i)=>{

        const x0=VW/2-(onShelf*slot)/2, x=x0+(i%perShelf)*slot+(slot-tw)/2, yb=shelfY[sh];
        const im=TIMG[tp.t]||IMG.trophyL;
        if (im && im.naturalWidth) ctx.drawImage(im, x, yb-th, tw, th);
        pxText((TLBL[tp.t]||"")+(tp.s?" S"+tp.s:""), x+tw/2, yb+24, 11, "#ffd700", 'c', 'm');
      });
      if (tr.length>perShelf*2){ ctx.textAlign="center"; ctx.font=ttFont(13); ctx.fillStyle=TTX.grey;
        ctx.fillText("+"+(tr.length-perShelf*2)+" MORE IN STORAGE", VW/2, SH-60); }
    }
    ctx.textAlign="center"; ctx.font=ttFont(12); ctx.fillStyle=TTX.grey;
    if (!TOUCH) ctx.fillText("ESC / SPACE  BACK", VW/2, SH-22);
    ctx.textAlign="left";
  }
  // ---- flag renderer: tiny geometric flags from world.json specs ----
  function drawFlag(x,y,w,h,f){
    const c=(f&&f.c)||["#888","#aaa","#888"], t=(f&&f.t)||"h";
    ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
    if (t==="v"){ for(let i=0;i<3;i++){ ctx.fillStyle=c[i]||c[0]; ctx.fillRect(x+i*w/3,y,w/3+1,h); } }
    else if (t==="v2"){ ctx.fillStyle=c[0]; ctx.fillRect(x,y,w*0.4,h); ctx.fillStyle=c[1]; ctx.fillRect(x+w*0.4,y,w*0.6,h); }
    else if (t==="h"){ for(let i=0;i<3;i++){ ctx.fillStyle=c[i]||c[0]; ctx.fillRect(x,y+i*h/3,w,h/3+1); } }
    else if (t==="spain"){ ctx.fillStyle=c[0]; ctx.fillRect(x,y,w,h); ctx.fillStyle=c[1]; ctx.fillRect(x,y+h/4,w,h/2); }
    else if (t==="cross"){ ctx.fillStyle=c[0]; ctx.fillRect(x,y,w,h); ctx.fillStyle=c[1];
      ctx.fillRect(x+w*0.38,y,w*0.20,h); ctx.fillRect(x,y+h*0.38,w,h*0.24); }
    else if (t==="saltire"){ ctx.fillStyle=c[0]; ctx.fillRect(x,y,w,h);
      ctx.strokeStyle=c[1]; ctx.lineWidth=Math.max(3,h*0.2);
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w,y+h); ctx.moveTo(x+w,y); ctx.lineTo(x,y+h); ctx.stroke(); }
    else if (t==="diamond"){ ctx.fillStyle=c[0]; ctx.fillRect(x,y,w,h); ctx.fillStyle=c[1];
      ctx.beginPath(); ctx.moveTo(x+w/2,y+h*0.12); ctx.lineTo(x+w*0.88,y+h/2); ctx.lineTo(x+w/2,y+h*0.88); ctx.lineTo(x+w*0.12,y+h/2); ctx.closePath(); ctx.fill();
      ctx.fillStyle=c[2]||"#1b3f9b"; ctx.beginPath(); ctx.arc(x+w/2,y+h/2,h*0.18,0,2*Math.PI); ctx.fill(); }
    else if (t==="disc"){ ctx.fillStyle=c[0]; ctx.fillRect(x,y,w,h); ctx.fillStyle=c[1];
      ctx.beginPath(); ctx.arc(x+w/2,y+h/2,h*0.28,0,2*Math.PI); ctx.fill(); }
    else if (t==="tri"){ ctx.fillStyle=c[0]; ctx.fillRect(x,y,w,h/2); ctx.fillStyle=c[1]; ctx.fillRect(x,y+h/2,w,h/2);
      ctx.fillStyle=c[2]; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w*0.45,y+h/2); ctx.lineTo(x,y+h); ctx.closePath(); ctx.fill(); }
    else if (t==="usa"){ for(let i=0;i<7;i++){ ctx.fillStyle=i%2?c[1]:c[0]; ctx.fillRect(x,y+i*h/7,w,h/7+1); }
      ctx.fillStyle=c[2]; ctx.fillRect(x,y,w*0.42,h*0.5);
      ctx.fillStyle="#fff"; for(let r=0;r<3;r++) for(let q=0;q<4;q++) ctx.fillRect(x+3+q*w*0.095, y+2+r*h*0.14, 2, 2); }
    ctx.restore();
    ctx.strokeStyle="rgba(255,255,255,0.5)"; ctx.lineWidth=1; ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
  }

  function wrapText(text, maxW, font){
    ctx.font=font; const out=[];
    for (const para of text.split("\n")){
      if (para===""){ out.push(""); continue; }
      let line="";
      for (const w of para.split(" ")){ const test=line?line+" "+w:w;
        if (ctx.measureText(test).width>maxW && line){ out.push(line); line=w; } else line=test; }
      if (line) out.push(line);
    }
    return out;
  }

  function drawVicPortrait(x,y,w,h){
    ctx.fillStyle="#000000"; ctx.fillRect(x,y,w,h);                       // black backing (matches the trace's pure-black bg)
    const prev=ctx.imageSmoothingEnabled; ctx.imageSmoothingEnabled=false;
    if (vicImg && vicImg.complete && vicImg.naturalWidth){                // primary: the traced reference portrait
      const s=Math.min(w/vicImg.naturalWidth, h/vicImg.naturalHeight);    // contain-fit (no crop), pixel-crisp
      const dw=vicImg.naturalWidth*s, dh=vicImg.naturalHeight*s;
      ctx.drawImage(vicImg, Math.round(x+(w-dw)/2), Math.round(y+(h-dh)/2), Math.round(dw), Math.round(dh));
    } else {                                                              // fallback: the procedural bust
      const spr=vicSprite();
      if (spr){ const pad=Math.round(Math.min(w,h)*0.05), s=Math.max(1, Math.floor(Math.min((w-2*pad)/spr.width, (h-2*pad)/spr.height)));
        const dw=spr.width*s, dh=spr.height*s;
        ctx.drawImage(spr, Math.round(x+(w-dw)/2), Math.round(y+(h-dh)/2), dw, dh); }
    }
    ctx.imageSmoothingEnabled=prev;
  }

    const tx=boxX+boxW+50, tw=VW-tx-50, font=ttFont(18), reveal=agentRevealed();
    const lines=wrapText(agentText.slice(0,reveal), tw, font);            // greedy wrap is prefix-stable
    ctx.font=font; ctx.fillStyle=TTX.white; ctx.textAlign="left"; ctx.textBaseline="alphabetic";

  // ================= MULTIPLAYER HORSE (leader sets a challenge; fail to match = a letter) =================
  // Real HORSE: the leader takes ONE delivery. If they SCORE it, every other active player must
  // score the SAME seeded delivery or take the next letter of the word (tracked independently).
  // The leader keeps setting challenges until they miss, then leadership passes to the next player.
  // Spell the word and you're out; last player standing wins. 2-6 players, pass-and-play.
  let H=null;
  let hCount=2, hNames=["","","","","",""], hWord="HORSE", hField=0, horseStartBtn=null, hRowGeo=[];   // setup state (hRowGeo: per-draw row boxes, keeps touch hit-test in sync with the adaptive layout)
  const HCOLS=["#5bd0ff","#ff8a5b","#7dff8a","#ffd24a","#c78bff","#ff7ab0"];   // per-player colours
  const HORSE_MIN=2, HORSE_MAX=6;
  function beginHorse(){
    const word=(hWord.trim().toUpperCase().replace(/[^A-Z]/g,"")).slice(0,8) || "HORSE";
    const players=[];
    for (let i=0;i<hCount;i++) players.push({ name:(hNames[i]||"").trim()||("PLAYER "+(i+1)), letters:0, out:false });
    const lp=TEAMBY["Liverpool"]||TEAMS[0];                           // teams fixed for the whole game (no change between shots)
    let opp=TEAMS[(Math.random()*TEAMS.length)|0]; if(!opp||opp.slug===lp.slug) opp=TEAMS[(TEAMS.indexOf(opp)+1)%TEAMS.length]||lp;
    H={ players, word, L:word.length, leader:0, phase:'lead', current:0, followQ:[], seed:null, setShots:0, winner:null, event:null,
        myClub:{slug:lp.slug,name:lp.name,rating:lp.rating}, opp:{slug:opp.slug,name:opp.name,rating:opp.rating} };
    state=ST.HORSEPASS;
  }
  function horseActiveCount(){ return H.players.filter(p=>!p.out).length; }
  function horseNextActive(i){ let j=i; for(let k=0;k<H.players.length;k++){ j=(j+1)%H.players.length; if(!H.players[j].out) return j; } return i; }
  function startHorseTurn(){
    GMODE="horse"; CAR=null; H.event=null;                           // clear any letter/loss overlay
    MYCLUB=H.myClub; OPPONENT={ slug:H.opp.slug, name:H.opp.name, rating:H.opp.rating, home:true };   // fixed teams all game
    if (H.phase==='lead') H.seed=((Date.now()>>>0) ^ (H.setShots++ * 2654435761))>>>0;   // leader: a fresh delivery

  }
  function horseTurnDone(){ horseResolve(M.goals>0); }                // a goal = the challenge is made
  // Advance the state machine given whether the current player scored. No DOM -> unit-testable via __dbg.
  function horseResolve(made){
    if (H.phase==='lead'){
      if (made){                                                      // challenge set: queue the other active players
        H.followQ=[]; let j=H.leader;
        for (let k=0;k<H.players.length;k++){ j=(j+1)%H.players.length; if(j!==H.leader && !H.players[j].out) H.followQ.push(j); }
        if (!H.followQ.length){ H.winner=H.leader; H.winAt=performance.now(); state=ST.HORSEEND; return; }   // leader is the only one left
        H.phase='follow'; H.current=H.followQ.shift();
      } else {                                                        // leader missed: pass leadership, no letters
        H.leader=horseNextActive(H.leader); H.phase='lead'; H.current=H.leader;
      }
    } else {                                                          // a follower responding to the leader's goal

        const who=H.current, p=H.players[who]; p.letters++;

          if (horseActiveCount()===1){ H.winner=H.players.findIndex(x=>!x.out); H.winAt=performance.now(); state=ST.HORSEEND; return; } }
      }
      if (H.followQ.length) H.current=H.followQ.shift();
      else { H.phase='lead'; H.current=H.leader; }                    // challenge done: same leader sets again

    state=ST.HORSEPASS;
  }

  // ================= STADIUM LAYERS (docs/STADIUM_ASSET_SPEC.md) =================
  // L0 backdrop (924x400 art, no goal/boards) -> L1 hoardings -> L2 goal+net -> sprites.
  // All purely cosmetic: the only pixel-sensitive system is the keeper hit-test, which

  function drawBackdrop() {        // view space (drawn before translate(OX))

  // L1: 7 static perimeter boards across the full view (early-2000s style). A board that
  // hasn't loaded gets a procedural house board — the band must never be empty.
  function drawHoardings() {       // view space
    if (!matchBoards.length && ADS.length) pickBoards(Math.random);   // manifest arrived after match start
    for (let i=0;i<HOARD_N;i++){
      const x=i*HOARD_SLOT, id=matchBoards[i], im=id && ADS_IMG[id];
      if (im && im.complete && im.naturalWidth) ctx.drawImage(im, x, HOARD_Y, HOARD_SLOT, HOARD_H);

        ctx.fillText("SCORDAGOL", x+HOARD_SLOT/2, HOARD_Y+22); ctx.textAlign="left";
