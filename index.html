  const HORSE_MIN=2, HORSE_MAX=6;
  function beginHorse(){
    const word=(hWord.trim().toUpperCase().replace(/[^A-Z]/g,"")).slice(0,8) || "HORSE";
    const players=[];
    for (let i=0;i<hCount;i++) players.push({ name:(hNames[i]||"").trim()||("PLAYER "+(i+1)), letters:0, out:false });
    const lp=TEAMBY["Liverpool"]||TEAMS[0];                           // teams fixed for the whole game (no change between shots)
    let opp=TEAMS[(Math.random()*TEAMS.length)|0]; if(!opp||opp.slug===lp.slug) opp=TEAMS[(TEAMS.indexOf(opp)+1)%TEAMS.length]||lp;
    H={ players, word, L:word.length, leader:0, phase:'lead', current:0, followQ:[], seed:null, setShots:0, winner:null, event:null,
        myClub:{slug:lp.slug,name:lp.name,rating:lp.rating}, opp:{slug:opp.slug,name:opp.name,rating:opp.rating} };
    state=ST.HORSEPASS;
  }
  function horseActiveCount(){ return H.players.filter(p=>!p.out).length; }
  function horseNextActive(i){ let j=i; for(let k=0;k<H.players.length;k++){ j=(j+1)%H.players.length; if(!H.players[j].out) return j; } return i; }
  function startHorseTurn(){
    GMODE="horse"; CAR=null; H.event=null;                           // clear any letter/loss overlay
    MYCLUB=H.myClub; OPPONENT={ slug:H.opp.slug, name:H.opp.name, rating:H.opp.rating, home:true };   // fixed teams all game
    if (H.phase==='lead') H.seed=((Date.now()>>>0) ^ (H.setShots++ * 2654435761))>>>0;   // leader: a fresh delivery
    const seed=H.seed>>>0;                                            // followers replay the leader's exact seed
    loadKits(MYCLUB.slug, OPPONENT.slug, ()=>startMatch({seed:seed, balls:1}));
  }
  function horseTurnDone(){ horseResolve(M.goals>0); }                // a goal = the challenge is made
  // Advance the state machine given whether the current player scored. No DOM -> unit-testable via __dbg.
  function horseResolve(made){
    if (H.phase==='lead'){
      if (made){                                                      // challenge set: queue the other active players
        H.followQ=[]; let j=H.leader;
        for (let k=0;k<H.players.length;k++){ j=(j+1)%H.players.length; if(j!==H.leader && !H.players[j].out) H.followQ.push(j); }
        if (!H.followQ.length){ H.winner=H.leader; H.winAt=performance.now(); state=ST.HORSEEND; return; }   // leader is the only one left
        H.phase='follow'; H.current=H.followQ.shift();
      } else {                                                        // leader missed: pass leadership, no letters
        H.leader=horseNextActive(H.leader); H.phase='lead'; H.current=H.leader;
      }
    } else {                                                          // a follower responding to the leader's goal
      if (!made){
        const who=H.current, p=H.players[who]; p.letters++;
        H.event={type:'letter', who, idx:p.letters-1, t:performance.now()};   // drives the letter-slam overlay
        if (p.letters>=H.L){ p.out=true; H.event={type:'out', who, t:performance.now()};   // big "X IS A WORD" banner
          if (horseActiveCount()===1){ H.winner=H.players.findIndex(x=>!x.out); H.winAt=performance.now(); state=ST.HORSEEND; return; } }
      }
      if (H.followQ.length) H.current=H.followQ.shift();
      else { H.phase='lead'; H.current=H.leader; }                    // challenge done: same leader sets again
    }
    state=ST.HORSEPASS;
  }

  // L0 backdrop (924x400 art, no goal/boards) -> L1 hoardings -> L2 goal+net -> sprites.

  // L1: 7 static perimeter boards across the full view (early-2000s style). A board that

  function drawHoardings() {       // view space
    if (!matchBoards.length && ADS.length) pickBoards(Math.random);   // manifest arrived after match start
    for (let i=0;i<HOARD_N;i++){
      const x=i*HOARD_SLOT, id=matchBoards[i], im=id && ADS_IMG[id];

      else {

        ctx.font=ttFont(13); ctx.textAlign="center"; ctx.fillStyle=TTX.neon;

  // L2: procedural goal + net — pixel-exact at LPOST/RPOST/BARH by construction, finally
  // animatable (HANDOVER §3.4): the net bulges on a goal, the frame shakes on woodwork.
  // Drawn INSIDE the leftFooted mirror so the bulge follows the (mirrored) ball.
  let netBulgeT=0, netBulgeX=GCX, netBulgeY=120, barShakeT=0;   // decay in tick()
  function drawGoal() {            // field space
    const L=LPOST, R=RPOST, T=KEEPER_STAGE_Y-BARH, B=KEEPER_STAGE_Y;   // 135,430,58,163
    const bl=L+24, br=R-24, bt=T+12, bb=B-3;        // back frame (net depth at this perspective)
    let sx=0, sy=0;
    if (barShakeT>0){ const k=barShakeT/0.35; sx=Math.sin(barShakeT*70)*2.6*k; sy=Math.cos(barShakeT*53)*1.4*k; }
    ctx.save(); ctx.translate(sx, sy);
    // mesh displacement: radial push from the ball's entry point, decaying after a goal
    const amp = netBulgeT>0 ? 9*(netBulgeT/0.5) : 0;
    const dis = (x,y)=>{ if (!amp) return [x,y];
      const dx=x-netBulgeX, dy=y-netBulgeY, d2=dx*dx+dy*dy, r2=55*55;
      if (d2>r2) return [x,y];
      const f=amp*(1-d2/r2), d=Math.sqrt(d2)||1;
      return [x+dx/d*f*0.5, y-f];                   // outward + up-back
    };
    const net=(x0,y0,x1,y1,n)=>{                    // displaced polyline
      ctx.beginPath();
      for (let i=0;i<=n;i++){ const p=dis(x0+(x1-x0)*i/n, y0+(y1-y0)*i/n);
        i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); }
      ctx.stroke();
    };
    ctx.strokeStyle="rgba(235,238,240,0.32)"; ctx.lineWidth=1;
    for (let x=bl;x<=br;x+=9) net(x,bt,x,bb,6);                            // back panel mesh
    for (let y=bt;y<=bb;y+=9) net(bl,y,br,y,8);
    for (let x=L;x<=R;x+=14){ const k=(x-L)/(R-L); net(x,T, bl+(br-bl)*k,bt, 4); }     // roof panel
    for (let y=T;y<=B;y+=14){ const k=(y-T)/(B-T);                                      // side panels

        role:roleFor(CAR.trust==null?100:CAR.trust), tier:activeLeagueTier(), leagueId:CAR.leagueId,
        objective:CAR.objective, verdict:CAR.verdict,
        unlocks:{ leagues:Object.keys(UNLOCKS.leagues), freestart:UNLOCKS.freestart } }
        : { unlocks:{ leagues:Object.keys(UNLOCKS.leagues), freestart:UNLOCKS.freestart } }; },
      setJourney: function(o){ o=o||{}; if(o.rep!=null)CAR.rep=o.rep; if(o.energy!=null)CAR.energy=o.energy;
        if(o.trust!=null)CAR.trust=o.trust; return {rep:CAR.rep, energy:CAR.energy, trust:CAR.trust}; },
      matchPlanSim: function(){ const ev=peekEvent(); if(!ev) return null;
        const o=eventSetup(ev); return { ev:ev.t, balls:o.balls, targetBalls:o.targetBalls, role:o.role, note:o.note }; },
      offersSim: function(){ return (CAR.offers||[]).map(o=>({slug:o.slug, rating:o.rating, leagueId:o.leagueId})); },
      loadCareerSim: function(){ CAR=loadCareer(); if(CAR) setActiveLeague(CAR.leagueId);
        return CAR && { rep:CAR.rep, energy:CAR.energy, trust:CAR.trust, leagueId:CAR.leagueId, season:CAR.season }; },
      // ---- E8 "The Life" harness ----
      lifeInfo: function(){ return CAR ? { monies:CAR.monies, earned:CAR.earned, vicCut:vicCutPct(),
        energy:CAR.energy, lastEarn:CAR.lastEarn||null, adSeen:!!CAR.adSeen,
        trainer:(CAR.trainer&&CAR.trainer.games>0)?{id:CAR.trainer.id, games:CAR.trainer.games, rec:trainerRec()}:null,
        sponsor:CAR.sponsor?{name:CAR.sponsor.name, left:CAR.sponsor.left}:null,
        items:CAR.items?Object.keys(CAR.items):[], lifeBonus:lifeBonus(), effRep:effRep(),
        contract:CAR.contract||null, ledger:CAR.ledger||null, prize:CAR.prize||null,
        msgs:(CAR.msgs||[]).map(m=>m.who), agentWho:(state===ST.AGENT?agentWho:null) } : null; },
      tipSim: function(t){ if (t===false){ hoverTip=null; return true; }   // stage/clear a hover tooltip (screenshots)
        hoverTip=t||"YOUR LEGS. EVERY MATCH DRAINS ENERGY. BELOW 60% THE COACH GIVES YOU FEWER BALLS FOR THE SAME TARGET."; hoverX=360; hoverY=120; return true; },
      setMonies: function(n){ CAR.monies=n|0; return CAR.monies; },
      buyShakeSim: function(i){ return buyShake(i|0); },
      shakePriceSim: function(i){ return shakePrice(SHAKES[i|0]); },
      hireTrainerSim: function(id){ return hireTrainer(id); },
      buyItemSim: function(id){ return buyLifestyle(id); },
      signSponsorSim: function(){ return signSponsor(); },
      watchAdSim: function(){ return watchAdReward(); },
      popMsgSim: function(){ const m=(CAR.msgs||[]).shift(); return m||null; },
      contractSim: function(){ showContract(null); return {state}; },   // audit: stage the signing ceremony
      trophySim: function(n){ CAR.trophies=[]; const kinds=["league","cup","euro","intl"];   // audit: fill the cabinet
        for (let i=0;i<(n||6);i++) CAR.trophies.push({t:kinds[i%4], s:i+1, club:CAR.slug});
        return CAR.trophies.length; },
      resetUnlocksSim: function(){ UNLOCKS={leagues:{}, freestart:false}; saveUnlocks(); return true; },   // audit: stage the locked journey map
      forceUnlocksSim: function(o){ o=o||{}; if(o.freestart) UNLOCKS.freestart=true; for (const id of (o.leagues||[])) UNLOCKS.leagues[id]=true; saveUnlocks(); return true; },
      stageClubSelSim: function(league){ pendingMode="career"; pendingLeague=league||"ENG"; setActiveLeague(pendingLeague); menuSel=0; return TEAMS.length; },
      newCareerSim: function(nation, league, slug){ GMODE="career"; setActiveLeague(league||"ENG"); newCareer("TEST", slug||(TEAMS[0]&&TEAMS[0].slug)||"Liverpool", nation||"Brazil", league||"ENG"); return {cal:CAR.cal.length, leagueId:CAR.leagueId, teams:TEAMS.length, slug:CAR.slug, state}; },
      leaguesSim: function(){ return leagueList().map(id=>({id, name:LEAGUE_META[id].name, teams:(LEAGUES[id]||[]).length})); },
      renderStateSim: function(s){ const prev=state; state=ST[s]||s; try{ render(); } finally { state=prev; } return true; },
      // dev/audit: stage a Slick Vic agent screen with the text fully revealed (which='intro'|'team'|'callup_yes'|'callup_no')
      agentSim: function(which){
        if (which==='team'){ agentTeamPick(); }
        else if (which==='callup_yes'){ showAgent(VIC_LINES.callup, null); }
        else if (which==='callup_no'){ showAgent(VIC_LINES.nocall, null); }
        else if (which==='trainer'){ showAgent(TRAINERS[2].hire, null, 'proteina'); }   // longest trainer speech = wrap worst case
        else { agentIntro(); }
        agentSkip=true;   // reveal all text so the layout audit sees the full wrapped block
        return {state, len:agentText.length, pages:agentPages.length};
      },
      euroSim: function(){ return CAR.euro ? {comp:CAR.euro.comp, group:CAR.euro.group.slice(), sfOpp:CAR.euro.sfOpp, fOpp:CAR.euro.fOpp, mine:CAR.slug} : null; },
      // HORSE harness: drive the state machine without playing real shots (made = scored the delivery)
      horseStart: function(names, word){ hCount=Math.max(HORSE_MIN,Math.min(HORSE_MAX,(names&&names.length)||2)); hNames=(names||[]).slice(0,6); while(hNames.length<6) hNames.push(""); hWord=word||"HORSE"; beginHorse(); return horseSnap(); },
      horsePlay: function(scored){ horseResolve(!!scored); return horseSnap(); },
      horseState: function(){ return horseSnap(); },
      // CLASSIC harness: set up N players then feed each player's final score (no real shots)
      classicStart: function(names){ mpMode="classic"; hCount=Math.max(HORSE_MIN,Math.min(HORSE_MAX,(names&&names.length)||2));
        hNames=(names||[]).slice(0,6); while(hNames.length<6) hNames.push(""); beginClassic(); return classicSnap(); },
      classicPlay: function(score){ M.score=score|0; classicTurnDone(); return classicSnap(); },
      classicState: function(){ return classicSnap(); },
      buildKitsTest: function(){
        OPPONENT={slug:"Everton",name:"Everton",rating:8,home:true};
        loadKits("Liverpool","Everton",null);
        return { striker:!!SPRITES.striker, def:!!SPRITES.defender, gk:!!SPRITES.keeper, ready:kitsReady };
      },
      careerInfo: function(){ return { season:CAR.season, trophies:(CAR.trophies||[]).map(t=>t.t), caps:CAR.caps||0,
        nextEuro:CAR.nextEuro, cup:CAR.cup&&{round:CAR.cup.round,out:CAR.cup.out,won:CAR.cup.won},
        euro:CAR.euro&&CAR.euro.stage, pos:myPosition(), pts:CAR.table[CAR.slug].pts }; },
      nextSeasonSim: function(slug, league){ nextSeason(slug||null, league||null); return { season:CAR.season, euro:!!CAR.euro, cal:CAR.cal.length, leagueId:CAR.leagueId, slug:CAR.slug, trust:CAR.trust, state }; },
      setMan: function(x){ manX = x; },
      pause: togglePause,
      step: function(n){ for(var i=0;i<(n||1);i++) swfFrame(); return {state,xball:Math.round(xball),yball:Math.round(yball),z:Math.round(z),booted,kicked,manFinished,dbx:Math.round(dbx),dive,no_dive,divedirn,hk:hitkeeper}; },
      forceShot: function(x0,dbxv,zv,keepDef){   // deterministic flight for testing resolution
        countdownT=0; setTargets(); booted=true; innet=false; bounced=1;
        xball=x0; yball=250; z=zv; dbx=dbxv; dby=zv; ybit=YBIT; checked=false;
        dive=false; no_dive=true; divedirn="up"; destination=0; end=0; sc=0;
        kicked=true; cchecked=true; manFinished=true; held=false;
        hitkeeper=0; hitbar=false; lposthit=false; rposthit=false; leftcorner=0; rightcorner=0; topnet=0;
        keeperPose={x:KEEPER_START_X,dir:"up",anim:"idle",frame:1};
        if(!keepDef) defenders.forEach(d=>d.chk=true); window.__rs=null; window.__df=[]; state=ST.FLIGHT;
      },
      vars: function(){ return { state, paused, xball:Math.round(xball), yball:Math.round(yball), z:Math.round(z),
        booted, dive, no_dive, divedirn, kAnim:keeperPose.anim, kFrame:keeperPose.frame, kx:Math.round(keeperPose.x),
        manX:Math.round(manX), mouseTargetX:(mouseTargetX==null?null:Math.round(mouseTargetX)),
        leftFooted, matchEndText, score:M.score }; },
      forcePause: function(){ paused=!paused; return paused; },
      setLeft: function(b){ leftFooted=!!b; return leftFooted; },
      // Measure the keeper sprite's exact pixel bbox as savedCheck() sees it (logical coords).
      keeperExtent: function(frameNum, kx){
        keeperPose.frame=frameNum; if(kx!=null) keeperPose.x=kx;
        offCtx.setTransform(1,0,0,1,0,0); offCtx.clearRect(0,0,SW,420); drawKeeperTo(offCtx);
        const d=offCtx.getImageData(0,0,SW,420).data;
        let minx=9999,maxx=-1,miny=9999,maxy=-1;
        for(let y=0;y<420;y++)for(let x=0;x<SW;x++){ if(d[(y*SW+x)*4+3]>16){ if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y; } }
        return {frame:frameNum, kx:Math.round(keeperPose.x), minx,maxx,miny,maxy};
      },
      // Deterministic serve (fixed velocity/angle), real contact path, no menu needed.
      serve: function(vel,ang){
        setTargets();
        velocity=(vel||20); angle=(ang||37); cangle=Math.cos(angle*DEG); sangle=Math.sin(angle*DEG);
        t=0; bounce=0; bounced=1; booted=false; innet=false; ay=0;
        xball=0; yball=SERVE_Y; z=0; dbx=0; dby=0; ybit=YBIT; yscale=93;
        checked=false; dive=false; no_dive=true; divedirn="up"; destination=0; keeperX=KEEPER_START_X;
        kicked=false; cchecked=false; kickTick=0; manFinished=false; complete_miss=false; end=0; sc=0;
        hitkeeper=0; held=false; hitbar=false; lposthit=false; rposthit=false;
        leftcorner=0; rightcorner=0; topnet=0; znet=0; manKicking=false; manKickT=0;
        keeperPose={ x:KEEPER_START_X, dir:"up", anim:"idle", frame:1 };
        defenders=[
          { ox:117.95, oy:210.25, sx:1.0000, sy:1.0000, thr:240, mag:10, sign:-1, chk:false, variant:0 },
          { ox: 27.60, oy:163.35, sx:0.8982, sy:0.8960, thr:200, mag:20, sign:-1, chk:false, variant:1 },
          { ox:471.15, oy:157.75, sx:0.8234, sy:0.8264, thr:200, mag:10, sign:+1, chk:false, variant:2 } ];
        M.score=0; M.attempts=10; manX=MAN_START_X; mouseTargetX=null; window.__rs=null; clearResult(); state=ST.SERVE;
      },
      // Run ONE real shot: serve, position man, trigger kick at tick `kt`, step to result. Returns the outcome.
      realShot: function(manXpos, kt, vel, ang, noDef){
        this.serve(vel,ang); manX=manXpos;
        if (noDef) defenders.forEach(d=>d.chk=true);
        let contactX=null, contactDbx=null, contactZ=null;
        for (let i=0;i<260;i++){
          if (i===kt) triggerKick();
          const wasBooted=booted; swfFrame();
          if (!wasBooted && booted){ contactX=Math.round(xball); contactDbx=Math.round(dbx); contactZ=Math.round(z); }
          if (state===ST.RESULT || state===ST.OVER) break;
        }
        const rs = window.__rs||{};
        return { kt, connected:!!contactX, contactX, contactDbx, contactZ,
                 finalx:rs.finalx, zres:rs.z, hk:rs.hk, innet:rs.innet, rp:rs.rp, lp:rs.lp, bar:rs.bar,
                 result:resultText, scored:M.score };
      },
      // Sweep all kick timings for a manX; report only CONNECTED shots, tagging wide/over verdicts.
      sweep: function(manXpos, vel, ang, noDef){
        const out=[];
        for (let kt=0; kt<46; kt++){
          const r=this.realShot(manXpos, kt, vel, ang, noDef);
          if (!r.connected) continue;
          const fx=r.finalx, zz=r.zres;
          const wide = (fx!=null) && (fx>RPOST+POSTTOL || fx<LPOST-POSTTOL);
          const over = (zz!=null) && (zz>BARH);
          out.push({kt, cX:r.contactX, cDbx:r.contactDbx, fx, z:zz, hk:r.hk, net:r.innet?1:0,
                    wide:wide?1:0, over:over?1:0, res:r.result, sc:r.scored});
        }
        return out;
      }
    };
  }
})();

// ---- PWA: register the service worker (installable / "Add to Home Screen" + offline). Guarded
// with typeof so the Node smoke harness (no `navigator`) skips it; http(s) only (not file://).
if (typeof navigator !== "undefined" && navigator.serviceWorker && location.protocol.indexOf("http") === 0) {
  var isLocalDev = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  if (isLocalDev) {
    // LOCAL DEV: never let a service worker cache stale assets (it bit us twice). Unregister any existing
    // SW + wipe its caches so a plain reload always serves the freshest files. If a SW was controlling this
    // load (so the assets you're seeing may be cached), reload ONCE after cleanup — guarded by a session
    // flag so it can never loop. Production (GitHub Pages) still registers the SW normally below.
    var hadController = !!navigator.serviceWorker.controller;
    Promise.all([
      navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }).catch(function () {}),
      (window.caches && caches.keys) ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }).catch(function () {}) : null
    ]).then(function () {
      if (hadController && !sessionStorage.getItem("sw_cleared")) { sessionStorage.setItem("sw_cleared", "1"); location.reload(); }
    });
  } else {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (e) { try { console.warn("SW register failed:", e); } catch (_) {} });
    });
  }
}
