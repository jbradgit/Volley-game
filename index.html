  // L2: procedural goal + net — pixel-exact at LPOST/RPOST/BARH by construction, finally
  // animatable (HANDOVER §3.4): the net bulges on a goal, the frame shakes on woodwork.
  // Drawn INSIDE the leftFooted mirror so the bulge follows the (mirrored) ball.
  let netBulgeT=0, netBulgeX=GCX, netBulgeY=120, barShakeT=0;   // decay in tick()
  function drawGoal() {            // field space
    const L=LPOST, R=RPOST, T=KEEPER_STAGE_Y-BARH, B=KEEPER_STAGE_Y;   // 135,430,58,163
    const bl=L+24, br=R-24, bt=T+12, bb=B-3;        // back frame (net depth at this perspective)
    let sx=0, sy=0;
    if (barShakeT>0){ const k=barShakeT/0.35; sx=Math.sin(barShakeT*70)*2.6*k; sy=Math.cos(barShakeT*53)*1.4*k; }
    ctx.save(); ctx.translate(sx, sy);
    // mesh displacement: radial push from the ball's entry point, decaying after a goal
    const amp = netBulgeT>0 ? 9*(netBulgeT/0.5) : 0;
    const dis = (x,y)=>{ if (!amp) return [x,y];
      const dx=x-netBulgeX, dy=y-netBulgeY, d2=dx*dx+dy*dy, r2=55*55;
      if (d2>r2) return [x,y];
      const f=amp*(1-d2/r2), d=Math.sqrt(d2)||1;
      return [x+dx/d*f*0.5, y-f];                   // outward + up-back
    };
    const net=(x0,y0,x1,y1,n)=>{                    // displaced polyline
      ctx.beginPath();
      for (let i=0;i<=n;i++){ const p=dis(x0+(x1-x0)*i/n, y0+(y1-y0)*i/n);
        i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]); }
      ctx.stroke();
    };
    ctx.strokeStyle="rgba(235,238,240,0.32)"; ctx.lineWidth=1;
    for (let x=bl;x<=br;x+=9) net(x,bt,x,bb,6);                            // back panel mesh
    for (let y=bt;y<=bb;y+=9) net(bl,y,br,y,8);
    for (let x=L;x<=R;x+=14){ const k=(x-L)/(R-L); net(x,T, bl+(br-bl)*k,bt, 4); }     // roof panel
    for (let y=T;y<=B;y+=14){ const k=(y-T)/(B-T);                                      // side panels
      net(L,y, bl, bt+(bb-bt)*k, 4); net(R,y, br, bt+(bb-bt)*k, 4); }
    ctx.strokeStyle="rgba(230,232,235,0.5)"; ctx.lineWidth=2;              // rear skeleton frame
    ctx.strokeRect(bl, bt, br-bl, bb-bt);
    // cast shadows FIRST (under the frame): thin angled strips on the grass, not blobs
    ctx.fillStyle="rgba(10,22,12,0.26)";
    for (const px of [L,R]){
      ctx.beginPath(); ctx.moveTo(px-3.5, B); ctx.lineTo(px+3.5, B);
      ctx.lineTo(px+3.5+15, B+4.5); ctx.lineTo(px-3.5+15, B+4.5); ctx.closePath(); ctx.fill();
    }
    // front frame — 16-bit shaded tubes: white core, bright left/top edge, grey right/bottom
    const PW=7;
    ctx.fillStyle="#f4f6f7"; ctx.fillRect(L-PW/2, T-PW/2, (R-L)+PW, PW);    // crossbar core
    ctx.fillStyle="#ffffff"; ctx.fillRect(L-PW/2, T-PW/2+0.5, (R-L)+PW, 2); // bar top highlight
    ctx.fillStyle="#aeb8bf"; ctx.fillRect(L-PW/2, T+PW/2-2, (R-L)+PW, 2);   // bar bottom shade
    for (const px of [L,R]){
      ctx.fillStyle="#f4f6f7"; ctx.fillRect(px-PW/2, T-PW/2, PW, (B-T)+PW/2);   // post core
      ctx.fillStyle="#ffffff"; ctx.fillRect(px-PW/2+0.5, T, 2, B-T);            // left highlight
      ctx.fillStyle="#aeb8bf"; ctx.fillRect(px+PW/2-2, T, 2, B-T);              // right shade
      ctx.fillStyle="#8d979e"; ctx.fillRect(px-PW/2, B-1.5, PW, 1.5);           // ground ring
    }
    ctx.restore();
  }
  function render() {
    ctx.setTransform(SCALE,0,0,SCALE,0,0);
    ctx.clearRect(0,0,VW,SH);
    if (state!==_prevDrawState){ _prevDrawState=state; stateEnterAt=performance.now();
      if (state===ST.TABLE && TOUCH && CAR){ const rowH=TBL_ROWH,clipH=TBL_CLIPH,myp=myPosition(); tableScrollY=clamp((myp-1)*rowH-clipH/2+rowH/2,0,Math.max(0,20*rowH-clipH)); }
    }   // restart the print reveal
    const inMatch = state===ST.COUNTDOWN||state===ST.SERVE||state===ST.FLIGHT||state===ST.RESULT||state===ST.MATCHEND;
    // ---- LANDSCAPE: the MATCH centres the 550-wide field (translate OX) inside a full-width stadium;
    //      the teletext MENUS draw natively across the full VW (ttClear fills the whole view) ----
    if (inMatch) {
      touchBackBtn=null;                  // never let a stale menu back-button fire during gameplay
      drawBackdrop();                     // L0 stadium art across the full view
      drawHoardings();                    // L1 perimeter ad boards (view space)
      ctx.save(); ctx.translate(OX,0);    // centre the field/sprites/HUD
      {
        ctx.save();
        if (leftFooted){ ctx.translate(2*GCX,0); ctx.scale(-1,1); }   // mirror sprites around the goal centre
        drawGoal();                                                    // L2 goal+net (mirrored with the ball)
        drawKeeper(); drawDefenders(); drawBall(); drawStriker();      // keeper at the BACK (behind the defenders)
        ctx.restore();
      }

  // ---- input ----
  const input = { left:false, right:false };
  let spaceLock=false, enterLock=false, dragging=false;
  // touch detection + a hidden <input> to summon the iOS/Android soft keyboard for text entry
  const TOUCH = (window.matchMedia && window.matchMedia("(pointer: coarse)").matches) || ("ontouchstart" in window);
  const kbd = document.getElementById("kbd");
  function sanitizeField(v,max,wordOnly){ v=(v||"").toUpperCase(); v = wordOnly ? v.replace(/[^A-Z]/g,"") : v.replace(/[^A-Z0-9 .'-]/g,""); return v.slice(0,max); }
  function kbdOpen(val){ try{ kbd.value=val||""; kbd.focus(); }catch(e){} }
  function kbdClose(){ try{ kbd.blur(); }catch(e){} }
  function confirmName(){
    if(!nameBuf.trim()) return; menuSel=0; kbdClose();
    if (pendingMode==="daily"){ localStorage.setItem("vc_name", nameBuf.trim().toUpperCase()); startDaily(); }
    else agentIntro();   // career: Slick Vic's intro (State A) → Select Nationality / League
  }
  function togglePause(){ if(state===ST.SERVE||state===ST.FLIGHT||state===ST.RESULT) paused=!paused; }
  function forfeit(){            // give up the current match -> career home (counts as a loss) / menu
    paused=false;
    if (GMODE==="career" && CAR){ M.score=0; endMatch(); }
    else { GMODE="career"; H=null; clearResult(); state=ST.MENU; menuSel=0; }
  }
  function handleTableMenu(action){
    if(action==="menu") goBack();
    // trophy / future actions — placeholder, no-op until screens are built
  }
  function goBack(){             // ESC = back / forfeit
    if (state===ST.NAME){ kbdClose(); state=ST.MENU; menuSel=0; }
    else if (state===ST.NATSEL){ state=ST.NAME; kbdOpen(nameBuf); menuSel=0; }
    else if (state===ST.LEAGUESEL){ state=WORLD&&WORLD.nations?ST.NATSEL:ST.NAME; if(state===ST.NAME) kbdOpen(nameBuf); menuSel=0; }
    else if (state===ST.CLUBSEL){ if(pendingMode==="career"){ state=ST.LEAGUESEL; } else state=ST.MENU; menuSel=0; }
    else if (state===ST.TRNHUB){ GMODE="career"; state=ST.MENU; menuSel=0; }
    else if (state===ST.EMAIL){ state=ST.INBOX; }
    else if (state===ST.INBOX){ state=ST.SEASONEND; }
    else if (state===ST.TROPHY){ state=ST.TABLE; }
    else if (state===ST.TABLE || state===ST.SEASONEND){ GMODE="career"; state=ST.MENU; menuSel=0; }
    else if (state===ST.HORSESETUP){ kbdClose(); state=ST.MPMENU; menuSel=(mpMode==="classic"?0:1); }
    else if (state===ST.MPMENU){ state=ST.MENU; menuSel=0; }
    else if (state===ST.DAILYBOARD || state===ST.HORSEEND || state===ST.HORSEPASS){ GMODE="career"; H=null; state=ST.MENU; menuSel=0; }
    else if (state===ST.CLASSICEND || state===ST.CLASSICPASS){ GMODE="career"; C=null; state=ST.MENU; menuSel=0; }
    else if (state===ST.OVER){ clearResult(); state=ST.MENU; menuSel=0; }
    else if (state===ST.COUNTDOWN){ forfeit(); }   // not kicked off yet -> straight out
    else if (state===ST.SERVE||state===ST.FLIGHT||state===ST.RESULT){
      if (paused) forfeit();                       // ESC again (while paused) forfeits
      else if (canCheckout()) checkoutEarly();     // WIN secured -> ESC banks it early
      else paused=true;                            // otherwise ESC pauses
    }
  }
  // SPACE / select pressed (varies by screen)
  function pressSelect(){
    audio();
    if (state===ST.AGENT){ agentAdvance(); return; }   // Slick Vic: finish the reveal, or proceed to the next screen
    if (state===ST.MENU){
      const opts=menuOptions(), o=opts[menuSel];
      if (!TEAMS.length) return;                          // wait for roster
      if (o==="DAILY CHALLENGE"){ if(localStorage.getItem("vc_name")){ startDaily(); } else { pendingMode="daily"; nameBuf=""; state=ST.NAME; kbdOpen(""); } }
      else if (o==="MULTIPLAYER"){ menuSel=0; state=ST.MPMENU; }
      else if (o==="CONTINUE CAREER"){ CAR=loadCareer(); if(CAR){ GMODE="career"; setActiveLeague(CAR.leagueId); CAR.titleOdds=null; menuSel=0;
        if (!peekEvent()) seasonOver(); else state=ST.TABLE; } }
      else { GMODE="career"; pendingMode="career"; nameBuf=""; state=ST.NAME; kbdOpen(""); }   // NEW CAREER
    }
    else if (state===ST.MPMENU){ if(!TEAMS.length) return;
      mpMode = MP_OPTS[menuSel]==="CLASSIC" ? "classic" : "horse";
      hCount=2; hNames=["","","","","",""]; hWord="HORSE"; hField=0; state=ST.HORSESETUP; }
    else if (state===ST.NAME){ confirmName(); }
    else if (state===ST.NATSEL){ if(WORLD && WORLD.nations){
      pendingNation=WORLD.nations[menuSel].slug; agentTeamPick(); } }   // State B (Vic) appears here → then league select
    else if (state===ST.LEAGUESEL){ const ids=leagueList(); if(ids.length){
      pendingLeague=ids[clamp(menuSel,0,ids.length-1)]; setActiveLeague(pendingLeague); state=ST.CLUBSEL; stateEnterAt=performance.now(); menuSel=0; } }
    else if (state===ST.CLUBSEL){ if(TEAMS.length){
      const slug=TEAMS[menuSel].slug; GMODE="career"; newCareer(nameBuf.trim()||"You", slug, pendingNation, pendingLeague); state=ST.TABLE;
    } }
    else if (state===ST.TRNHUB){
      const T=CAR&&CAR.trn; if(!T) { state=ST.MENU; }
      else if (T.stage==='out'||T.stage==='won'){ CAR.trnDone=true; saveCareer(); enterSeasonEnd(); }
      else startTrnMatch();
    }
    else if (state===ST.TABLE){ startFixture(); }
    else if (state===ST.TROPHY){ state=ST.TABLE; }
    else if (state===ST.SEASONEND){ agentCallUp(); }   // State C: call-up check → transfer offers
    else if (state===ST.INBOX){ const n=(CAR.offers||[]).length; if(inboxSel<n) openEmail(inboxSel); else nextSeason(null); }
    else if (state===ST.COUNTDOWN){ countdownT=0; state=ST.SERVE; }   // skip the 3-2-1
    else if (state===ST.MATCHEND){ if(matchEndTimer<2.2) commitMatch(); }   // skip the burst (after a beat)
    else if (state===ST.DAILYBOARD || state===ST.HORSEEND){ GMODE="career"; H=null; clearResult(); state=ST.MENU; menuSel=0; }
    else if (state===ST.CLASSICEND){ GMODE="career"; C=null; clearResult(); state=ST.MENU; menuSel=0; }
    else if (state===ST.HORSEPASS){ startHorseTurn(); }
    else if (state===ST.CLASSICPASS){ startClassicTurn(); }
    else if (state===ST.OVER){ clearResult(); state=ST.MENU; menuSel=0; }
    else if (state===ST.SERVE){ if(!paused) triggerKick(); }
  }
  function pressEnter(){
    if (state===ST.NAME){ confirmName(); }
    else if (state===ST.MENU||state===ST.TABLE||state===ST.SEASONEND||state===ST.INBOX||state===ST.CLUBSEL||state===ST.NATSEL||state===ST.LEAGUESEL||state===ST.TRNHUB||state===ST.OVER||
             state===ST.MATCHEND||state===ST.DAILYBOARD||state===ST.HORSEPASS||state===ST.HORSEEND||
             state===ST.MPMENU||state===ST.CLASSICPASS||state===ST.CLASSICEND||state===ST.AGENT) pressSelect();
    else togglePause();                                   // in-match: ENTER = pause
  }
  function moveSel(dx,dy){
    if (state===ST.MENU){ menuSel += dy; const n=menuOptions().length; menuSel=(menuSel+n)%n; }
    else if (state===ST.MPMENU){ menuSel += dy; menuSel=(menuSel+MP_OPTS.length)%MP_OPTS.length; }
    else if (state===ST.INBOX){ const n=(CAR.offers||[]).length+1; inboxSel=((inboxSel+dy)%n+n)%n; }
    else if (state===ST.CLUBSEL){ const rows=10, n=TEAMS.length||20;   // 2 cols x 10, column-major
      let i=menuSel + dy + dx*rows; menuSel=((i%n)+n)%n; }
    else if (state===ST.NATSEL){ const rows=8, n=(WORLD&&WORLD.nations)?WORLD.nations.length:16;
      let i=menuSel + dy + dx*rows; menuSel=((i%n)+n)%n; }
    else if (state===ST.LEAGUESEL){ const n=Math.max(1,leagueList().length); menuSel=((menuSel+dy)%n+n)%n; }
    else { if(dx<0) input.left=true; if(dx>0) input.right=true; mouseTargetX=null; }   // in-match: arrows move man (override mouse)
  }
  // TAB / SHIFT+TAB — cycle the on-screen selection forward/back (wrapping) on any menu/select screen.
  // A flat sequential walk through the items, which reads naturally regardless of grid layout.
  function tabCycle(dir){
    if (state===ST.MENU){ const n=menuOptions().length; menuSel=(menuSel+dir+n)%n; }
    else if (state===ST.MPMENU){ const n=MP_OPTS.length; menuSel=(menuSel+dir+n)%n; }
    else if (state===ST.INBOX){ const n=((CAR&&CAR.offers)?CAR.offers.length:0)+1; inboxSel=(inboxSel+dir+n)%n; }
    else if (state===ST.CLUBSEL){ const n=TEAMS.length||20; menuSel=(menuSel+dir+n)%n; }
    else if (state===ST.NATSEL){ const n=(WORLD&&WORLD.nations)?WORLD.nations.length:16; menuSel=(menuSel+dir+n)%n; }
    else if (state===ST.LEAGUESEL){ const n=Math.max(1,leagueList().length); menuSel=(menuSel+dir+n)%n; }
  }
  window.addEventListener("keydown",(e)=>{
    if (document.activeElement===kbd) return;   // text entry handled by the hidden input's own listeners
    const k=e.code;
    if (k==="Escape"){ e.preventDefault(); goBack(); return; }
    if (state===ST.NAME){
      if (k==="Enter"){ e.preventDefault(); if(!enterLock){enterLock=true; pressEnter();} return; }
      if (k==="Backspace"){ e.preventDefault(); nameBuf=nameBuf.slice(0,-1); return; }
      if (e.key && e.key.length===1 && nameBuf.length<14 && /[A-Za-z0-9 .'-]/.test(e.key)){
        e.preventDefault(); nameBuf += e.key.toUpperCase();                       // CAPS only
      }
      return;
    }
    if (state===ST.HORSESETUP){      // fields: [players count] [name x N] [word]
      const last=mpLast();
      if (k==="Tab"){ e.preventDefault();   // TAB jumps to the next field (Shift+TAB previous), like a web form
        hField = e.shiftKey ? (hField<=0?last:hField-1) : (hField>=last?0:hField+1);
        if (hField===0) kbdClose(); else kbdOpen((mpMode!=="classic"&&hField===last)?hWord:(hNames[hField-1]||"")); return; }
      if (k==="Enter"){ e.preventDefault(); if(!enterLock){ enterLock=true; if(hField<last) hField++; else mpStart(); } return; }
      if (k==="ArrowDown"){ e.preventDefault(); hField=Math.min(last,hField+1); return; }
      if (k==="ArrowUp"){ e.preventDefault(); hField=Math.max(0,hField-1); return; }
      if (hField===0){             // player-count selector
        if (k==="ArrowLeft"){ e.preventDefault(); hCount=Math.max(HORSE_MIN,hCount-1); return; }
        if (k==="ArrowRight"){ e.preventDefault(); hCount=Math.min(HORSE_MAX,hCount+1); return; }
        if (/^[2-6]$/.test(e.key)){ e.preventDefault(); hCount=+e.key; if(hField>mpLast()) hField=mpLast(); return; }
        return;
      }
      const isWord=mpMode!=="classic" && hField===last, idx=hField-1, cur=isWord?hWord:(hNames[idx]||"");
      if (k==="Backspace"){ e.preventDefault(); if(isWord) hWord=cur.slice(0,-1); else hNames[idx]=cur.slice(0,-1); return; }
      if (e.key && e.key.length===1){
        const max=isWord?8:12, ok=isWord?/[A-Za-z]/.test(e.key):/[A-Za-z0-9 .'-]/.test(e.key);
        if (ok && cur.length<max){ e.preventDefault(); const nv=cur+e.key.toUpperCase(); if(isWord) hWord=nv; else hNames[idx]=nv; }
      }
      return;
    }
    if (k==="KeyF"){ e.preventDefault(); toggleFullscreen(); return; }   // F = fullscreen (typing screens return earlier)
    if (k==="KeyM"){ e.preventDefault(); toggleMute(); return; }          // M = mute toggle
    if (state===ST.TABLE && k==="KeyE" && titleClinched()){ e.preventDefault(); endSeasonEarly(); return; }   // skip the run-in
    if (state===ST.TABLE && k==="KeyT"){ e.preventDefault(); state=ST.TROPHY; return; }    // trophy room
    if (state===ST.EMAIL){
      if (k==="KeyA"){ e.preventDefault(); emailAction("accept"); return; }
      if (k==="KeyD"){ e.preventDefault(); emailAction("decline"); return; }
    }
    if(k==="Tab"){ e.preventDefault(); audio(); tabCycle(e.shiftKey?-1:1); return; }   // TAB cycles menu selection
    if(k==="ArrowLeft"){ e.preventDefault(); moveSel(-1,0); }
    else if(k==="ArrowRight"){ e.preventDefault(); moveSel(1,0); }
    else if(k==="ArrowUp"){ e.preventDefault(); moveSel(0,-1); }
    else if(k==="ArrowDown"){ e.preventDefault(); moveSel(0,1); }
    else if(k==="Enter"){ e.preventDefault(); if(!enterLock){ enterLock=true; pressEnter(); } }
    else if(k==="Space"){ e.preventDefault(); if(!spaceLock){ spaceLock=true; pressSelect(); } }
  });
  window.addEventListener("keyup",(e)=>{
    if(e.code==="ArrowLeft") input.left=false;
    else if(e.code==="ArrowRight") input.right=false;
    else if(e.code==="Space") spaceLock=false;
    else if(e.code==="Enter") enterLock=false;
  });
  // ---- hidden-input text entry (soft keyboard on phones; also used on desktop while focused) ----
  kbd.addEventListener("input",()=>{
    if (state===ST.NAME){ nameBuf=sanitizeField(kbd.value,14,false); if(kbd.value!==nameBuf) kbd.value=nameBuf; }
    else if (state===ST.HORSESETUP && hField>0){ const isWord=mpMode!=="classic" && hField===hCount+1, idx=hField-1, max=isWord?8:12;
      const v=sanitizeField(kbd.value,max,isWord); if(isWord) hWord=v; else hNames[idx]=v; if(kbd.value!==v) kbd.value=v; }
  });
  kbd.addEventListener("keydown",(e)=>{
    e.stopPropagation();   // confirmName() blurs kbd mid-handler, so without this the event bubbles to window.keydown with stale state
    if (e.key==="Enter"){ e.preventDefault();
      if (state===ST.NAME) confirmName();
      else if (state===ST.HORSESETUP){ const last=mpLast(); if(hField<last){ hField++; kbd.value=(mpMode!=="classic"&&hField===last)?hWord:(hNames[hField-1]||""); } else { kbdClose(); mpStart(); } }
    } else if (e.key==="Escape"){ e.preventDefault(); kbdClose(); goBack(); }
    else if (state===ST.HORSESETUP && (e.key==="ArrowUp"||e.key==="ArrowDown")){ e.preventDefault();
      const last=mpLast(); hField = e.key==="ArrowDown"?Math.min(last,hField+1):Math.max(0,hField-1);

          const wide = (fx!=null) && (fx>RPOST+POSTTOL || fx<LPOST-POSTTOL);
          const over = (zz!=null) && (zz>BARH);
          out.push({kt, cX:r.contactX, cDbx:r.contactDbx, fx, z:zz, hk:r.hk, net:r.innet?1:0,
                    wide:wide?1:0, over:over?1:0, res:r.result, sc:r.scored});
        }
        return out;
      }
    };
  }
})();

// ---- PWA: register the service worker (installable / "Add to Home Screen" + offline). Guarded
// with typeof so the Node smoke harness (no `navigator`) skips it; http(s) only (not file://).
if (typeof navigator !== "undefined" && navigator.serviceWorker && location.protocol.indexOf("http") === 0) {
  var isLocalDev = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  if (isLocalDev) {
    // LOCAL DEV: never let a service worker cache stale assets (it bit us twice). Unregister any existing
    // SW + wipe its caches so a plain reload always serves the freshest files. If a SW was controlling this
    // load (so the assets you're seeing may be cached), reload ONCE after cleanup — guarded by a session
    // flag so it can never loop. Production (GitHub Pages) still registers the SW normally below.
    var hadController = !!navigator.serviceWorker.controller;
    Promise.all([
      navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }).catch(function () {}),
      (window.caches && caches.keys) ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }).catch(function () {}) : null
    ]).then(function () {
      if (hadController && !sessionStorage.getItem("sw_cleared")) { sessionStorage.setItem("sw_cleared", "1"); location.reload(); }
    });
  } else {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function (e) { try { console.warn("SW register failed:", e); } catch (_) {} });
    });
  }
}
